/* ★#2012 → V5 查表判定条件（用户 2026-11-07 定案）：
   条件元素 = {字段, 查表:{表,键,匹配,值,匹配模式,存在检查,不存在,行筛选}} ——
   ① 必须带「字段」键：条件渲染在所属字段的条件单元格内（该字段条件下方），不设独立列；
   ② 「匹配」恒为 `[字段]`（自动生成，不允许手动修改）；
   ③ 「存在检查」必须为 true；「不存在」=true 即「未查到」——界面用「查到 / 未查到」单选器表达；
   语义（引擎 match_any ①分支）：条件成立 ⟺ 查表命中（查到）或未命中（未查到），与同规则其它条件 AND。
   兼容呈现：旧 JSON 里不带「字段」键的查表条件（V4 及更早的畸形形态）显示在首个输入字段列下、
   块内标红警告并给「关联字段」选择器补救，不静默丢弃。 */
function lookupGateRulesArr() {
  return isFilterTableStage(curStage) ? getFilterRules() : (getFd()["规则"] || []);
}
function lookupGateBlockHTML(ri, ci, c, fields) {
  const lut = (c && c["查表"]) || {};
  const stNames = allTableNames();
  const curTable = lut["表"] || "";
  const curTbl = anyTable(curTable);
  const tblHeader = (curTbl && curTbl["表头"]) ? curTbl["表头"].filter(x => String(x).trim()) : [];
  const upd = (k, v) => `updateLookupGate(${ri},${ci},'${k}',${v})`;
  const bound = c["字段"] || "";
  const expect = bound ? `[${bound}]` : "";
  let h = `<div class="fld-cond">`;
  h += `<div class="fld-cond-head"><span class="fld-cond-tag">查表判定</span>`
     + `<button class="cond-del" title="删除该查表判定条件（二次确认）" onclick="delLookupGateCond(${ri},${ci})">✕</button></div>`;
  if (!bound) {
    // 旧形态（无「字段」键）补救入口：关联字段选择器（选定后同步重写匹配值）
    h += `<label class="cl-row"><span>关联字段</span><select onchange="setLookupGateField(${ri},${ci},this.value)"><option value="">— 未关联（V5 必须关联）—</option>`;
    for (const f of (fields || [])) h += `<option value="${escAttr(f)}" ${f===bound?'selected':''}>${escHtml(f)}</option>`;
    h += `</select></label>`;
    h += `<div class="fld-cond-warn">⚠️ 未关联字段：V5 规范要求查表判定必须关联字段，请选择上方「关联字段」</div>`;
  }
  // 匹配值只读：静态胶囊（varPreviewHTML 渲染「键别名:键」，非法引用红底）；不可编辑、不可进编辑态
  const mvShown = expect || lut["匹配"] || "";
  h += `<label class="cl-row"><span>匹配值</span><span class="lg-match" title="匹配值恒为 [关联字段]，自动生成、不可手动修改；变量显示为「键别名:键」">${mvShown ? varPreviewHTML(mvShown, fields || []) : ""}</span></label>`;
  if (bound && (lut["匹配"] || "") !== expect) {
    h += `<div class="fld-cond-warn">⚠️ 匹配值与关联字段不一致（现为 ${escHtml(lut["匹配"] || "空")}）：V5 规范匹配值恒为 [字段]，重选关联字段可自动重写</div>`;
  }
  h += `<label class="cl-row"><span>目标表</span><select onchange="${upd("表", "this.value")}"><option value="">— 选表 —</option>`;
  for (const s of stNames) h += `<option value="${escAttr(s)}" ${s===curTable?'selected':''}>${escHtml(s)}${runtimeTables()[s] ? "（运行时·外部）" : ""}</option>`;
  h += `</select></label>`;
  h += `<label class="cl-row"><span>查询字段</span><select onchange="${upd("键", "this.value")}"><option value="">— 表头列 —</option>`;
  for (const x of tblHeader) h += `<option ${String(x)===String(lut["键"] || "")?'selected':''}>${escHtml(x)}</option>`;
  h += `</select></label>`;
  h += `<label class="cl-row"><span>匹配模式</span><select onchange="${upd("匹配模式", "this.value")}"><option value="">精确（默认）</option><option value="包含" ${(lut["匹配模式"]==="包含")?'selected':''}>包含（表值 in 匹配值）</option><option value="被包含" ${(lut["匹配模式"]==="被包含")?'selected':''}>被包含（匹配值 in 表值）</option></select></label>`;
  // ★查到 / 未查到 单选器（用户 2026-11-07 定）：查到 = 存在检查；未查到 = 存在检查 + 不存在（取反）
  const mode = lut["不存在"] ? "miss" : "hit";
  h += `<div class="cl-row"><span>判定</span><span class="lg-mode">`
     + `<label><input type="radio" name="lgm_${ri}_${ci}" ${mode==='hit'?'checked':''} onchange="setLookupGateMode(${ri},${ci},'hit')">查到</label>`
     + `<label><input type="radio" name="lgm_${ri}_${ci}" ${mode==='miss'?'checked':''} onchange="setLookupGateMode(${ri},${ci},'miss')">未查到</label>`
     + `</span></div>`;
  if (!lut["存在检查"]) {
    h += `<div class="fld-cond-warn">⚠️ 缺少存在检查（V5 规范要求 查到/未查到 二选一）：当前该条件永不命中，请点上方单选器修正</div>`;
  }
  h += `<label class="cl-row"><span>取值列</span><select onchange="${upd("值", "this.value")}"><option value="">— 表头列 —</option>`;
  for (const x of tblHeader) h += `<option ${String(x)===String(lut["值"] || "")?'selected':''}>${escHtml(x)}</option>`;
  h += `</select></label>`;
  if (Array.isArray(lut["行筛选"]) && lut["行筛选"].length) {
    h += `<label class="cl-row"><span>行筛选</span><span class="hint" style="flex:1">${lut["行筛选"].length} 条（目标表行条件，JSON 维护）</span></label>`;
  }
  h += `</div>`;
  return h;
}
function addLookupGateCond(ri, f) {
  const rule = lookupGateRulesArr()[ri];
  if (!rule || !f) return;
  pushHistory();
  if (!rule["条件"]) rule["条件"] = [];
  rule["条件"].push({ "字段": f, "查表": { "表": (allTableNames()[0] || ""), "键": "", "值": "", "匹配": `[${f}]`, "存在检查": true } });
  log("添加查表判定条件", `${curStage} 第 ${ri+1} 行 ${f} ＋查表判定`);
  renderPanel(); scheduleSave();
}
function updateLookupGate(ri, ci, key, val) {
  const c = (lookupGateRulesArr()[ri]["条件"] || [])[ci];
  if (!c || !c["查表"]) return;
  pushHistory();
  c["查表"][key] = val;
  if (key === "表") { c["查表"]["键"] = ""; c["查表"]["值"] = ""; }   // 切表 → 键/值重置（列选项随表变）
  log("修改查表判定条件", `${curStage} 第 ${ri+1} 行 条件${ci+1} ${key}`);
  renderPanel(); scheduleSave();
}
/* 关联字段（含旧形态补救）：写字段键并同步重写匹配值 = [字段] */
function setLookupGateField(ri, ci, f) {
  const c = (lookupGateRulesArr()[ri]["条件"] || [])[ci];
  if (!c || !c["查表"] || !f) return;
  pushHistory();
  c["字段"] = f;
  c["查表"]["匹配"] = `[${f}]`;
  log("关联查表判定字段", `${curStage} 第 ${ri+1} 行 条件${ci+1} → ${f}（匹配值同步重写为 [${f}]）`);
  renderPanel(); scheduleSave();
}
/* 查到 / 未查到 单选器：查到 = 存在检查；未查到 = 存在检查 + 不存在（取反）。两态都保证存在检查为 true */
function setLookupGateMode(ri, ci, mode) {
  const c = (lookupGateRulesArr()[ri]["条件"] || [])[ci];
  if (!c || !c["查表"]) return;
  pushHistory();
  c["查表"]["存在检查"] = true;
  if (mode === "miss") c["查表"]["不存在"] = true;
  else delete c["查表"]["不存在"];
  log("修改查表判定", `${curStage} 第 ${ri+1} 行 条件${ci+1} → ${mode === "miss" ? "未查到" : "查到"}`);
  renderPanel(); scheduleSave();
}
function delLookupGateCond(ri, ci) {
  const conds = lookupGateRulesArr()[ri]["条件"] || [];
  const c = conds[ci];
  if (!c || !c["查表"]) return;
  const lut = c["查表"];
  const desc = `${c["字段"] || "未关联字段"}：${lut["表"] || "?"}.${lut["键"] || "?"} ${lut["不存在"] ? "未查到" : "查到"}`;
  if (!confirm(`确认删除第 ${ri+1} 行的查表判定条件：${desc}？\n（只删这一个；删除前会写入撤销栈，可从左侧「撤销」恢复。）`)) return;
  pushHistory();
  conds.splice(ci, 1);
  log("删除查表判定条件", `${curStage} 第 ${ri+1} 行 条件${ci+1}`);
  renderPanel(); scheduleSave();
}

function renderFilterTableHTML(rules, dispFields) {
  const tnames = filterTableNames();
  // 左栏：序号；右栏：操作；中栏：各勾选字段（可滑动、带阴影）
  let leftBody = "", midBody = "", rightBody = "";
  rules.forEach((rule, ri) => {
    // 左：序号
    leftBody += `<tr data-ri="${ri}"><td class="ft-col-num">${ri+1}</td></tr>`;
    // 中：各字段条件单元格（AND）
    let midRow = `<tr data-ri="${ri}">`;
    dispFields.forEach(f => {
      midRow += `<td data-fi="${escAttr(f)}">${filterCondCellHTML(rule, ri, f, tnames, dispFields)}</td>`;
    });
    midRow += `</tr>`;
    midBody += midRow;
    // 右：操作
    rightBody += filterOpRowHTML(ri);
  });
  let h = `<div class="rules-grid">`;
  // 左：冻结序号
  h += `<div class="rules-pane rules-pane-left"><table class="rules rules-left"><thead><tr><th class="col-num" style="width:36px">#</th></tr></thead><tbody>${leftBody}</tbody></table></div>`;
  // 中：条件列直接落在此（横向滚动交给外层 .rules-view-body 统一处理）
  h += `<div class="rules-pane rules-pane-mid"><table class="rules rules-mid"><thead><tr>`;
  dispFields.forEach(f => { h += condHeadHTML(f, new Set(), false); });
  h += `</tr></thead><tbody>${midBody}</tbody></table></div>`;
  // 右：冻结操作
  h += `<div class="rules-pane rules-pane-right"><table class="rules rules-right"><thead><tr><th class="col-op" style="width:96px">操作</th></tr></thead><tbody>${rightBody}</tbody></table></div>`;
  h += `</div>`;
  return h;
}

/* ★设计标准：规则表渲染（（短路表字段级与检测表共用））——
   每行 = 多个输入字段条件（行内 AND）+ 1 输出；空条件数组 = 全通配兜底行（永远命中保证不漏）。
   ★条件级增删：同字段多条件用「＋且」追加（弹菜单选 值比较→addCond 或 查表判定→addLookupGateCond），每个条件右上角「✕」按 ci 精确删除该一个
     （delCond，破坏性操作走二次确认弹窗；不误删同字段其他条件）。删除是唯一入口，不靠清空算子/值代替。
   ★三栏分离结构（解决「滚动条溢出冻结列 + 阴影脱离」）：
     · 左 pane = # 序号列（固定不滚动）
     · 中 pane = 条件列（独立横向滚动，scrollbar 仅在此栏，永不溢出到冻结列）
     · 右 pane = 输出/操作列（固定不滚动）
   三栏各为独立 <table>，行高由 syncRuleRowHeights() 跨栏锁定对齐；middle pane 内的阴影随其滚动自然跟随。 */

/* 规则表 · 条件列来源标签（仅检测表模式）：上一环节输出 → 青；上游透传 → 灰。★文案零项目名 */
function srcTagHTML(f, prevOut, stageLevelMode) {
  if (!stageLevelMode) return "";
  return prevOut.has(f)
    ? `<span class="src-tag src-prev">上一环节·输出</span>`
    : `<span class="src-tag src-up">上游·透传</span>`;
}
/* 上游遍历查 api_key_name（蛇形键名，非界面 '键'）：同 fieldDesc 遍历全部环节「输出字段」 */
function fieldApiKey(f) {
  const logic = (CONFIG && CONFIG["转换逻辑"]) || {};
  for (const sk of Object.keys(logic)) {
    const fd = (logic[sk]["输出字段"] || {})[f];
    if (fd && fd["api_key_name"]) return fd["api_key_name"];
  }
  return "";
}
/* 字段「层」查询（用户 2026-11-12 定：凡渲染「键别名+键」之处都要一并渲染「层」）：
   取法与 kmRows 同源——上游环节该字段键映射表的改名条目所在桶优先，否则该环节输出字段的「键层」声明，
   全链未声明 → 单据头缺省。取值只读，不改配置。 */
function fieldLayer(f) {
  const logic = (CONFIG && CONFIG["转换逻辑"]) || {};
  for (const sk of Object.keys(logic)) {
    const st = logic[sk] || {};
    const fd = (st["输出字段"] || {})[f];
    if (!fd) continue;
    const ent = kmEntry(st, f);
    return ent.target ? ent.layer : outFieldLayer(fd);
  }
  return KM_DEFAULT_BUCKET;
}
/* 字段短键别名（表头主行用）：跨环节「输出字段[f] 的键别名（存量 JSON 键「中文名」）」→ 顶层配置区「字段中文名」→ ""（空=用原键）。
   ⚠ 刻意不取「说明」(fieldDesc)：说明是长句（如「company_id 兜底值（无付款账号时用）…」），
     只能作 hover 提示，不能当表头标题，否则整句塞进列头会把表格撑乱（用户报的『标签有问题』之一）。 */
function fieldShortName(f) {
  const logic = (CONFIG && CONFIG["转换逻辑"]) || {};
  for (const sk of Object.keys(logic)) {
    const fd = (logic[sk]["输出字段"] || {})[f];
    if (fd && fd["中文名"]) return fd["中文名"];
  }
  return ((CONFIG && CONFIG["字段中文名"]) || {})[f] || "";
}
/* 规则表 · 中栏表头某条件列：三行紧凑 vstack（层 在上 / 短键别名 在中 / 键 在下），『说明』严格仅 hover。
   ★统一口径（与菜单 fieldMenuLabel、输出字段选项卡栏 fieldTabsHTML 同源）：
     首行 = 层（单据头 / 明细行，让用户一眼看出这个键属于报文哪一层，#2013 键层贯穿）；
     中行 = 中文字段用键本身；英文字段取跨环节键别名（存量 JSON 键「中文名」）/「字段中文名」，缺则原键；
     末行 = 键（fieldApiKey 跨环节取）；说明（长句）只作 hover 提示。
   ⛔ 关键约束：data-tip / onmouseenter / onmouseleave 等属性必须拼进 <th> 开标签，
      绝不能落在单元格内容区——早期版本把提示串放在 </th> 前的内容里，导致
      data-tip="…" onmouseenter=… 以纯文本泄露到列头（Req#5 要求「说明仅 hover」，
      却因属性位置错变成直接可见；有说明的列露垃圾、没说明的列干净 → 切字段时表头观感不一致）。 */
function condHeadHTML(f, prevOut, stageLevelMode) {
  const isCn = /[\u4e00-\u9fa5]/.test(f);
  const shortName = fieldShortName(f);
  const main = isCn ? f : (shortName || f);      // 中行：中文键=对象键本身；英文键=键别名（缺则原样）
  const ak = fieldApiKey(f);
  const sub = (ak && ak !== main) ? ak : "";      // 末行 = 键
  const layer = fieldLayer(f);                    // 首行 = 层（恒有值，缺省单据头）
  const desc = fieldDesc(f) || "";                // 说明（长句）仅作 hover
  const tipText = (desc && desc !== main && desc !== f) ? desc : "";
  // ★属性拼进开标签（不是在内容里）
  const tip = tipText ? ` data-tip="${escAttr(tipText)}" onmouseenter="fieldTipShow(this)" onmouseleave="fieldTipHide()"` : "";
  const srcTag = srcTagHTML(f, prevOut, stageLevelMode);
  // ★统一规范（用户重申无数遍）：无论有无键，末行（th-sub）占位必须恒在——
  //   缺键声明时仍渲染空 <div class="th-sub">，靠 CSS min-height 预留一行高，保证所有列头三行等高、格式统一。
  const subHTML = `<div class="th-sub">${escHtml(sub)}</div>`;
  return `<th style="min-width:96px"${tip}><div class="th-layer">${escHtml(layer)}</div><div class="th-main">${escHtml(main)}</div>${subHTML}${srcTag}</th>`;
}
/* 规则表 · 通配条件格（该字段无条件）：灰色「通配」算子下拉，点选即新建该字段条件 */
function wildcardCondHTML(ri, f) {
  const selColor = opColor("");
  return `<div class="cond-cell">
          <div class="op-sel" style="background:transparent;color:${selColor}" onclick="toggleOpMenu(event,${ri},'${escAttr(f)}',0)" title="选择算子">
            <span>通配</span><span class="op-caret">▼</span>
          </div>
        </div>`;
}
/* 规则表 · 存在性条件（行值 ∈ 某表某列）：表 / 列 / 模式 三下拉 + 删除 + 转值比较
   ★短路表内「表」下拉只列静态表；存量外部表引用照实显示并挂「外部表·禁止」红标 */
function lookupCondHTML(ri, f, ci, c) {
  const tbl = c["表"] || "";
  const names = lookupTableNames();
  const colOpts = filterTableCols(tbl).map(col =>
    `<option value="${escAttr(col)}" ${(c["列"]===col)?'selected':''}>${escHtml(col)}</option>`).join("");
  return `<div class="cond-cell">
              <div class="ft-cell-head">表 <select class="ft-sel" onchange="updateCond(${ri},'${escAttr(f)}',${ci},'表',this.value)">
                  ${names.map(t=>`<option value="${escAttr(t)}" ${(tbl===t)?'selected':''}>${escHtml(t)}</option>`).join("")}
                  ${tbl && names.indexOf(tbl)<0 ? `<option value="${escAttr(tbl)}" selected>${escHtml(tbl)}（运行时·外部 ⚠违规）</option>` : ""}
                </select>${extWarnTag(tbl)}</div>
              <div class="ft-cell-head">列 <select class="ft-sel" onchange="updateCond(${ri},'${escAttr(f)}',${ci},'列',this.value)">
                  ${colOpts || `<option value="">（先选表）</option>`}
                </select></div>
              <div class="ft-cell-head">模式 <select class="ft-sel" onchange="updateCond(${ri},'${escAttr(f)}',${ci},'模式',this.value)">
                  <option value="精确" ${(c["模式"]||"精确")==="精确"?'selected':''}>精确（行值=表列值）</option>
                  <option value="包含" ${(c["模式"]==="包含")?'selected':''}>包含（表列值 in 行值）</option>
                  <option value="被包含" ${(c["模式"]==="被包含")?'selected':''}>被包含（行值 in 表列值）</option>
                </select></div>
              <button class="cond-del" title="删除该条件（二次确认）" onclick="delCond(${ri},'${escAttr(f)}',${ci})">✕</button>
              <button class="cond-mini" title="改回「算子+值」比较形态" onclick="ruleCondToValue(${ri},'${escAttr(f)}',${ci})">值比较</button>
            </div>`;
}
/* 规则表 · 值比较条件（算子 + 值）：算子可作用于「查表所得值」——点「查表⌄」切为查表子表单 */
function valueCondHTML(ri, f, ci, c) {
  const curOp = c["算子"] || "";
  const selColor = opColor(curOp);
  const selStyle = curOp
    ? `background:${selColor};color:#fff;border-color:${selColor}`
    : `background:transparent;color:${selColor}`;
  let h = `<div class="cond-cell">
            <div class="cond-head">
              <div class="op-sel" style="${selStyle}" onclick="toggleOpMenu(event,${ri},'${escAttr(f)}',${ci})" title="选择算子">
                <span>${curOp || "通配"}</span><span class="op-caret">▼</span>
              </div>
              <button class="cond-del" title="删除该条件（仅删本字段的第 ${ci+1} 个条件，二次确认）" onclick="delCond(${ri},'${escAttr(f)}',${ci})">✕</button>
            </div>`;
  if (curOp && !NO_VALUE_OPS.includes(curOp)) {
    if (c["查表"]) {
      h += condLookupHTML(ri, f, ci, c);
    } else {
      h += valFieldHTML(c["值"] ?? "", "值", `updateCond(${ri},'${escAttr(f)}',${ci},'val',this.value)`, "cond-val");
      h += `<button class="cond-mini" title="改用查表取值：先按静态表查到一列值，再作为该算子比较的右值（支持 [字段] 引用上游中间量做链式查表）" onclick="toggleCondLookup(${ri},'${escAttr(f)}',${ci})">查表⌄</button>`;
    }
  }
  return h + `</div>`;
}
/* 规则表 · 某条件格：无条件 → 通配格；有条件 → 逐条（「且」连接）+ 「＋且」追加入口（弹菜单选形态） */
function condCellHTML(ri, f, pairs, fields) {
  if (!pairs || !pairs.length) return wildcardCondHTML(ri, f);
  let h = "";
  pairs.forEach((p, k) => {
    const c = p.c;
    if (k > 0) h += `<div class="cond-and">且</div>`;
    // ★条件单元三种形态（与过滤表同构、与引擎 match_any 一致）：
    //   有「查表」= ⓪ 查表判定（V5，必须关联字段）→ 传真实数组下标 p.ci（delLookupGateCond 按真实下标定位）；
    //   有「表」= ① 存在性；否则 = ② 值比较 → 传分组内局部下标 k（updateCond/delCond 按 filter(字段) 解析）
    h += c["查表"] ? lookupGateBlockHTML(ri, p.ci, c, fields || []) : c["表"] ? lookupCondHTML(ri, f, k, c) : valueCondHTML(ri, f, k, c);
  });
  // 已有条件 → 单「＋且」入口（同字段多条件，AND 语义；「或」通过添加规则行实现）
  //   点击弹菜单：值比较 / 查表判定（V5）；存在性形态不再提供新增入口（V5 查表判定是其超集，存量兼容渲染）
  h += `<button class="cond-add" title="添加且条件（同一字段多个条件 AND）：点击后选 值比较 或 查表判定" onclick="openCondAddMenu(event,'rule',${ri},'${escAttr(f)}')">＋且</button>`;
  return h;
}
/* 规则表 · 右栏行：检测表 = 检测结果（异常说明）；其余 = 输出动作 + 行操作 */
function ruleRightRowHTML(rule, ri, checkMode) {
  let outCell;
  if (checkMode) {
    // 检测表：动作固定「报异常」，不做类型选择；命中即记入异常清单，不弃行；说明支持 [字段] 引用（引擎 resolve_refs）
    const msg = (rule["输出"] && rule["输出"]["说明"]) || "";
    outCell = varFieldHTML(msg, `updateOut(${ri},'msg',this.value)`, { placeholder: "检测结果说明（命中时报告的内容，支持 [字段] 引用）", multiline: String(msg).length > 20, cls: "out-msg" });
  } else {
    outCell = renderOutCell(rule["输出"], ri);
  }
  const copyTip = checkMode ? "复制此检测规则" : "复制此规则行";
  return `<tr data-ri="${ri}">`
    + `<td class="frozen-out"><div class="out-cell">${outCell}</div></td>`
    + `<td class="frozen-op"><div class="row-ops">
            <button class="btn small" title="上移" onclick="moveRule(${ri},-1)">↑</button>
            <button class="btn small" title="下移" onclick="moveRule(${ri},1)">↓</button>
            <button class="btn small ghost" title="${copyTip}" onclick="copyRule(${ri})">⧉</button>
            <button class="btn small danger" title="删除" onclick="delRule(${ri})">✕</button>
          </div></td>`
    + `</tr>`;
}
/* 上一非边界环节的输出字段集（用于表头来源标签）；非检测表（环节级）模式返回空集 */
function prevStageOutFields() {
  if (!isSingleRuleStage(curStage)) return new Set();
  const keys = stageKeys();
  const cidx = keys.indexOf(curStage);
  for (let i = cidx - 1; i >= 0; i--) {
    if (!isBoundaryKey(keys[i])) return new Set(Object.keys((CONFIG["转换逻辑"][keys[i]]["输出字段"] || {})));
  }
  return new Set();
}

function renderRulesTableHTML(rules, inputFields, opts) {
  // opts.check = 检测表模式：右栏为「检测结果」列（异常说明，动作固定报异常）而非「输出」动作选择
  const checkMode = !!(opts && opts.check);
  // 检测表模式：输入条件字段 = 环环相扣 = 上一环节输出为主 + 上游透传字段为辅。
  //   计算上一环节输出字段集，用于在表头标注来源（上一环节·输出 / 上游·透传）。文案零项目名，换项目不用改。
  const stageLevelMode = isSingleRuleStage(curStage);
  const prevOut = prevStageOutFields();
  // —— 中栏表头：条件列 ——
  let midHead = "";
  for (const f of inputFields) midHead += condHeadHTML(f, prevOut, stageLevelMode);
  // —— 三栏行体 ——
  let leftBody = "", midBody = "", rightBody = "";
  rules.forEach((rule, ri) => {
    // 同字段可多个条件（如 检测11：FCustId 包含 W10002 且 ≠W10002 且 ≠W100020071）
    // V5：查表判定条件必须带「字段」键；旧畸形形态（无字段键）兜底归入首个输入字段列，不静默丢弃
    // condMap 值为 {c, ci} 对：ci = 条件数组真实下标（查表判定按真实下标定位；值/存在性条件仍走分组局部序）
    const condMap = {};
    (rule["条件"] || []).forEach((c, ci) => {
      const key = c["字段"] || (c["查表"] ? (inputFields[0] || "") : undefined);
      (condMap[key] = condMap[key] || []).push({ c, ci });
    });
    // 左：序号
    leftBody += `<tr data-ri="${ri}"><td class="row-num">${ri+1}</td></tr>`;
    // 中：条件列
    let midRow = `<tr data-ri="${ri}">`;
    for (const f of inputFields) {
      midRow += `<td data-field="${escAttr(f)}"><div class="cond-group">` + condCellHTML(ri, f, condMap[f] || [], inputFields) + `</div></div></td>`;
    }
    midRow += `</tr>`;
    midBody += midRow;
    // 右：检测结果（说明）/ 输出 / 操作
    rightBody += ruleRightRowHTML(rule, ri, checkMode);
  });
  // —— 组装三栏 ——
  let h = `<div class="rules-grid">`;
  // 左 pane（# 序号列，横向冻结 sticky-left）
  h += `<div class="rules-pane rules-pane-left"><table class="rules rules-left"><thead><tr><th class="col-num" style="width:30px">#</th></tr></thead><tbody>${leftBody}</tbody></table></div>`;
  // 中 pane：整张条件表直接落在此（不另起内层横向滚动容器）——横向滚动交给外层 .rules-view-body 统一处理
  h += `<div class="rules-pane rules-pane-mid">`
     + `<table class="rules rules-mid"><thead><tr>${midHead}</tr></thead><tbody>${midBody}</tbody></table>`
     + `</div>`;
  // 右 pane（检测结果/输出 + 操作列，横向冻结 sticky-right）
  h += `<div class="rules-pane rules-pane-right"><table class="rules rules-right"><thead><tr><th class="col-out" style="min-width:${checkMode ? 280 : 340}px">${checkMode ? "检测结果" : "输出"}</th><th class="col-op" style="width:70px">操作</th></tr></thead><tbody>${rightBody}</tbody></table></div>`;
  h += `</div>`;
  return h;
}

/* 多行文本框按内容自动增高（模板 textarea 与超长值 textarea），完整展示内容 */
function autoGrowAll(panel) {
  if (!panel) return;
  panel.querySelectorAll("textarea").forEach(el => {
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight + 2, 36) + "px";
  });
}

/* 横向滚动阴影指示器：仅作用于字段选项卡栏（.ft-pane），指示还有更多选项卡。
   ★规则表视图（2026-11-03 起）改用单一滚动容器 + sticky 冻结列，原中栏左右阴影已移除——
   规则表横向滚动由滚动条本身提示，无需渐显阴影。 */
/* ★性能（2026-11-05）：面板每次重渲染都会整体替换 DOM，旧实现每次新建 2 个
   ResizeObserver 且从不 disconnect，被观察的旧节点一直挂着。
   改为全局复用 1 个 ResizeObserver；每次渲染先剔除已脱离 document 的旧目标。 */
let _shadowRO = null;
const _shadowUpdaters = new WeakMap();
const _shadowTargets = new Set();
function pruneShadowObservers() {
  if (!_shadowRO) return;
  for (const t of Array.from(_shadowTargets)) {
    if (!t.isConnected) {
      try { _shadowRO.unobserve(t); } catch (e) { /* 忽略 */ }
      _shadowTargets.delete(t);
    }
  }
}
function observeShadowTarget(target, upd) {
  if (typeof ResizeObserver === "undefined" || !target) return;
  if (!_shadowRO) {
    _shadowRO = new ResizeObserver(entries => {
      for (const en of entries) {
        const u = _shadowUpdaters.get(en.target);
        if (u) u();
      }
    });
  }
  _shadowUpdaters.set(target, upd);
  if (!_shadowTargets.has(target)) {
    try { _shadowRO.observe(target); _shadowTargets.add(target); } catch (e) { /* 忽略 */ }
  }
}

function initScrollShadows(root) {
  // ★设计标准：字段选项卡栏（.ft-pane）左右边缘渐显阴影（左=可滚回、右=还有选项卡）。
  //   阴影 absolute 定位在【非滚动】的 .ft-pane 上（贴其左右边缘、永远不随内容滚动）；
  if (!root) return;
  pruneShadowObservers();
  root.querySelectorAll(".rules-pane-mid").forEach(pane => {
    if (pane.dataset.shadowInit) return;
    pane.dataset.shadowInit = "1";
    const sc = pane.querySelector(".rules-mid-scroll") || pane;
    const upd = () => {
      const max = sc.scrollWidth - sc.clientWidth;
      const l = pane.querySelector(".scroll-shadow.sh-left");
      const r = pane.querySelector(".scroll-shadow.sh-right");
      if (l) l.style.opacity = (max > 0 && sc.scrollLeft > 4) ? "1" : "0";
      if (r) r.style.opacity = (max > 0 && sc.scrollLeft < max - 4) ? "1" : "0";
    };
    sc.addEventListener("scroll", upd);
    // 动态跟随：内容/容器尺寸变化（编辑、缩放、行高同步）时即时更新（复用全局观察器）
    observeShadowTarget(sc, upd);
    upd();
  });
  // 字段选项卡阴影：.ft-pane 为【非滚动】position:relative 定位锚，只裹 .field-tabs（不含「输出字段：」标签），
  // 内层 .field-tabs 才是 flex 横向滚动区；阴影 pinned 在 .ft-pane、紧贴选项卡区左右边缘、不随内容滚动。
  root.querySelectorAll(".ft-pane").forEach(wrap => {
    const tabs = wrap.querySelector(".field-tabs");
    if (!tabs || wrap.dataset.shadowInit) return;
    wrap.dataset.shadowInit = "1";
    const upd = () => {
      const max = tabs.scrollWidth - tabs.clientWidth;
      const l = wrap.querySelector(".scroll-shadow.sh-left");
      const r = wrap.querySelector(".scroll-shadow.sh-right");
      if (l) l.style.opacity = (max > 0 && tabs.scrollLeft > 4) ? "1" : "0";
      if (r) r.style.opacity = (max > 0 && tabs.scrollLeft < max - 4) ? "1" : "0";
      // 同步左右箭头禁用态：当前已选中首/尾 tab 时禁用对应箭头（边界不循环）
      const nav = wrap.closest(".ft-nav");
      const al = nav && nav.querySelector(".ft-arrow-l");
      const ar = nav && nav.querySelector(".ft-arrow-r");
      if (al || ar) {
        const tabsAll = tabs.querySelectorAll(".field-tab");
        let actIdx = -1;
        tabsAll.forEach((t, i) => { if (t.classList.contains("active")) actIdx = i; });
        const last = tabsAll.length - 1;
        if (al) al.classList.toggle("disabled", actIdx <= 0);
        if (ar) ar.classList.toggle("disabled", actIdx < 0 || actIdx >= last);
      }
    };
    tabs.addEventListener("scroll", upd);
    observeShadowTarget(tabs, upd);
    upd();
  });
}

/* 占位符超出文本框时滚动显示：用伪占位符层替代原生 placeholder */

function applyPhScroll(panel) {
  // ○实现细节：伪占位符层（原生 placeholder 不支持滚动动画）——超长占位文字滚动提示，
  //   输入/聚焦时隐藏；非范式必需，可换成 tooltip 等方式
  if (!panel) return;
  panel.querySelectorAll("input[placeholder], textarea[placeholder]").forEach(el => {
    const ph = el.getAttribute("placeholder") || "";
    if (!ph || el.closest(".ph-wrap")) return;
    // 测量占位符文本宽度是否超出输入框
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:" + getComputedStyle(el).font;
    probe.textContent = ph;
    document.body.appendChild(probe);
    const phW = probe.offsetWidth;
    document.body.removeChild(probe);
    const boxW = el.clientWidth;
    if (phW <= boxW - 8) return; // 未超出，保留原生 placeholder
    // 包装成滚动伪占位符
    const wrap = document.createElement("span");
    wrap.className = "ph-wrap";
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    const marq = document.createElement("span");
    marq.className = "ph-marquee";
    marq.textContent = ph;
    wrap.appendChild(marq);
    el.removeAttribute("placeholder"); // 原生占位符已由伪层替代
  });
}

/* ★设计标准：输出列渲染——一格里多控件「纵向分行 + 宽度对齐」；
   常量=值框；变量=单输入框 [字段]+加工；跳过/报异常/停止=说明框；查表=四行（匹配值/目标表/查询字段/目标字段） */

/* 输出 · 类型下拉（短路表：常量 / 变量 / 查表 —— 判断+映射只产出值；其余模式：全 6 种）。
   ○短路表里下拉不列拦截动作（跳过/报异常/停止）——选不到就犯不了；
   ○存量脏配置（合规之前就写进去的）照实显示并挂红标，不静默改数据、不丢值，由人工搬去检测环节。 */
function outTypeSelectHTML(out, ri) {
  const type = out ? out["类型"] : "常量";
  const mapping = inMappingField();
  const illegal = mapping && isInterceptOut(type);
  const opts = mapping ? MAPPING_OUT_TYPES : OUT_TYPES;
  const tip = illegal
    ? "★违规：短路表只做「判断+映射」，禁止拦截类动作 —— 这条要检测请搬到检测环节去做检测拦截"
    : (mapping ? "短路表只产出值（常量 / 变量 / 查表）；要检测拦截请去检测环节" : "");
  let h = `<select class="out-type${illegal ? ' illegal' : ''}" title="${escAttr(tip)}" `
        + `onchange="updateOut(${ri},'type',this.value)">`;
  for (const t of opts) h += `<option ${t===type?'selected':''}>${t}</option>`;
  if (illegal) h += `<option selected>${escHtml(type)}（违规）</option>`;
  return h + `</select>` + illegalInterceptTag(type);
}
/* 拦截类动作出现在短路表时的红标（复用 .ext-warn 同款样式：红框小字 + hover 说明） */
function illegalInterceptTag(type) {
  if (!inMappingField() || !isInterceptOut(type)) return "";
  const where = type === "跳过" ? "过滤环节（过滤表：命中即弃行）" : "检测环节（检测表：命中仅记录异常）";
  return `<span class="ext-warn" title="★违规：短路表只做判断+映射，不做检测拦截。这条 ${escAttr(type)} 应搬到${escAttr(where)}">禁-${escHtml(type)}</span>`;
}
/* 输出 · 变量：单输入框 `[字段]+加工` 或文本混排；非法引用在框内红底标红（不整框红） */
function outVarHTML(out, ri) {
  const fields = stageInputFields(curStage);
  const curF = (out && out["字段"]) || "";
  const proc = (out && out["加工"]) || "";
  const text = (out && out["文本"]) || "";
  // 显示值：有「文本」（多字段/混排）显示原样；否则显示 [字段]+加工 简写
  const shown = text || (curF ? `[${curF}]${proc}` : "");
  const invalid = text
    ? [...text.matchAll(/\[([^\]]*)\]/g)].some(m => !isVarName(m[1], fields))
    : (curF && !fields.includes(curF));
  // 变量单输入框：中括号 [字段] 引用变量，支持「自由文本 + 多个 [字段] 混排」；
  //   单引用+加工简写 [字段]-1（-1 按天偏移、yyyyMM 格式化）；非法变量名「输入框内红底标红」（.var-hl 红底块）
  //   白名单「必须显示才能被引用」校验已移除（2026-08-24：补全机制替代，引用只查字段是否存在）
  return `<div class="out-var">`
    + `<div class="var-wrap${invalid ? ' invalid' : ''}">`
    + `<div class="var-preview" tabindex="0" data-ph="[字段]+加工 或 文本混排（如 [销售日期]-1 / 日期=[销售日期]）" `
    + `title="点击进入编辑；变量显示为「键别名:键」，存储仍为 [字段名]" `
    + `onclick="varPreviewEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();varPreviewEdit(this);}"`
    + `>${varPreviewHTML(shown, fields)}</div>`
    + `<div class="var-hl">${varOverlayHTML(shown, fields)}</div>`
    + `<input class="var-input" data-ri="${ri}" value="${escAttr(shown)}" placeholder="[字段]+加工 或 文本混排（如 [销售日期]-1 / 日期=[销售日期]）" `
    + `data-tip="格式：中括号 [引用] 输入变量（实现层存储仍为 [字段名]，V9 改轨后存键）。单引用可带加工：[销售日期]-1（减1天）、[销售日期]yyyyMM；多字段/文本混排直接写：{\&quot;日期\&quot;:\&quot;[销售日期]\&quot;}。引用名必须是本环节输入字段，否则变量文本标红" `
    + `title="格式：中括号 [引用] 输入变量（实现层存储仍为 [字段名]，V9 改轨后存键）。单引用可带加工：[销售日期]-1（减1天）、[销售日期]yyyyMM；多字段/文本混排直接写：{\&quot;日期\&quot;:\&quot;[销售日期]\&quot;}。引用名必须是本环节输入字段，否则变量文本标红" `
    + `onfocus="varEditOn(this)" onblur="varEditOff(this)" onchange="updateOutVar(${ri},this)" onscroll="varHlSyncScroll(this)">`
    + `</div>`
    + `</div>`;
}
/* ★变量令牌预览（2026-11-07，用户定）：失焦态把 [引用] 渲染成「键别名:键」胶囊，编辑态仍是原文输入。
   两态模型与 md 混合编辑器一致：预览态=胶囊渲染，编辑态=原文+补全+镜像标红。存储不变（[字段名]），引擎零改动。
   key 取上游输出字段 api_key_name（fieldApiKey 遍历环节链）；无键的字段只显示键别名。 */
function varPreviewHTML(text, fields) {
  const t = text || "";
  let html = "", last = 0, m;
  const re = /\[([^\]]*)\]/g;
  while ((m = re.exec(t))) {
    const name = (m[1] || "").trim();
    const valid = !!name && isVarName(name, fields);
    html += escHtml(t.slice(last, m.index));
    if (valid) {
      const ak = fieldApiKey(name);
      const ly = fieldLayer(name);   // 层（用户 2026-11-12 定：凡渲染「名+键」处一并渲染「层」）
      html += `<span class="var-chip" title="变量 [${escAttr(name)}] · 层: ${escAttr(ly)}${ak ? " · key: " + escAttr(ak) : ""}">`
        + `<i class="var-chip-layer">${escHtml(ly)}</i>`
        + escHtml(name)
        + (ak ? `<i class="var-chip-key">:${escHtml(ak)}</i>` : "")
        + `</span>`;
    } else {
      html += `<b class="hl-err">${escHtml(m[0])}</b>`;
    }
    last = m.index + m[0].length;
  }
  html += escHtml(t.slice(last));
  return html;
}
/* ★变量两态输入通用件（2026-11-07 用户定「统一渲染规范」）：
   凡引擎真实支持 [字段] 引用替换的输入位（输出·查表匹配值 / 条件内嵌查表匹配值 / 报异常说明 / 检测表说明），
   与输出·变量（outVarHTML）统一两态呈现：失焦=预览态胶囊「键别名:键」（varPreviewHTML），聚焦=原文编辑。
   存储不变、引擎零改动。
   write = onchange 表达式（this.value 占位）；blur 兜底写回复用同一表达式（this.value→_ev 存入 data-write）。
   multiline=长文本用 textarea（编辑态无镜像红标层；预览态红底胶囊照常）。
   注意：值比较「值」/常量值/提示词 引擎不做 [字段] 替换 → 不用本通用件（胶囊不得对不存在的替换撒谎）。 */
function varFieldHTML(value, write, opts) {
  opts = opts || {};
  const v = String(value ?? "");
  const ph = opts.placeholder || "";
  const fields = stageInputFields(curStage);
  const invalid = [...v.matchAll(/\[([^\]]*)\]/g)].some(m => m[1] && !isVarName(m[1].trim(), fields));
  const writeEv = String(write).replace(/this\.value/g, "_ev");
  const pvAttrs = `tabindex="0" data-ph="${escAttr(ph)}" `
    + `title="点击进入编辑；变量显示为「键别名:键」，存储仍为 [字段名]" `
    + `onclick="varPreviewEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();varPreviewEdit(this);}"`;
  const pv = `<div class="var-preview" ${pvAttrs}>${v ? varPreviewHTML(v, fields) : ""}</div>`;
  if (opts.multiline) {
    /* ★高度自适应（2026-11-07 用户反馈）：默认单行（rows=1），内容超出再按内容长高；
       聚焦/输入时 autoGrow 实时算高（rows=2 会把单行内容也撑成两行，不美观） */
    return `<div class="var-wrap${invalid ? " invalid" : ""}">${pv}`
      + `<textarea class="auto-grow var-input ${opts.cls || ""}" rows="1" placeholder="${escAttr(ph)}" data-write="${escAttr(writeEv)}" `
      + `onchange="${write}" onfocus="varEditOn(this)" onblur="varEditOff(this)" oninput="autoGrow(this)">${escHtml(v)}</textarea>`
      + `</div>`;
  }
  return `<div class="var-wrap${invalid ? " invalid" : ""}">${pv}`
    + `<div class="var-hl"></div>`
    + `<input class="var-input ${opts.cls || ""}" value="${escAttr(v)}" placeholder="${escAttr(ph)}" data-write="${escAttr(writeEv)}" `
    + `onchange="${write}" onfocus="varEditOn(this)" onblur="varEditOff(this)">`
    + `</div>`;
}
/* 点击/回车胶囊预览 → 切编辑态并聚焦原文输入框（通用件 textarea 也带 .var-input 类，此处选择器保持单一） */
function varPreviewEdit(pv) {
  const wrap = pv.closest(".var-wrap");
  const inp = wrap && wrap.querySelector(".var-input");
  if (!inp) return;

}
/* 进入编辑态：显示原文输入框 + 镜像标红层 */
function varEditOn(el) {

/* 离开编辑态：先复跑一次写回（change 时序在部分浏览器先于/后于 blur 不定，幂等），再重建胶囊预览。
   写回两路：data-ri（输出·变量专用 updateOutVar）或 data-write（通用件 varFieldHTML 存的 onchange 表达式，this.value→_ev） */
function varEditOff(el) {

    if (ri >= 0) updateOutVar(ri, el);
    else if (el.dataset.write) { try { new Function("_ev", el.dataset.write)(el.value); } catch (e) {} }
    const wrap = el.closest(".var-wrap");
    if (!wrap) return;
    const pv = wrap.querySelector(".var-preview");

    wrap.classList.remove("editing");

}
/* 输出 · 查表四要素（界面顺序 = 使用心智）：匹配值 → 目标表 → 查询字段 → 匹配模式 → 目标字段

  if (curTable && stNames.indexOf(curTable) < 0) {

/* ★设计标准：输出列渲染——一格里多控件「纵向分行 + 宽度对齐」；
   常量=值框；变量=单输入框 [字段]+加工；报异常=说明框；查表=四要素（匹配值/表/查询字段/目标字段） */
function renderOutCell(out, ri) {
  const type = out ? out["类型"] : "常量";

/* ★条件内嵌查表：[条件]元素新增「查表」子对象——引擎 match_cond 先按此查表得右值、再按算子比较本行字段。
   与「输出查表」结构同构（表/键/匹配/值/匹配模式/存在检查/行筛选），链式查表通过 匹配=[字段] 引用上游中间量。

function condLookupHTML(ri, field, ci, c) {

/* ★变量文本高亮（2026-08-24，框内红底）：异常「整框红」→「输入框内违规变量标红」。
   输入框原生文字正常显示（无叠影）；overlay .var-hl 文字全透明、仅作占位测量层；
   违规 token（字段不存在）以半透明红底块浮于文字之下（.hl-err，硬错误不写回）。
   白名单校验已移除（补全机制替代）；无违规时视觉与普通输入框无异 */
function varOverlayHTML(text, fields) {
  let html = "", last = 0, m;
  const re = /\[([^\]]*)\]/g;
  while ((m = re.exec(text))) {
    const name = (m[1] || "").trim();
    const bad = !name || !isVarName(name, fields);
    html += escHtml(text.slice(last, m.index));
    html += bad ? `<b class="hl-err">${escHtml(m[0])}</b>` : escHtml(m[0]);
    last = m.index + m[0].length;
  }
  html += escHtml(text.slice(last));
  return html;
}
/* 按输入框当前值重建镜像层（用户输入实时调用；程序化赋值走 updateOutVar 开头兜底）。
   ⚠ 用 closest 而非 parentNode：applyPhScroll 会把超长 placeholder 的 input 包进 .ph-wrap，直接父级不一定是 .var-wrap */
function syncVarOverlay(el) {
  const wrap = el.closest(".var-wrap");
  const hl = wrap && wrap.querySelector(".var-hl");
  if (!hl) return;
  hl.innerHTML = varOverlayHTML(el.value || "", stageInputFields(curStage));
}
/* 单行 input 横向滚动时镜像层反向位移跟随（无滚动则清零） */
function varHlSyncScroll(el) {
  const wrap = el.closest(".var-wrap");
  const hl = wrap && wrap.querySelector(".var-hl");
  if (hl) hl.style.transform = el.scrollLeft ? `translateX(${-el.scrollLeft}px)` : "";
}

/* ★变量补全（2026-08-24）：var-input 输入「[」弹出候选浮层。
   候选 = 本环节全部输入字段（2026-08-24 与白名单解耦：白名单只管显示区列可见性，不再约束引用）。
   文件元信息系统变量（输入/输出文件名）已移除（引擎直接连 API、无中间文件），候选不再追加。
   交互：输入「[」弹出 → 继续输入过滤 → ↑↓ 选择 / Enter·Tab 补全（自动补 ] 光标置后）/ Esc 关闭 / 点击补全；
   补全后派发 change 触发 updateOutVar 即时校验（候选=本环节输入字段，故补全永不触发红标）。 */

function varACCandidates() {
  return stageInputFields(curStage).filter(f => typeof f === "string" && f.trim());
}
function varACOpenPos(el) {  // 光标前最近未闭合的「[」；已闭合（中间有 ]）返回 null
  const v = el.value || "";
  const caret = (el.selectionStart === undefined) ? v.length : el.selectionStart;
  const before = v.slice(0, caret);
  const lb = before.lastIndexOf("[");
  const rb = before.lastIndexOf("]");
  if (lb < 0 || rb > lb) return null;
  return { start: lb, filter: before.slice(lb + 1) };
}
function varACRender() {
  const list = varACFilter(varACCandidates(), varACOpen ? varACOpen.filter : "");
  const box = varAC;
  if (!varACOpen || !list.length) { hideVarAC(); return; }
  varACIdx = Math.max(0, Math.min(varACIdx, list.length - 1));
  box.innerHTML = list.map((f, i) => {
    const ak = fieldApiKey(f);
    const ly = fieldLayer(f);
    return `<div class="var-ac-item${i === varACIdx ? " sel" : ""}" data-v="${escAttr(f)}"><i class="var-ac-layer">${escHtml(ly)}</i>${escHtml(f)}${ak ? `<i class="var-ac-key">:${escHtml(ak)}</i>` : ""}</div>`;
  }).join("");
  box.dataset.list = JSON.stringify(list);
  const r = varAC._input.getBoundingClientRect();
  box.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 360)) + "px";
  box.style.top = (r.bottom + 4) + "px";
  box.style.display = "block";
}
function varACFilter(list, kw) {
  const k = (kw || "").toLowerCase();
  return list.filter(f => !k || f.toLowerCase().includes(k));
}
function hideVarAC() {
  if (varAC) { varAC.style.display = "none"; varAC.innerHTML = ""; }
  varACOpen = null; varACIdx = -1;
}
function varACApply(el, field) {
  const o = varACOpen;
  if (!o) return;
  const v = el.value || "";
  const caret = (el.selectionStart === undefined) ? v.length : el.selectionStart;
  el.value = v.slice(0, o.start) + "[" + field + "]" + v.slice(caret);
  const nc = o.start + field.length + 2;
  if (el.setSelectionRange) el.setSelectionRange(nc, nc);
  hideVarAC();
  el.dispatchEvent(new Event("change", { bubbles: true }));
  el.focus();
}
function initVarAutocomplete() {
  varAC = document.createElement("div");
  varAC.className = "var-ac";
  varAC.style.display = "none";
  document.body.appendChild(varAC);
  document.addEventListener("input", e => {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains("var-input")) return;
    syncVarOverlay(el);  // 输入实时重建镜像层（违规变量文本即时标红）
    const o = varACOpenPos(el);
    if (!o) { hideVarAC(); return; }
    varACOpen = o; varACIdx = -1; varAC._input = el;
    varACRender();
  });
  document.addEventListener("keydown", e => {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains("var-input") || !varACOpen || varAC.style.display === "none") return;
    const list = JSON.parse(varAC.dataset.list || "[]");
    if (e.key === "ArrowDown") { e.preventDefault(); varACIdx = (varACIdx + 1) % list.length; varACRender(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); varACIdx = (varACIdx - 1 + list.length) % list.length; varACRender(); }
    else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); const f = list[varACIdx] || list[0]; if (f) varACApply(el, f); }
    else if (e.key === "Escape") { e.preventDefault(); hideVarAC(); }
  });
  document.addEventListener("focusout", e => {
    if (e.target && e.target.classList && e.target.classList.contains("var-input")) setTimeout(hideVarAC, 150);
  });
  document.addEventListener("mousedown", e => {
    if (!e.target.closest) return;
    const item = e.target.closest(".var-ac-item");
    if (item && varAC._input) { e.preventDefault(); varACApply(varAC._input, item.dataset.v); }
  });
  window.addEventListener("scroll", hideVarAC, true);
}

function renderExternalStaticPanel(st) {
  const panel = document.getElementById("panel");
  panel.classList.add("panel-fill");   // 只读预览同样撑满右栏剩余高度
  const head = st["表头"] || [];
  const rows = EXT_ROWS[curStatic];
  const cap = 200;
  /* ★顶部不渲染标题（用户 2026-11-06 定，与本地静态表同口径）：说明信息并入工具条行 */
  let h = `<div class="st-toolbar" style="display:flex;flex-wrap:wrap;gap:10px">`;
  h += `<span class="hint">外部表${rows ? " · " + rows.length + " 行" : ""} · 行数据在外部文件 <code>${escHtml(st["来源"] || "")}</code>（键 ${escHtml(st["键"] || curStatic)}）· <b>不进本 JSON</b></span>`;
  if (st["用途"]) h += `<span class="hint">用途：${escHtml(st["用途"])}</span>`;
  if (st["刷新"]) h += `<span class="hint">刷新：<code>${escHtml(st["刷新"])}</code></span>`;
  h += `</div>`;
  if (!rows) {
    h += `<div class="empty">正在从外部文件加载预览…（若一直不显示，说明本页无法直接读取该文件，请以 HTTP 方式打开编辑器）</div>`;
  } else if (!rows.length) {
    h += `<div class="empty">外部文件里没有行数据（可能未刷新）</div>`;
  } else {
    const view = rows.slice(0, cap);
    h += `<div class="hint" style="margin:6px 0">只读预览${rows.length > cap ? `（共 ${rows.length} 行，显示前 ${cap} 行）` : ""}；改数据请改源文件后跑刷新命令</div>`;
    h += `<div class="st-scroll" data-scroll-key="${escAttr(staticScrollKey(curStatic))}"><table class="static-table"><thead><tr><th class="st-idx-col" title="Editor 独立渲染的行序号（不写入 JSON）">序号</th>`;
    head.forEach(c => { h += `<th>${escHtml(c)}</th>`; });
    h += `</tr></thead><tbody>`;
    view.forEach((row, vi) => {
      h += `<tr><td class="st-idx-cell">${vi + 1}</td>`;
      head.forEach((_, c) => {
        h += `<td><textarea class="st-cell st-ro${isNumericCell(row[c]) ? " st-num" : ""}" rows="1" readonly>${escHtml(row[c] == null ? "" : row[c])}</textarea></td>`;
      });
      h += `</tr>`;
    });
    h += `</tbody></table></div>`;
  }
  panel.innerHTML = h;
  const scx = panel.querySelector(".st-scroll");
  if (scx && rows && rows.length) fitStaticColumns(scx, head, rows, false);   // 只读预览同样按内容分配列宽
  autoGrowStaticCells(panel);   // 只读预览单元格也按内容自动增高，换行不截断
  if (!rows) {
    loadExternalRows(curStatic).then(() => { if ((CONFIG["静态数据"] || {})[curStatic] === st) renderExternalStaticPanel(st); });
  }
}

/* ★性能（2026-11-05）：排序前每行预计算一次键（数值 / 字符串），并复用同一个
   Intl.Collator；旧实现在比较器里每次都做 String / parseFloat / localeCompare，
   1,500 行约 1.5 万次比较会反复重建 collator。三态排序、数值优先、空值末位语义不变。 */
const _staticCollator = (typeof Intl !== "undefined" && Intl.Collator) ? new Intl.Collator("zh-Hans-CN") : null;
function staticSortKey(v) {
  const s = String(v);
  const n = parseFloat(s);
  const numeric = (typeof v === "number") || (!isNaN(n) && String(n) === s.trim() && s.trim() !== "");
  return { empty: isEmptyCell(v), num: numeric ? (typeof v === "number" ? v : n) : null, str: s };
}
/* 静态表 · 视图行：搜索过滤 + 列排序（视图层，不改数据；ri 保留以便编辑写回原行） */
function staticViewRows(header, rows) {
  const kw = (staticSearch || "").trim().toLowerCase();
  let viewRows = kw
    ? rows.map((row, i) => ({ ri: i, row })).filter(({ row }) =>
        header.some((_, c) => String(row[c] ?? "").toLowerCase().includes(kw)))
    : rows.map((row, i) => ({ ri: i, row }));
  // 列排序（三态：升序 → 降序 → 取消）
  if (staticSort.col >= 0) {
    const ci = staticSort.col, dir = staticSort.dir;
    const cmp = _staticCollator
      ? (a, b) => _staticCollator.compare(a, b)
      : (a, b) => a.localeCompare(b, "zh-Hans-CN");
    const keyed = viewRows.map(v => ({ v, k: staticSortKey(v.row[ci]) }));
    keyed.sort((a, b) => {
      const ka = a.k, kb = b.k;
      if (ka.empty && kb.empty) return 0;
      if (ka.empty) return 1;      // 空值排最后
      if (kb.empty) return -1;
      const r = (ka.num != null && kb.num != null) ? ka.num - kb.num : cmp(ka.str, kb.str);
      return r * dir;
    });
    viewRows = keyed.map(x => x.v);
  }
  return viewRows;
}
/* 静态表 · 工具条（用户 2026-11-06 定）：单行三段——左「搜索框」、中「行数」标签、右「+列 / +新增行」。
   「导入字典 / 补全名称 / 统计位」按钮与面板顶部 h2 标题已按同日决定移除（表名在左导航可见）。
   ★+ 列（用户 2026-11-06 定）：新列自动命名追加到 JSON 末尾，随即进入表头改名编辑（可回车确认或 Esc 保留默认名）。 */
function staticToolbarHTML(totalRows, matchedRows) {
  const cnt = `共 ${totalRows} 行` + (matchedRows !== totalRows ? `（匹配 ${matchedRows} 行）` : "");
  return `<div class="st-toolbar">
    <input class="search${staticSearch ? " search-active" : ""}" placeholder="🔍 搜索本表（任意列），回车或失焦后触发" value="${escAttr(staticSearch)}" onblur="staticSearch=this.value; renderStaticPanel()" onkeydown="if(event.key==='Enter'){staticSearch=this.value; renderStaticPanel(); this.blur();}">

     再走 onApply：勾选==自动集时 applyCondWhiteList 会删掉「显示输入条件字段」键，JSON 回到干净的默认态。
   ○实现细节：mask / box / 自动 / 全选 / 全不选 五个 id 由 idPrefix 区分（cf-* / ff-*），供各自 close* 精确移除 */
function openFieldsMenu(e, cfg) {
  const mask = document.createElement("div");
  mask.id = cfg.idPrefix + "-menu-mask";
  mask.onclick = () => cfg.onClose();
  const box = document.createElement("div");
  box.id = cfg.idPrefix + "-menu";
  box.className = "cf-menu";
  const autoSet = new Set(cfg.auto || []);
  const items = cfg.fields.map(f => {
    const on = cfg.checked.has(f);
    const desc = fieldDesc(f);
    return `<label class="cf-item"${desc ? ` data-tip="${escAttr(desc)}" onmouseenter="condDescTipShow(this)" onmouseleave="fieldTipHide()"` : ""}><input type="checkbox" data-f="${escAttr(f)}" ${on?"checked":""}/> <span>${escHtml(fieldMenuLabel(f))}</span></label>`;
  }).join("");
  box.innerHTML = `<div class="cf-head"><span>上一环节传入的条件字段</span>
      <span class="cf-tools"><a href="javascript:void(0)" id="${cfg.idPrefix}-auto" title="回到默认视图：只勾选规则里真带条件的字段（${autoSet.size} 个），JSON 中不写死白名单">自动</a> · <a href="javascript:void(0)" id="${cfg.idPrefix}-all">全选</a> · <a href="javascript:void(0)" id="${cfg.idPrefix}-none">全不选</a></span></div>
      <div class="cf-body">${items}</div>
      <div class="cf-foot">${cfg.foot}</div>`;
  document.body.appendChild(mask);
  document.body.appendChild(box);
  // 定位：紧贴触发按钮下方（body portal 用 getBoundingClientRect 定位）
  positionFloatingMenu(box, e.currentTarget, cfg.fields.length * 26 + 90, 360);
  const apply = () => {
    const checked = Array.from(box.querySelectorAll('input[data-f]:checked')).map(i => i.getAttribute("data-f"));
    cfg.onApply(checked);
  };
  box.querySelectorAll('input[data-f]').forEach(cb => { cb.onchange = apply; });
  box.querySelector("#" + cfg.idPrefix + "-auto").onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    box.querySelectorAll('input[data-f]').forEach(cb => cb.checked = autoSet.has(cb.getAttribute("data-f"))); apply();
  };
  box.querySelector("#" + cfg.idPrefix + "-all").onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    box.querySelectorAll('input[data-f]').forEach(cb => cb.checked = true); apply();
  };
  box.querySelector("#" + cfg.idPrefix + "-none").onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    box.querySelectorAll('input[data-f]').forEach(cb => cb.checked = false); apply();
  };
  return box;
}
/* 白名单写回：勾选集 == 自动集 → 删键回自动模式（JSON 保持干净）；否则写显式白名单
   （含「全选」= 全部列都显示，也是显式声明，不能再当成自动） */
function applyCondWhiteList(target, checked, autoSet) {
  const same = checked.length === autoSet.length && checked.every(f => autoSet.indexOf(f) >= 0);
  if (same) delete target["显示输入条件字段"];
  else target["显示输入条件字段"] = checked;
  renderPanel(); scheduleSave();
}

function positionOpMenu(menu, trigger) {
  positionFloatingMenu(menu, trigger, (OPS.length + 1) * 28 + 6, 320);
}

/* ============ 自定义确认弹窗（限定用途） ============
   ★设计标准（用户 2026-11-05 定）：**二次确认一律使用浏览器原生 window.confirm**——
     「＋环节」插入、删除环节（三次）、删除输出字段、删除规则行 / 条件、删除过滤规则 / 条件，
     以及载入、新建、重载、清除本地保存等提示，全部走原生 confirm，不在此组件之列。
   ○例外（不用原生 confirm）：① 删除文档必须输入完整文档名称（openDocDeleteDialog，独立输入框弹窗）；
     ② 需要自定义按钮文字 / 异步用户手势的非删除类选择确认（confirmBindBackupDir 绑定备份目录，
        回调要调 window.showDirectoryPicker，需保住用户手势链）。
   ○实现仍为渲染到 <body> 的顶层 overlay，「确认」才执行回调、「取消/遮罩/ESC」均关闭不执行。 */
function openConfirm(message, onConfirm, onCancel, okLabel) {
  closeConfirm();
  let settled = false;
  const fire = (fn) => { if (settled) return; settled = true; if (typeof fn === "function") fn(); };
  const cancel = () => { const cb = onCancel; closeConfirm(); fire(cb); };
  const mask = document.createElement("div");
  mask.id = "confirm-mask";
  mask.className = "confirm-mask";
  mask.onclick = () => cancel();
  const box = document.createElement("div");
  box.id = "confirm-box";
  box.className = "confirm-box";
  box.innerHTML = `<div class="confirm-msg"></div><div class="confirm-actions">
      <button class="btn small" id="confirm-cancel">取消</button>
      <button class="btn small danger" id="confirm-ok">${escHtml(okLabel || "确认删除")}</button>
    </div>`;
  box.querySelector(".confirm-msg").textContent = message;
  box.querySelector("#confirm-cancel").onclick = (e) => { e.stopPropagation(); cancel(); };
  box.querySelector("#confirm-ok").onclick = (e) => {
    e.stopPropagation();
    const cb = box.__onConfirm;
    closeConfirm();
    fire(cb);
  };
  document.body.appendChild(mask);
  document.body.appendChild(box);
  box.__onConfirm = onConfirm;
  // ESC 关闭
  setTimeout(() => {
    const onKey = (ev) => {
      if (ev.key === "Escape") { document.removeEventListener("keydown", onKey); cancel(); }
    };
    document.addEventListener("keydown", onKey);
    box.__onKey = onKey;
  }, 0);
  // 聚焦确认按钮之外区域，避免误回车
  const okBtn = box.querySelector("#confirm-ok");
  if (okBtn) { try { okBtn.blur(); } catch (e) {} }
}
function closeConfirm() {
  const m = document.getElementById("confirm-mask");
  const b = document.getElementById("confirm-box");
  if (m) m.remove();
  if (b) { if (b.__onKey) document.removeEventListener("keydown", b.__onKey); b.remove(); }
}

/* ════════════════════════════════════════════════════════════════════════
   ═══ 4. 事件层 ═══  选中/切换 · 环节增删 · 模式切换 · 规则增删改 · 算子与勾选浮层 · 静态表编辑
   ════════════════════════════════════════════════════════════════════════ */

/* ═══ 文档集合：选中 / 增加 / 改名 / 删除 / 上下拖动排序（用户 2026-11-05 授权，排序 2026-11-06 增加） ═══
   删除分两道：① 双击条目 → 编辑弹窗（改名 / 点「删除该文档」）；
   ② 额外的确认弹窗，必须输入完整文档名称且与名称精确一致才执行删除。
   ★双击用 200ms 计时器判定（同输出字段卡片 fieldTabClick）：单击会重建左栏 DOM，
     若用原生 ondblclick，第一次 click 重建后第二次落在新的 DOM 节点上，双击不会触发。 */
let _docClickTimer = null, _docClickKey = -1;
function docTabClick(i) {
  if (EDIT_LOCK) {   // 只读态：改名/删除弹窗是变更入口（用户 2026-11-11 报障），双击降级为单击选中
    if (_docClickTimer) { clearTimeout(_docClickTimer); _docClickTimer = null; _docClickKey = -1; }
    selectDoc(i);
    return;
  }
  if (_docClickTimer && _docClickKey === i) {
    clearTimeout(_docClickTimer); _docClickTimer = null; _docClickKey = -1;
    if (curView !== "sop" || curDoc !== i) selectDoc(i);
    openDocEditDialog(i);
    return;
  }
  clearTimeout(_docClickTimer);
  _docClickKey = i;
  _docClickTimer = setTimeout(() => {
    _docClickTimer = null; _docClickKey = -1;
    selectDoc(i);
  }, 200);
}
function selectDoc(i) {
  const docs = docsArray();
  if (i < 0 || i >= docs.length) return;
  if (curView === "sop" && i !== curDoc) commitDoc(curDoc);   // 切换前写回，防未失焦编辑丢失
  curDoc = i;
  curView = "sop";
  curNavTab = "docs";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）
  renderLeft(); showSOP();
  saveUiState();
}
function selectSOP() { selectDoc(curDoc < docsArray().length ? curDoc : 0); }   // 兼容旧引用（保留符号）

function addDocument() {
  if (curView === "sop") commitDoc(curDoc);
  const docs = docsArray();
  const name = nextDocName();
  docs.push({ "名称": name, "内容": "" });
  curDoc = docs.length - 1;
  curView = "sop";
  curNavTab = "docs";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）
  log("增加文档", name);
  renderLeft(); showSOP(); scheduleSave(); saveUiState();
}

/* ★#46 文档拖动排序（用户 2026-11-06 要求）：与静态表同一套纵向落位判定——
   悬停条目上半 → 插到它之前，下半 → 插到它之后。
   • 文档是**数组**，顺序即 JSON「文档」元素顺序；左栏序号、显示序都由该数组顺序决定。
   • 拖动只改顺序、不碰正文 DOM：正在编辑的那一份若内容确有变化，落位前按**旧索引**先写回
     （不写回会随索引错位写错对象；内容没变则不写、也不记一条假的「编辑文档」日志）。
   • 选中跟着「原来那一份」走（文档对象引用不变，按引用回算新索引），拖动后不会跳到别的文档。 */
let _docDragFrom = -1;
function docDragStart(ev, el) {
  const i = Number(el.getAttribute("data-di"));
  if (isNaN(i) || docsArray().length < 2) { ev.preventDefault(); return; }
  _docDragFrom = i;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) {}
  el.classList.add("dragging");
}
function docDragOver(ev, el) {
  if (_docDragFrom < 0 || el.getAttribute("data-di") === null) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const r = el.getBoundingClientRect();
  const above = ev.clientY < r.top + r.height / 2;
  clearDocDropMarks();
  if (Number(el.getAttribute("data-di")) !== _docDragFrom) el.classList.add(above ? "drop-above" : "drop-below");
}
function docDragLeave(el) { el.classList.remove("drop-above", "drop-below"); }
function clearDocDropMarks() {
  document.querySelectorAll(".doc-tab.drop-above, .doc-tab.drop-below")
    .forEach(x => x.classList.remove("drop-above", "drop-below"));
}
function docDrop(ev, el) {
  ev.preventDefault();
  const from = _docDragFrom, to = Number(el.getAttribute("data-di"));
  const above = el.classList.contains("drop-above");
  clearDocDropMarks();
  _docDragFrom = -1;
  if (from < 0 || isNaN(to)) return;
  moveDoc(from, above ? to : to + 1);
}
function docDragEnd() {
  _docDragFrom = -1;
  clearDocDropMarks();
  document.querySelectorAll(".doc-tab.dragging").forEach(x => x.classList.remove("dragging"));
}
function moveDoc(from, to) {
  const docs = docsArray();
  if (from < 0 || from >= docs.length) return;
  let t = Math.max(0, Math.min(docs.length, to));
  if (t === from || t === from + 1) return;                // 放回原位，不算移动
  const selDoc = docs[curDoc] || null;
  // 落位前写回正在编辑的那一份（写回对象是旧索引；内容未变则跳过，避免记假日志）
  if (curView === "sop" && selDoc && document.getElementById("sop_ta")) {
    hybridSyncSource("sop");
    const now = document.getElementById("sop_ta").value;
    if (now !== (selDoc["内容"] || "")) commitDoc(curDoc);
  }
  const order = docs.slice();
  const moved = order.splice(from, 1)[0];
  if (t > from) t--;                                       // 先摘除再插入的槽位补偿
  order.splice(t, 0, moved);
  CONFIG["文档"] = order;
  const ni = selDoc ? order.indexOf(selDoc) : -1;          // 选中跟随原来那一份（对象引用不变）
  curDoc = ni >= 0 ? ni : Math.min(curDoc, order.length - 1);
  log("调整文档顺序", "「" + ((moved && moved["名称"]) || "未命名") + "」移到第 " + (order.indexOf(moved) + 1) + " 份");
  renderLeft();
  scheduleSave();
  saveUiState();
}

function closeDocDialogs() {
  ["confirm-mask", "doc-edit-box", "doc-del-box", "st-edit-box", "st-del-box", "st-col-del-box"].forEach(id => {
    const el = document.getElementById(id);
    if (el) { if (el.__onKey) document.removeEventListener("keydown", el.__onKey); el.remove(); }
  });
}
function _docDialogShell(boxId, html) {
  closeDocDialogs();
  const mask = document.createElement("div");
  mask.id = "confirm-mask";                 // 复用既有 #confirm-mask 遮罩样式
  mask.className = "confirm-mask";
  mask.onclick = closeDocDialogs;
  const box = document.createElement("div");
  box.id = boxId; box.className = "confirm-box";
  box.innerHTML = html;
  document.body.appendChild(mask); document.body.appendChild(box);
  setTimeout(() => {
    const onKey = ev => { if (ev.key === "Escape") { document.removeEventListener("keydown", onKey); closeDocDialogs(); } };
    document.addEventListener("keydown", onKey);
    box.__onKey = onKey;
  }, 0);
  return box;
}
function openDocEditDialog(i) {
  const d = docsArray()[i];
  if (!d) return;
  const name = d["名称"] || "";
  const box = _docDialogShell("doc-edit-box",
      `<div class="field-edit-title">编辑文档</div>`
    + `<div class="field-edit-form"><label>文档名称</label><input class="inp" id="de-name" value="${escAttr(name)}"></div>`
    + `<div class="doc-edit-note">改名后请同步更新提示词第二板块里引用该文档名称的位置。</div>`
    + `<div class="field-edit-actions"><button class="btn small danger" id="de-del">删除该文档</button>`
    + `<span class="field-edit-right"><button class="btn small" id="de-cancel">取消</button>`
    + `<button class="btn small primary" id="de-ok">保存</button></span></div>`);
  box.querySelector("#de-cancel").onclick = closeDocDialogs;
  box.querySelector("#de-ok").onclick = () => applyDocRename(i, box.querySelector("#de-name").value);
  box.querySelector("#de-del").onclick = () => openDocDeleteDialog(i);
  setTimeout(() => { try { box.querySelector("#de-name").focus(); box.querySelector("#de-name").select(); } catch (e) {} }, 0);
}
function applyDocRename(i, raw) {
  const docs = docsArray(), d = docs[i];
  if (!d) return;
  const name = (raw || "").trim();
  if (!name) { setAutoHint("文档名称不能为空"); return; }
  if (docs.some((x, j) => j !== i && x && x["名称"] === name)) { setAutoHint("文档名称「" + name + "」已存在"); return; }
  const old = d["名称"] || "";
  d["名称"] = name;
  closeDocDialogs();
  log("修改文档名称", old + " → " + name);
  renderLeft(); showSOP(); scheduleSave();
}
function openDocDeleteDialog(i) {
  const d = docsArray()[i];
  if (!d) return;
  const name = d["名称"] || "";
  const box = _docDialogShell("doc-del-box",
      `<div class="field-edit-title">删除文档</div>`
    + `<div class="confirm-msg">即将删除文档「${escHtml(name)}」及其全部内容。请输入完整文档名称以确认：</div>`
    + `<div class="field-edit-form"><label>文档名称</label><input class="inp" id="dd-name" placeholder="请输入完整文档名称"></div>`
    + `<div class="field-edit-actions"><span class="field-edit-right">`
    + `<button class="btn small" id="dd-cancel">取消</button>`
    + `<button class="btn small danger" id="dd-ok">确认删除</button></span></div>`);
  box.querySelector("#dd-cancel").onclick = closeDocDialogs;
  box.querySelector("#dd-ok").onclick = () => {
    if (box.querySelector("#dd-name").value !== name) { setAutoHint("文档名称不匹配，请输入完整文档名称"); return; }
    confirmDocDelete(i, name);
  };
  setTimeout(() => { try { box.querySelector("#dd-name").focus(); } catch (e) {} }, 0);
}
function confirmDocDelete(i, name) {
  const docs = docsArray();
  if (!docs[i]) return;
  docs.splice(i, 1);
  closeDocDialogs();
  log("删除文档", name);
  if (!docs.length) { curDoc = 0; curView = "rules"; curNavTab = "stages"; renderLeft(); renderPanel(); }
  else { curDoc = Math.min(curDoc, docs.length - 1); curNavTab = "docs"; renderLeft(); showSOP(); }
  scheduleSave(); saveUiState();
}

function selectStage(sk) {
  curStage = sk;
  curView = "rules";
  curNavTab = "stages";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）
  curPanelTab = "md";   // 切环节重置面板选项卡默认（提示词模式停在 MD编辑器）
  if (isSingleRuleStage(sk)) {
    curField = "";   // 检测表（环节级）模式：无输出字段
  } else {
    const fields = stageFieldList(sk);
    curField = fields[0] || "";
  }

function selectField(f) {
  curField = f;
  curView = "rules";
  curNavTab = "stages";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）

}

/* 选项卡行左右箭头：切换到上一个/下一个输出字段（含检测规则虚拟 tab），到边界不循环 */
function stepField(dir) {
  const pane = document.querySelector(".ft-pane");
  if (!pane) return;
  const tabs = pane.querySelector(".field-tabs");
  if (!tabs) return;
  const all = Array.from(tabs.querySelectorAll(".field-tab"));
  if (!all.length) return;
  let idx = all.findIndex(t => t.classList.contains("active"));
  if (idx < 0) idx = 0;
  const ni = idx + dir;
  if (ni < 0 || ni >= all.length) return;
  // 置标志后同步触发目标卡 onclick：fieldTabClick 见标志即直接选中，绝不进入双击编辑判定。
  //   try/finally 复位，避免点到「检测规则虚拟卡」(onclick=selectField) 时标志残留到下一次真实点击。
  _fieldStepClick = true;
  try { all[ni].click(); } finally { _fieldStepClick = false; }
}

function selectStatic(s) {
  curStatic = s;
  curView = "static";
  curNavTab = "static";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）
  staticSort = { col: -1, dir: 1 };   // 切表重置排序
  renderLeft(); renderStaticPanel();
  saveUiState();
}

/* ============ 静态表 · 增删挪（用户 2026-11-06 定，交互对齐「文档」区） ============
   增加：区头「+ 增加静态表」→ 新建空映射表（默认表头 编码/名称，可在 JSON 里改）并选中。
   编辑：双击左导航表名 → 弹窗改名/删除；改名自动同步「转换逻辑」里所有「表」字段引用（查表条件、
         查表取值、输出查表），键序保留原位；删除需输入完整表名确认，并提示规则引用数。
   挪动：按住上下拖动左导航表名 → 重排「静态数据」对象键序（JSON 顶层顺序即显示顺序）。 */
let _stClickTimer = null, _stClickKey = null;
function staticTabClick(name) {
  if (EDIT_LOCK) {   // 只读态：改名/删除弹窗是变更入口（用户 2026-11-11 报障），双击降级为单击选中
    if (_stClickTimer) { clearTimeout(_stClickTimer); _stClickTimer = null; _stClickKey = null; }
    selectStatic(name);
    return;
  }
  if (_stClickTimer && _stClickKey === name) {
    clearTimeout(_stClickTimer); _stClickTimer = null; _stClickKey = null;
    if (curView !== "static" || curStatic !== name) selectStatic(name);
    openStaticEditDialog(name);
    return;
  }
  clearTimeout(_stClickTimer);
  _stClickKey = name;
  _stClickTimer = setTimeout(() => {
    _stClickTimer = null; _stClickKey = null;
    selectStatic(name);
  }, 200);
}
function nextStaticName() {
  const used = Object.keys(CONFIG["静态数据"] || {});
  let n = 1;
  while (used.indexOf("新静态表 " + n) >= 0) n++;
  return "新静态表 " + n;
}
function addStaticTable() {
  if (!CONFIG) return;
  if (!CONFIG["静态数据"]) CONFIG["静态数据"] = {};
  const name = nextStaticName();
  CONFIG["静态数据"][name] = { "表头": ["编码", "名称"], "行": [] };
  log("增加静态表", name + "（默认表头：编码/名称）");
  selectStatic(name);
  scheduleSave();
}
/* 深度统计/同步「转换逻辑」内所有 key === "表" 且值 === 表名 的引用（条件查表 / 查表取值 / 输出查表） */
function countStaticRefs(name) {
  let n = 0;
  const walk = v => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (v && typeof v === "object") {
      Object.keys(v).forEach(k => { if (k === "表" && v[k] === name) n++; else walk(v[k]); });
    }
  };
  walk(CONFIG["转换逻辑"] || {});
  return n;
}
function updateStaticRefs(oldName, neuName) {
  let n = 0;
  const walk = v => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (v && typeof v === "object") {
      Object.keys(v).forEach(k => { if (k === "表" && v[k] === oldName) { v[k] = neuName; n++; } else walk(v[k]); });
    }
  };
  walk(CONFIG["转换逻辑"] || {});
  return n;
}
function openStaticEditDialog(name) {
  const sts = CONFIG["静态数据"] || {};
  if (!(name in sts)) return;
  const refs = countStaticRefs(name);
  const box = _docDialogShell("st-edit-box",
      `<div class="field-edit-title">编辑静态表</div>`
    + `<div class="field-edit-form"><label>表名</label><input class="inp" id="se-name" value="${escAttr(name)}"></div>`
    + `<div class="doc-edit-note">改名后同步更新规则里引用该表名的位置${refs ? `（当前 ${refs} 处）` : ""}；文档正文里的提法需自行更新。</div>`
    + `<div class="field-edit-actions"><button class="btn small danger" id="se-del">删除该表</button>`
    + `<span class="field-edit-right"><button class="btn small" id="se-cancel">取消</button>`
    + `<button class="btn small primary" id="se-ok">保存</button></span></div>`);
  box.querySelector("#se-cancel").onclick = closeDocDialogs;
  box.querySelector("#se-ok").onclick = () => applyStaticRename(name, box.querySelector("#se-name").value);
  box.querySelector("#se-del").onclick = () => openStaticDeleteDialog(name);
  setTimeout(() => { try { box.querySelector("#se-name").focus(); box.querySelector("#se-name").select(); } catch (e) {} }, 0);
}
function applyStaticRename(oldName, raw) {
  const sts = CONFIG["静态数据"] || {};
  if (!(oldName in sts)) return;
  const neuName = (raw || "").trim();
  if (!neuName) { setAutoHint("表名不能为空"); return; }
  if (neuName === oldName) { closeDocDialogs(); return; }
  if (neuName in sts) { setAutoHint("表名「" + neuName + "」已存在"); return; }
  const out = {};                                   // 重建键序：改名后的键留在原位置
  Object.keys(sts).forEach(k => { out[k === oldName ? neuName : k] = sts[k]; });
  CONFIG["静态数据"] = out;
  const refs = updateStaticRefs(oldName, neuName);
  if (curStatic === oldName) curStatic = neuName;
  closeDocDialogs();
  log("修改静态表名", oldName + " → " + neuName + (refs ? `（同步规则引用 ${refs} 处）` : ""));
  if (curView === "static") renderStaticPanel();
  renderLeft(); scheduleSave(); saveUiState();
}
function openStaticDeleteDialog(name) {

    + `<div class="field-edit-form"><label>表名</label><input class="inp" id="sd-name" placeholder="请输入完整表名"></div>`

    else { curView = "rules"; curNavTab = "stages"; renderLeft(); renderPanel(); }

    renderLeft();

/* 拖动排序（纵向）：与输出字段拖动同一套路，但方向按上下半判定 */
let _stDragFrom = -1;
function stDragStart(ev, el) {
  const i = Number(el.getAttribute("data-sti"));
  if (isNaN(i)) { ev.preventDefault(); return; }
  _stDragFrom = i;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) {}
  el.classList.add("dragging");
}
function stDragOver(ev, el) {
  if (_stDragFrom < 0 || el.getAttribute("data-sti") === null) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const r = el.getBoundingClientRect();
  const above = ev.clientY < r.top + r.height / 2;
  document.querySelectorAll(".field-list .field-tab.drop-above, .field-list .field-tab.drop-below")
    .forEach(x => x.classList.remove("drop-above", "drop-below"));
  if (Number(el.getAttribute("data-sti")) !== _stDragFrom) el.classList.add(above ? "drop-above" : "drop-below");
}
function stDragLeave(el) { el.classList.remove("drop-above", "drop-below"); }
function stDrop(ev, el) {
  ev.preventDefault();
  const from = _stDragFrom, to = Number(el.getAttribute("data-sti"));
  const above = el.classList.contains("drop-above");
  stDragEnd();
  if (from < 0 || isNaN(to)) return;
  moveStaticKey(from, above ? to : to + 1);
}
function stDragEnd() {
  _stDragFrom = -1;
  document.querySelectorAll(".field-list .field-tab.dragging, .field-list .field-tab.drop-above, .field-list .field-tab.drop-below")
    .forEach(x => x.classList.remove("dragging", "drop-above", "drop-below"));
}
function moveStaticKey(from, to) {
  const sts = CONFIG["静态数据"] || {};
  const keys = Object.keys(sts);
  if (from < 0 || from >= keys.length) return;
  let t = Math.max(0, Math.min(keys.length, to));
  if (t === from || t === from + 1) return;          // 放回原位，不算移动
  const order = keys.slice();
  const moved = order.splice(from, 1)[0];
  if (t > from) t--;                                 // 先摘除再插入的槽位补偿
  order.splice(t, 0, moved);
  const out = {};
  order.forEach(k => { out[k] = sts[k]; });
  CONFIG["静态数据"] = out;
  log("调整静态表顺序", "「" + moved + "」移到第 " + (order.indexOf(moved) + 1) + " 位");
  renderLeft();
  scheduleSave();
}

/* 静态表列排序：升序 → 降序 → 取消（三态） */
function sortStatic(ci) {
  if (staticSort.col === ci) {
    if (staticSort.dir === 1) staticSort.dir = -1;
    else { staticSort.col = -1; staticSort.dir = 1; }
  } else {
    staticSort.col = ci; staticSort.dir = 1;
  }
  renderStaticPanel();
}

/* ===== 环节通用编辑：双击 / 添加 / 插入 =====
   ★设计标准：数据环节是开放式积木——可双击编辑「说明」、可在任意位置插入新环节、可在末尾追加；
     模式在双击环节打开的编辑弹窗里切换（2026-11-13 用户定：切换条从面板顶部移入弹窗，主面板防误触）；
     开始 / 结束边界块不可编辑，只作链路两端标记。
   新增环节默认「短路表」空模板，编号自动顺延「环节N」；「起点 / 终点」数据层标签已废弃，新环节不再写入。
   边界节点（开始/结束）不可删、不可插入（用各自 key 的保留名）。 */

function renumberStages() {
  // 把当前 转换逻辑 中 环节N 重新编号为连续 1..n（保持顺序），返回受影响 key 映射
  const logic = CONFIG["转换逻辑"];
  const order = stageKeys();
  const dataKeys = order.filter(k => !isBoundaryKey(k));
  let i = 0;
  const renameMap = {};
  for (const old of dataKeys) {
    i++;
    const neu = "环节" + i;
    if (old !== neu) renameMap[old] = neu;
  }
  if (Object.keys(renameMap).length) {
    const reordered = {};
    for (const k of order) {
      if (renameMap[k]) reordered[renameMap[k]] = logic[k];
      else reordered[k] = logic[k];
    }
    CONFIG["转换逻辑"] = reordered;
    // ★关键修复：重编号会改 key（如 环节7→环节6），必须把 curStage 同步到新 key，
    //   否则后续 renderPanel 会读 转换逻辑[旧key] 得到 undefined 而崩（Cannot read '输出字段'）。
    if (renameMap[curStage]) curStage = renameMap[curStage];
  }
  return renameMap;
}

function nextStageNum() {
  const dataKeys = stageKeys().filter(k => !isBoundaryKey(k));
  let max = 0;
  for (const k of dataKeys) { const n = stageNum(k); if (n > max) max = n; }
  return max + 1;
}

/* 插入环节前二次确认（防误触）：确认后才真正执行 insertStage */
function stageShortLabel(sk) {
  if (isStartKey(sk)) return "开始";
  if (isEndKey(sk)) return "结束";
  return "环节" + (stageMeta(sk).num || sk);
}
function confirmInsert(afterKey) {
  if (isBoundaryKey(afterKey)) { alert("边界节点（开始/结束）之后不可插入，请在环节之间插入。"); return; }
  if (!confirm("确定在「" + stageShortLabel(afterKey) + "」之后插入一个新环节？\n（将新增一个空的短路表环节，可随后配置规则）")) return;
  insertStage(afterKey);
}

function insertStage(afterKey) {
  if (isBoundaryKey(afterKey)) { alert("边界节点（开始/结束）之前/之后不可插入，请在环节间插入。"); return; }
  const order = stageKeys();
  const n = nextStageNum();
  const key = "环节" + n;
  CONFIG["转换逻辑"][key] = {
    "说明": "插入环节（短路表模式，待配置）",
    "输出字段": {}, "模式": "规则"
  };
  // 插到 afterKey 之后
  const logic = CONFIG["转换逻辑"];
  const reordered = {};
  let inserted = false;
  for (const k of order) {
    reordered[k] = logic[k];
    if (k === afterKey) { reordered[key] = logic[key]; inserted = true; }
  }
  if (!inserted) reordered[key] = logic[key];
  CONFIG["转换逻辑"] = reordered;
  renumberStages();
  log("插入环节", "在 " + afterKey + " 之后新增 " + key);
  renderLeft(); selectStage(key);
  scheduleSave();
}

function deleteStage(key) {
  if (isBoundaryKey(key)) { alert("开始/结束边界节点不可删除。"); return; }
  const order = stageKeys();
  if (order.filter(k => !isBoundaryKey(k)).length <= 1) { alert("至少保留一个数据环节，无法删除。"); return; }
  const name = key;
  // ★#20：环节删除不可逆——连续三次确认防误删（任何一次取消即中止）
  const prompts = [
    "⚠ 即将删除环节「" + name + "」。\n该环节的全部规则、输出字段、特殊规则将被永久删除，且无法找回。\n\n确定要继续吗？",
    "再次确认：环节「" + name + "」删除后将无法恢复，任何已配置的映射 / 过滤 / 检测规则都会一并丢失。\n\n仍要删除吗？",
    "最后警告（第 3 次）：你正在永久删除环节「" + name + "」。\n这是不可逆操作。\n\n【最后一次】确认删除？点「取消」可安全退出。"
  ];
  for (let i = 0; i < prompts.length; i++) {
    if (!confirm(prompts[i])) {
      alert("已取消删除，环节「" + name + "」保持不变。");
      return;
    }
  }
  delete CONFIG["转换逻辑"][key];
  closeStageDialog();   // 唯一调用入口 = 编辑弹窗底部「删除环节」按钮（#44 起环节链块上无删除入口；关弹窗幂等）
  renumberStages();
  log("删除环节", key);
  // 删除/重编号后，若当前选中环节已不存在（被删或 key 改动），落到首个数据环节，避免 renderPanel 读 undefined 崩
  if (!CONFIG["转换逻辑"][curStage]) curStage = firstDataStageKey();
  renderLeft(); renderPanel(); scheduleSave();
}

/* ═══ 编辑环节（用户 2026-11-05 定）：独立一层弹窗 ═══
   ★设计标准：不再复用「原始 JSON」预览弹窗（#modalMask）——那层外壳自带
     「复制全部 / 关闭」按钮，且内容塞在灰底 <pre> 里，与本弹窗的「删除环节 / 保存 / 取消」
     形成两层窗口、两组按钮。改为与「编辑输出字段」「编辑文档」同款的独立 confirm-box：
     一层窗口、一组按钮；遮罩点击 / ESC / 取消均关闭且不写回。
   ★开始 / 结束边界块不可编辑（用户 2026-11-05 定）：环节链不给边界块挂双击，
     本函数也直接 return；边界块只可单击查看，其「说明」保留在 JSON 里，不提供编辑入口。
   ★编辑环节弹窗编辑「说明」+ 模式切换（2026-11-13 用户定：模式条从面板顶部移入本弹窗，主面板防误触）；
     不显示「说明」标签；模式条点击即走 switchStageMode 原确认流、即时生效并刷新弹窗内高亮，
     弹窗「保存」仍只写回「说明」、不读写 JSON 的「模式」字段。
   ★界面文案只写名词本体：按钮 / tooltip 一律不带括号解释（界面文案防废话）。
   ★★不显示字数、不做 40 字超长确认（用户 2026-11-05 定）：输入框下方不挂任何字数徽标，
     保存时也不因「说明」长度弹确认框；字数统计只留在提示词 / 文档 MD 编辑器。
   ★边界：只改呈现层；模式条位置（面板顶 → 编辑弹窗）、「说明」写回、删除三次确认、JSON 结构都不变，
     「原始 JSON / 格式说明 / 操作日志」三个窗口保持原样。 */
function closeStageDialog() {
  const m = document.getElementById("stage-edit-mask"), b = document.getElementById("stage-edit-box");
  if (b && b.__onKey) document.removeEventListener("keydown", b.__onKey);
  if (m) m.remove();
  if (b) b.remove();
}
function editStage(key) {
  if (isBoundaryKey(key)) return;   // 开始 / 结束边界块不可编辑
  curStage = key;
  curView = "rules";
  curNavTab = "stages";   // 侧边栏板块选项卡跟随视图（用户 2026-11-13 定）
  const st = CONFIG["转换逻辑"][key] || {};
  closeStageDialog();
  const mask = document.createElement("div");
  mask.id = "stage-edit-mask"; mask.className = "confirm-mask";
  mask.onclick = closeStageDialog;
  const box = document.createElement("div");
  box.id = "stage-edit-box"; box.className = "confirm-box";
  box.innerHTML = `<div class="field-edit-title">编辑环节 ${escHtml(key)}</div>`
    + `<div class="stage-edit-form">`
    + `<input id="edit_desc" class="inp" value="${escAttr(st["说明"]||"")}"></div>`
    + `<div class="stage-edit-form"><div id="se-mode">${modeSwitchBar(key)}</div></div>`
    + `<div class="field-edit-actions">`
    + `<button class="btn small danger" id="se-del">删除环节</button>`
    + `<span class="field-edit-right"><button class="btn small" id="se-cancel">取消</button>`
    + `<button class="btn small primary" id="se-ok">保存</button></span></div>`;
  document.body.appendChild(mask);
  document.body.appendChild(box);
  box.querySelector("#se-cancel").onclick = closeStageDialog;
  box.querySelector("#se-ok").onclick = () => commitEditStage(key);
  box.querySelector("#se-del").onclick = () => deleteStage(key);
  setTimeout(() => {
    const onKey = (ev) => { if (ev.key === "Escape") { document.removeEventListener("keydown", onKey); closeStageDialog(); } };
    document.addEventListener("keydown", onKey);
    box.__onKey = onKey;
    try { box.querySelector("#edit_desc").focus(); } catch (e) {}
  }, 0);
}

function commitEditStage(key) {
  const st = CONFIG["转换逻辑"][key] || {};
  const desc = document.getElementById("edit_desc").value.trim();
  // 模式行即时生效（点击即走 switchStageMode 原确认流），「保存」只写回「说明」
  if (desc) st["说明"] = desc; else if ("说明" in st) delete st["说明"];
  CONFIG["转换逻辑"][key] = st;
  log("编辑环节", key);
  closeStageDialog();
  renderLeft(); renderPanel(); scheduleSave();
}

/* 切换环节模式（短路表 / 过滤表 / 检测表 / 提示词）
   ★切模式不再丢数据：切走前存档、切回时取回，故只需一次确认（防误触），不再需要「三次弹窗警告丢失」。 */
function switchStageMode(sk, mode) {
  const st = CONFIG["转换逻辑"][sk] || {};
  const from = stageModeKey(sk);
  if (from === mode) return;
  const ok = window.confirm(
    "切换环节「" + sk + "」模式：" + modeLabel(from) + " → " + modeLabel(mode) + "\n\n" +
    "★数据不会丢失：原「" + modeLabel(from) + "」的参数会存进本环节的「模式存档」，\n" +
    "   切回该模式时原样恢复（JSON 里同时记住五种模式，模式字段只是「当前选哪个」）。\n\n" +
    "会变的只有「当前生效」的那份参数：\n" +
    "· 短路表 → 用「输出字段」（字段级规则）\n" +
    "· 过滤表 → 用「规则」（弃行规则，命中即去掉；无输出字段）\n" +
    "· 检测表 → 用「规则」（检测规则，命中只报异常）+ 输出字段透传骨架\n" +
    "· 提示词 → 只渲染 markdown 正文（特殊规则），数据表不动\n" +
    "· 键映射表 → 用「键映射」分层表（值全透传，只改键名 + 标注该改名在单据头还是明细行；明细=上一环节输出字段）\n\n" +
    "确认切换？"
  );
  if (!ok) return;
  const r = applyStageMode(sk, mode);
  const seMode = document.getElementById("se-mode");   // 弹窗开着时同步刷新模式条高亮（2026-11-13 移入弹窗）
  if (seMode) seMode.innerHTML = modeSwitchBar(sk);
  log("切换模式", sk + "：" + modeLabel(r.from) + " → " + modeLabel(mode) +
    (r.saved.length ? "（存档 " + r.saved.join("/") + "）" : "") +
    (r.restored.length ? "（取回 " + r.restored.join("/") + "）" : ""));
  setAutoHint("已切换到「" + modeLabel(mode) + "」；原「" + modeLabel(r.from) + "」数据已存档，切回即恢复");
  renderLeft(); renderPanel(); scheduleSave();
}

/* 提示词（特殊规则）编辑：失焦写回并预览 */

function toggleCondFieldsMenu(e) {

  if (COND_FIELDS_MENU_OPEN) { closeCondFieldsMenu(); return; }
  const all = fieldTableFields(curStage, curField);
  // 初始勾选 = 当前实际显示的列（自动模式下就是本字段规则里真带条件的那些）

function delRule(ri) {

/* 条件编辑：ci = 同字段第几个条件（0 起）。op/val 为空串 → 删除该条件 */
function updateCond(ri, field, ci, key, val) {
  // ★设计标准：行内多条件 = AND——同字段可叠多个条件（「＋且」→ 菜单选 值比较 走 addCond），
  //   删除按条件序号 ci 精确删单个（不误删同字段全部）；「或」= 添加规则行（行间短路）
  const rule = getFd()["规则"][ri];
  const conds = (rule["条件"] || []).filter(c => c["字段"] === field);
  const cond = conds[ci];
  if (!cond) {
    // 该条件不存在：通配格选算子 / 新建条件
    if (!val || val === "") return;
    pushHistory();
    rule["条件"].push({ "字段": field, "算子": key === "op" ? val : "完全等于", "值": key === "val" ? val : "" });
    log("新建条件", `${curField} 第 ${ri+1} 行 ${field} 算子=${key === "op" ? val : "完全等于"}`);
    renderPanel(); scheduleSave();
    return;
  }
  const cur = cond[key === "op" ? "算子" : "值"];
  if (val === "") {
    // 算子选「通配」或值清空 = 删除该条件（同字段多条件时精确删这一个）
    pushHistory();
    const idx = rule["条件"].indexOf(cond);
    if (idx >= 0) rule["条件"].splice(idx, 1);
    log("条件置空", `${curField} 第 ${ri+1} 行 ${field} 第${ci+1}个条件 → 通配`);
    renderPanel(); scheduleSave();
    return;
  }
  if (cur === val) return;
  pushHistory();
  if (key === "op") {
    cond["算子"] = val;
    if (NO_VALUE_OPS.includes(val)) cond["值"] = ""; // 无值算子：清空残留值
  } else if (key === "val") {
    cond["值"] = val;
  }
  log(key === "op" ? "修改算子" : "修改条件值", `${curField} 第 ${ri+1} 行 ${field} 第${ci+1}个条件${key === "op" ? " 算子=" : " ="}${val}`);
  renderPanel(); scheduleSave();
}

function toggleCondLookup(ri, field, ci) {

  if (!c) return;
  pushHistory();

  else { c["查表"] = { "表": "", "键": "", "匹配": `[${field}]`, "值": "" }; }
  renderPanel(); scheduleSave();
}
function updateCondLookup(ri, field, ci, key, val) {
  const conds = (getFd()["规则"][ri]["条件"] || []).filter(c => c["字段"] === field);
  const c = conds[ci];

/* 添加且条件：同字段多条件（AND），新增一条空条件（默认通配下拉） */
function addCond(ri, field) {

/* ★存在性条件（{字段,表,列,模式}）自 2026-11-07 起不再提供新增入口（V5 查表判定是其超集，见「＋且」菜单）；
   存量存在性条件仍可渲染、可切回值比较（ruleCondToValue / filterCondToValue）、可删除。 */
/* 存在性 → 值比较：清掉「表/列/模式」，避免引擎 match_any 仍判成存在性条件 */
function ruleCondToValue(ri, field, ci) {
  const c = (getFd()["规则"][ri]["条件"] || [])[ci];
  if (!c) return;
  pushHistory();
  delete c["表"]; delete c["列"]; delete c["模式"];
  c["算子"] = "完全等于"; c["值"] = "";
  log("条件改值比较", `${curStage} 第 ${ri+1} 行 ${field} 条件${ci+1}`);
  renderPanel(); scheduleSave();
}

/* 删除单个条件：ci = 同字段第几个条件（0 起）——只删这一个，不影响同字段其他条件。
   ★设计标准：删除是破坏性操作，必须二次确认（与 delRule 一致）；弹顶层确认框、确认后才执行。
   注意后果：若该字段原本只有这一个条件，删完后本行该字段即回到「通配」（全通配兜底行永远命中）。 */
function delCond(ri, field, ci) {
  const rule = getFd()["规则"][ri];
  const same = (rule["条件"] || []).filter(c => c["字段"] === field);
  const cond = same[ci];
  if (!cond) return;
  const desc = `${cond["算子"] || "通配"}${cond["值"] ? " " + cond["值"] : ""}`;
  let tip = `确认删除第 ${ri+1} 行「${field}」的第 ${ci+1} 个条件：${desc}？\n`
          + `（该行「${field}」共 ${same.length} 个条件，只删这一个；不可撤销，删除前会写入撤销栈，可从左侧「撤销」恢复。）`;
  if (same.length === 1) {
    tip += `\n⚠️ 删完后该字段无任何条件 = 通配；若本行其他字段也全为通配，该行将成为「全通配兜底行」（永远命中）。`;
  }
  if (!confirm(tip)) return;
  _delCondCore(ri, field, ci);
}
function _delCondCore(ri, field, ci) {
  const rule = getFd()["规则"][ri];
  const same = (rule["条件"] || []).filter(c => c["字段"] === field);
  const cond = same[ci];
  if (!cond) return;
  const idx = rule["条件"].indexOf(cond);
  if (idx < 0) return;
  pushHistory();
  rule["条件"].splice(idx, 1);
  log("删除条件", `${curField} 第 ${ri+1} 行 ${field} 第${ci+1}个条件`);
  renderPanel(); scheduleSave();
}

function updateOut(ri, key, val) {
  // ★设计标准：编辑即写回绑定 JSON（界面所见即 JSON 结构），改完走撤销栈+自动保存
  const rule = getFd()["规则"][ri];
  if (!rule["输出"]) rule["输出"] = { "类型": "常量", "值": "" };
  pushHistory();
  if (key === "type") {
    rule["输出"] = { "类型": val };
    if (val === "常量") rule["输出"]["值"] = "";
    else if (val === "变量") { rule["输出"]["字段"] = ""; rule["输出"]["加工"] = ""; }
    else if (val === "报异常") rule["输出"]["说明"] = "";
    else if (val === "查表") { rule["输出"]["表"] = ""; rule["输出"]["键"] = ""; rule["输出"]["值"] = ""; rule["输出"]["匹配"] = ""; }
  } else if (key === "val") rule["输出"]["值"] = val;
  else if (key === "field") rule["输出"]["字段"] = val;
  else if (key === "proc") rule["输出"]["加工"] = val;
  else if (key === "msg") rule["输出"]["说明"] = val;
  else if (key === "tbl") rule["输出"]["表"] = val;
  else if (key === "key") rule["输出"]["键"] = val;
  else if (key === "match") rule["输出"]["匹配"] = val;
  else if (key === "mode") { if (val) rule["输出"]["匹配模式"] = val; else delete rule["输出"]["匹配模式"]; }
  else if (key === "exist") { if (val) rule["输出"]["存在检查"] = true; else delete rule["输出"]["存在检查"]; }
  log("修改输出", `${curField} 第 ${ri+1} 行 输出 ${key}=${val}`);
  renderPanel(); scheduleSave();
}

/* 解析变量输入框内容：抽出全部 [引用]、是否空引用、非法引用名 */
function parseVarRefs(raw, fields) {
  const refs = [...raw.matchAll(/\[([^\]]*)\]/g)].map(m => m[1].trim());
  return {
    refs,
    empty: /\[\s*\]/.test(raw),
    invalid: refs.filter(n => !isVarName(n, fields)),
  };
}
/* 单引用写回：[字段] → {字段}；[字段]+加工（-1 / +2 / yyyyMM）→ {字段, 加工}。
   命中单引用形态（含「内容未变」）返回 true；未命中（多引用/文本混排/加工符非法）返回 false */
function applySingleVarRef(rule, raw, ri) {
  const whole = raw.match(/^\[(.+)\]$/);
  if (whole) {
    const name = whole[1].trim();
    const changed = rule["输出"]["字段"] !== name || "加工" in rule["输出"] || "文本" in rule["输出"];
    if (!changed) return true;
    pushHistory();
    rule["输出"]["字段"] = name;
    delete rule["输出"]["加工"];
    delete rule["输出"]["文本"];
    log("修改变量", `${curField} 第 ${ri+1} 行 变量=[${name}]`);
    scheduleSave();
    return true;
  }
  // [name]+加工 简写（-1 / +2 数字偏移，yyyyMM 等日期格式）
  const single = raw.match(/^\[(.+)\](.+)$/);
  if (single) {
    const name = single[1].trim();
    const proc = (single[2] || "").trim();
    const isProc = /^[+-]?\d+$/.test(proc) || /[a-zA-Z]/.test(proc);
    if (isProc) {
      const changed = rule["输出"]["字段"] !== name || (rule["输出"]["加工"] || "") !== proc || "文本" in rule["输出"];
      if (!changed) return true;
      pushHistory();
      rule["输出"]["字段"] = name;
      rule["输出"]["加工"] = proc;
      delete rule["输出"]["文本"];
      log("修改变量", `${curField} 第 ${ri+1} 行 变量=[${name}]${proc}`);
      scheduleSave();
      return true;
    }
  }
  return false;
}

/* ★设计标准：变量输出 = 单输入框 `[引用]+加工`——中括号内是字段引用（必须在本环节输入字段，
   否则输入框内红底标红不写回），中括号后直接跟加工符（-1/+2 按天偏移、yyyyMM 等 strftime 格式）；
   单引用+加工存 {字段,加工}（向后兼容），多引用/自由文本混排存 {文本}。
   ⚠ 不要用花括号 {字段} 表示变量：JSON 内容本身含单花括号，语法与内容无法区分（中括号才能共存）。
   加工符用纯符号/格式，不要中文「减1天」 */
function updateOutVar(ri, el) {
  const raw = (el.value || "").trim();
  const fields = stageInputFields(curStage);
  const rule = getFd()["规则"][ri];
  if (!rule["输出"]) rule["输出"] = { "类型": "变量" };
  syncVarOverlay(el);  // 镜像层跟随当前值（程序化赋值不触发 input 事件，这里兜底）
  const wrap = el.closest(".var-wrap") || el;

  // 提取所有 [引用]
  const parsed = parseVarRefs(raw, fields);
  if (parsed.empty || parsed.invalid.length || (parsed.refs.length === 0 && !raw)) {
    wrap.classList.add("invalid");
    const bad = parsed.invalid[0] || "(空)";
    el.title = `变量引用「${bad}」不在本环节输入字段列表`;
    setAutoHint(`变量引用「${bad}」无效，请用 [引用名]（如 [${fields[0] || ""}]）或文本混排`);
    return;
  }
  wrap.classList.remove("invalid");
  if (el.dataset.tip) el.title = el.dataset.tip;
  // 白名单「必须显示才能被引用」校验已移除（2026-08-24：补全机制替代，引用只查字段是否存在于本环节输入字段）

  // 单引用：整个就是 [name] → 纯字段引用（无加工）；或 [name]+加工
  if (parsed.refs.length === 1 && applySingleVarRef(rule, raw, ri)) return;

  // 多引用 / 文本混排 → 存 {文本}（引擎替换 [字段] 引用，其余原样输出）
  const changed = (rule["输出"]["文本"] || "") !== raw;
  if (!changed) return;
  pushHistory();
  rule["输出"]["文本"] = raw;
  delete rule["输出"]["字段"];
  delete rule["输出"]["加工"];
  log("修改变量", `${curField} 第 ${ri+1} 行 变量文本=${raw.slice(0, 60)}`);
  scheduleSave();
}

/* ============ 自绘算子下拉 ============
   ★设计标准：必须自绘（div 模拟）——原生 <select> 展开时是系统组件，option 背景色基本不生效，
   用户选的时候看不到算子颜色；自绘展开列表的每个选项也带彩色块+白字，当前项加描边标识。
   交互：点击展开/收起、点选项即写条件、点击外部/滚动/缩放自动关闭。
   ★设计变更（z 轴置顶）：菜单改为渲染到 <body> 的顶层 portal（#op-menu + #op-menu-mask），
   position:fixed 按触发控件 getBoundingClientRect() 定位——天然置顶于所有控件之上，且不被
   .rules-pane-mid 不再另起内层横向滚动容器（2026-11-03 起横向滚动交给外层 .rules-view-body），
   算子菜单依旧 portal 到 <body>，天然置顶于所有控件之上、不被任何裁剪层遮挡。 */

function closeOpMenu() {
  const m = document.getElementById("op-menu");
  const mask = document.getElementById("op-menu-mask");
  if (m) m.remove();
  if (mask) mask.remove();
  OP_MENU_OPEN = null;
}

/* 算子菜单挂载（规则表 / 过滤表共用）：portal 到 <body>（mask + 菜单 + 定位），并记录当前打开态 */
function mountOpMenu(itemsHTML, trigger, openState) {
  const menu = document.createElement("div");
  menu.id = "op-menu";
  menu.className = "op-menu";
  menu.innerHTML = itemsHTML;
  const mask = document.createElement("div");
  mask.id = "op-menu-mask";
  mask.onclick = () => closeOpMenu();
  document.body.appendChild(mask);
  document.body.appendChild(menu);
  positionOpMenu(menu, trigger);
  OP_MENU_OPEN = openState;
}

function toggleOpMenu(e, ri, field, ci) {
  e.stopPropagation();
  const trigger = e.currentTarget;
  const isOpen = OP_MENU_OPEN && OP_MENU_OPEN.ri === ri && OP_MENU_OPEN.field === field && OP_MENU_OPEN.ci === ci;
  closeOpMenu();
  if (isOpen) return;
  const rule = (getFd()["规则"] || [])[ri];
  const conds = (rule && rule["条件"] || []).filter(c => c["字段"] === field);
  const curOp = conds[ci] ? (conds[ci]["算子"] || "") : "";
  mountOpMenu(buildOpMenuItems(ri, field, ci, curOp), trigger, { ri, field, ci, trigger });
}

function pickOp(e, ri, field, ci, op) {

  closeOpMenu();
  updateCond(ri, field, ci, "op", op);
}

// 滚动（非菜单内部）/ 缩放 → 关闭菜单，避免菜单悬空错位或被滚走

function addFilterRule() {

function delFilterRule(ri) {

/* 夜间模式（#23）：首屏渲染前同步设定 data-theme，避免浅色闪一下再变暗。
   解析规则与下方 themeActual()/cycleTheme() 保持一致。 */
(function(){
  try{
    var m = localStorage.getItem('v2_theme') || 'auto';
    var dark;
    if(m==='dark') dark=true;
    else if(m==='light') dark=false;
    else{
      var sysDark=false;
      try{ sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){}
      if(sysDark){ dark=true; }
      else{ var h=new Date().getHours(); dark = !(h>=6 && h<18); }
    }
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  }catch(e){}
})();
</script>

  const SCHEMA_MD = `# 规则链编辑器（RuleChain Editor）· JSON 格式规范 V2

## 顶层结构
| 键 | 必填 | 说明 |
|---|---|---|

| 版本 | ★ | 配置版本（⋯「更多」菜单内显示） |
| 说明 | ◇ | 一句话描述 |
| 字段键别名 | ◇ | 英文字段 → 中文显示名（表头/下拉用）：{英文字段: 键别名}；缺省则原样显示对象键 |
| 文档 | ★ | 文档集合（有序数组 [{名称, 内容}]）：第 1 份一般为项目README，后续放各 API 文档（同层存储）；左栏「文档」区可增减 / 改名 / 编辑内容 / 按住上下拖动调整顺序（数组顺序即显示序，见 #46）；正文为混合渲染编辑器：平时渲染成形，光标所在块就地显示 Markdown 源码，未改动的块原文无损写回，见「#41」） |
| 文件 | ◇ | {输入文件, 输出文件, 描述, 输出?} —— 环节1 输入、最后环节输出；输出={列, 中文表头, 排序, 序号} |
| 静态数据 | ◇ | 静态表字典（**本地静态映射**：行内嵌在本 JSON、在编辑器里直接改；需要 Excel 时由脚本从本区导出）：{表名: {表头, 行, 只读列?, lookup?}} |
| 运行时数据 | ◇ | 外部表声明区（**本地没有源文件**的表：库表快照 + 运行态快照）：{说明, 基准目录, 表: {表名: {来源, 键, 表头, 用途, 刷新}}}；只写声明不写行，编辑器不列出 |
| 转换逻辑 | ★ | 环节字典：{环节N: {说明?, 模式?, 模式存档?, 输入字段(遗留·已废弃), 输出字段, 规则?, 展开?, 过滤?}}——「输入字段」键不再被读取（#71 铁律：输入字段=推导值，见 stageInputFields），存量由实例侧清理 |

## 格式版本号规范（用户 2026-11-05 定；2026-11-11 增小数位）
- Editor 维护一个**编辑器格式版本号**（常量 \`EDITOR_FORMAT_VERSION\`，当前 "V8.1"；V9 取值靠键改轨已定、待落地）。
- **版本形态 = V<整数>.<小数>**（用户 2026-11-11 定）：**整数位 = 结构性变更**（顶层键 / 结构 / 枚举 / 字段约定变化、需要迁移）；**小数位 = 规范 / 约定收紧**（写法 / 文案类约定变化，无结构迁移，实例侧按新规范改写内容即可）。
- 历史：V4=2026-11-06 静态表序号规范变更（序号由 Editor 独立渲染、不写入 JSON、不建议维护，存量旧序号列由 Editor 兼容隐藏让位）；V5=2026-11-07 查表判定条件规范收紧；V5.1=2026-11-11 提示词逐字段声明层次化写法规范（字段名 / 键 / 逻辑首行顶格，缩进仅用于逻辑分支；存量提示词环节特殊规则 A 节由实例侧按规范改写）；V6=2026-11-11 键映射更名（模式值与独占键 "Key映射" → "键映射"）；V8=2026-11-12 键层贯穿（输出字段定义新增可选键 \`键层\`: 单据头|明细行，缺省单据头不落盘；层在键诞生处声明，键映射未改名行沿上游声明、首次改名沿用上游层）。V7=2026-11-12 键映射分层（独占键 \`键映射\` 由扁平改名表改为按层分桶 {单据头, 明细行}、桶内只存改名项；**强制两个桶**：两桶名恒在、空桶写 {}、无第三桶，加载与落盘统一归一，见「★键映射表模式」节）。V8.1=2026-11-13 键映射层列只读（用户定：层的唯一定义处=输出字段「键层」声明，短路表/提示词重新定义输出字段时声明；键映射属透传型环节只继承，改层入口移除、改名条目一律落继承层的桶）。
- **bump 原则**：命中上面对应层级的变化就 bump 相应数位；Editor 纯 UI 微调（不影响 JSON 格式定义、也不改写法约定）**不 bump**。
- JSON 顶层可选维护 \`编辑器版本号\` = 该 JSON 内容所对齐的编辑器格式版本。缺失或落后于编辑器当前版本时：
  1. 编辑器顶栏「重新加载JSON」左侧显示红标「JSON格式版本落后于Editor」（悬停看详情）；
  2. **Engine 每次开始（包括跑哈希校验之前）必须先校验该字段**，落后/缺失即停止执行并报异常，后续由 Agent 介入做格式对齐。
- Editor 渲染 / 保存**不会自动 bump** JSON 里的 \`编辑器版本号\`（只有格式真正对齐后由人 / Agent 更新），否则红标会在未对齐时消失。「新建空白」生成的模板写入当前版本号。
- 「⋯」菜单顶部同时显示两行：编辑器格式版本、JSON 版本号（格式 schemaVersion · 配置版本 · 编辑器版本号状态）。

## 环节模式与「模式存档」（切模式不丢数据）
- 五种模式：短路表（内部键 "规则"）/ 过滤表 / 检测表 / 提示词 / 键映射表（只有这五种，无其它取值；旧值 "Key映射" 加载时迁移为 "键映射"，#74 用户 2026-11-11 定；界面名 2026-11-13 用户定加「表」字，**JSON 内部值与独占键仍为 "键映射" 不变**——沿用「短路表↔规则」内部值/展示名分离先例，零结构变化）
- \`模式\` 只是「当前选哪个」的指针；**五种模式的参数同时保存在 JSON 里**：
  正在用的那份放规范键（\`输出字段\` / \`规则\` / \`键映射\`），其余模式收在本环节的 \`模式存档\` 字典里
- 各模式独占的键：短路表→\`输出字段\`；过滤表→\`规则\`；检测表→\`规则\`（纯形态：无\`输出字段\`、规则挂环节级、对外整行透传，\`stageFieldList\` 回退=本环节输入；混合形态另有\`输出字段\`（字段映射+检测并存，规则走 \`__detect__\` 虚拟选项卡），用户 2026-11-12 定）；提示词→无独占（\`特殊规则\`、\`展开\` 等共享）；键映射表→\`键映射\`（**按层分桶** \`{单据头:{字段:目标键}, 明细行:{…}}\`，V7 起；桶内只存改名项、未改名不写；值全透传，明细行=上一环节输出字段，#66/#74/#2013 用户 2026-11-11/12 定）
- 切走=存档、切回=原样取回 → 切错模式点回来即可还原；引擎只读规范键，不读 \`模式存档\`

## 环节（转换逻辑）
- 数量不限；key = "环节1"…"环节N"（左侧环节链：环节块纵向排列，「环节1..N」块内 = 序号 + 环节「说明」作用标签 + 模式徽章，点击块选中、双击进编辑弹窗（删除入口唯一在弹窗底部「删除环节」）；开始/结束边界块只显示「开始 / 结束」，不渲染说明标签；块之间的「＋环节」按钮零高度、默认隐藏，悬停相邻环节块时浮现并跨压上下两个环节块，不再显示数据层节点名）
- 习惯：环节1 = 源数据 → 展开成明细行（模式=提示词），上一环节输出字段即下一环节输入字段，最后环节常为入库前检测；首个数据环节输入=文件.输入文件
- 每环节：\`输入字段\` = <b>推导值</b>（#71 铁律：恒等于上一环节「输出字段」键序，上游没有则为空；环节对象里的「输入字段」存储键已废弃不读，编辑器渲染用，引擎读全量上下文）；\`输出字段\` = 本环节<b>参与计算</b>的字段（声明顺序=计算顺序，字段可引用先前字段，含中间量）。<b>未声明的字段引擎整行透传、不改值</b>——输出字段 ≠ 数据层全量字段清单，数据层字段集 = 源列逐环节累积（透传 ∪ 各环节输出字段）
- 输出字段：{说明?, 规则: [短路规则行]}
- **环节增强**：
  - \`展开\`（计数展开）: {模式: "计数展开", 数量列, 标记列, 起始, 缺省, 带入?: {表, 键, 匹配, 列}} —— 数量列 N → 复制 N 行，标记列写 1…N，带入选按（键, 标记列）回查
  - \`展开\`（普通/赠品）: {数量列, 赠品列, 标记列, 普通标记, 赠品标记} —— 一行拆普通行+赠品行（数量>0 才生成，行继承源字段）
  - \`缩放\`（分组等比缩放）: {模式: "分组等比缩放", 分组列, 金额列, 目标列, 输出列, 尾差归属?, 占比列?, 容差?} —— 按「分组列」分组，组内各行「金额列」按「目标列」等比缩放后写入「输出列」；尾差归属 "末段"（末段吃尾差）/ "最大段"（尾差补最大段）/ "占比最大"（尾差补占比最大段，须配「占比列」；占比列缺失或组内全空 → 退化为按金额比取最大），默认末段；|Σ金额-目标| ≤ 容差 → 不缩放（各行取原值）；组内任一行金额缺失 → 该组不缩放（输出列留空）
  - \`过滤\`: [{列, 表, 匹配列, 模式}] —— 模式 "精确"=行值∈表[匹配列]；"包含"=表[匹配列]关键词是行值子串；命中即弃行


## 规则行（短路表）
- 🔴🔴 **短路表只负责「判断 + 映射」**：每条规则 = 若干条件（判断）+ 一个产出值（映射）。
  **只产出值，不拦截、不检测、不报异常**（同一句话的三遍：判断+映射 / 判断+映射 / 判断+映射）。
  - ⛔ 短路表里禁止出现拦截类动作：\`报异常\` / \`跳过\` / \`停止\`
  - ✅ 要检测、要拦截 → **单独开一个检测环节**（模式=检测表）去做检测拦截：命中 → 仅记录异常、不弃行、可多行命中
  - ✅ 要剔除行 → 单独开一个过滤环节（模式=过滤表）：命中即弃行
  - ○为什么不能混：短路表是「首中即止」逐字段往下推值的；一旦把拦截塞进某个字段的第 N 条规则，
    检测就被藏进映射链深处——谁拦的、拦了谁、还差哪几条，一眼看不全。
    检测必须是检测环节里那张能一眼看全的表，映射必须是纯到不用担心副作用的表。
- \`条件\`: [{字段, 算子, 值}] —— 行内 AND；空数组 = 全通配兜底
  - ★查表判定条件（V5，用户 2026-11-07 定案）：条件元素 = \`\u{7B}字段, 查表:\u{7B}表,键,匹配,值,匹配模式,存在检查,不存在,行筛选\u{7D}\u{7D}\` ——
    **必须带「字段」键**（渲染进所属字段的条件列，不设独立列）；\`匹配\` 恒为 \`[字段]\`（自动生成、不可手写）；
    \`存在检查\` 必须为 true，\`不存在\`=true 即「未查到」（界面为 查到/未查到 单选器）；
    条件成立 ⟺ 查表命中/未命中，与同规则其它条件 AND（引擎 match_any ①分支）。
    旧形态（V4 及更早，不带「字段」键的独立查表条件）为不合规：Editor 兜底显示在首个输入字段列下并标红警告。
- 算子：完全等于/不等于/包含/前缀包含/后缀包含/正则/数字大于/数字小于/数字大于等于/数字小于等于/日期大于等于/日期小于等于/为空/非空（日期算子值支持 [字段] 引用）
- \`输出\`: {类型, …} —— **短路表只允许「产出值」的三类**（下拉里也只给这三类）
  - 常量 → \`值\`
  - 变量 → 中括号 [字段名] 引用，单框输入：
    - 单引用+加工 → \`字段\` + \`加工\`（如 [某日期字段]-1 / [某日期字段]yyyyMM）
    - 多引用/自由文本混排 → \`文本\`（引擎替换所有 [字段] 引用，其余字面输出，如 {"日期":"[销售日期]"…}）
  - ⛔ 跳过 → 弃当前行；报异常 → \`说明\`（异常信息）；停止 → 终止流程 —— **这三种是拦截类动作，短路表禁用**；
    它们分别属于过滤环节（跳过）、检测环节（报异常）、检测环节（停止）。存量违规行会挂红标提示搬走
  - 查表 → \`匹配\`（用什么值匹配查询字段，\`[字段]\`引用或常量，如 \`[某编码字段]\`，界面上置顶）+ \`表\`（目标表，下拉选静态表）+ \`键\`（查询字段，匹配键列）+ \`值\`（目标字段，取值列）
    - \`匹配模式\`: "包含" → 表键列值（关键词）出现在匹配值中；"被包含" → 匹配值（短词）出现在表键列值（长文本）中（默认精确=完全相等）
    - \`存在检查\`: true → 命中即返回 "1"（不取值），用于"某值是否在表中"判断
    - \`行筛选\`: [条件...] → 目标表行级附加条件（AND，值支持 [字段] 引用）；条件可含 {"任一": [条件...]} 或组；加 "空视为通过": true → 该列值为空时条件通过（报价有效期）
  - 结构化留底（原 JSON 动作）= \`变量\`+\`文本\`：文本里直接写 JSON 串、用 \`[字段]\` 占位（如 \`{"编码":"[某编码字段]","标记":"[某标记字段]"}\`），引擎逐字替换、其余字面输出，无需单独动作

## 文件.输出（输出格式声明）
- \`列\`: 输出列模板（英文字段名数组，值=上下文对应字段，缺失留空）
- \`中文表头\`: 第 2 行中文表头（与 v1.5 输出一致：英文+中文两行表头）
- \`排序\`: {键: [字段名...]} —— 输出前按指定字段排序
- \`序号\`: [{列, 类型: "分组"|"全局", 键?}] —— 分组=按键分组递增（单据序号）；全局=全局递增（明细序号）

## 静态数据（本地静态映射，行内嵌、可编辑）
- 判据：**本地有没有这份数据的源文件** —— 本地人工维护的映射表 = 一张表，行内嵌在本 JSON（改映射就在编辑器里改）
- \`表头\`: 列名数组；\`行\`: 值数组（可在表格里直接改）
- ★ Editor 按 \`表头\` **原样渲染列**：列数 / 列名 / 顺序一律以 JSON 为准，不按位置或列名推断角色
- ★ 序号列由 **Editor 独立渲染**（首列、居中、按当前视图顺序编号），**不写入 JSON**；JSON \`表头\` **不要求也不建议**维护序号列（历史 JSON 若仍带序号列会照原样再显示一列、出现重复，故不建议）
- 最右「操作」列（删除行按钮）是唯一强制追加的界面列
- \`只读列\`: 只读列名数组（**只认这里显式声明的列**）；未声明的列一律可编辑
- 常见映射表建议用 5 列「合思编码 / 合思名称 / 空表头占位列 / 协同编码 / 协同名称」（序号不必写进 JSON），**仅为建议格式**，详见 README
- ★ 本区**只放映射关系**（源系统 ID ↔ 目标系统 ID 之类），且必须是本地人工维护的那几张

## 运行时数据 = 外部表（只放声明，不放行）
- 判据：**本地没有源文件**的数据，一律进本区（与"是不是映射"无关）：
  库表快照（全量主数据映射 / 账号表 / 往来单位档案表 …）
  + 运行态快照（已处理记录 / 备注指纹 / 凭证锁 / 明细段 …）
- \`来源\`（相对配置目录的文件路径）、\`键\`（文件内 {表:{...}} 中取哪张）、\`表头\`、\`用途\`、\`刷新\`（重建命令）
- ★ 编辑器左导航**不列**本区（只是声明，界面上改不动）；但表名在规则里照常引用，查表下拉里照常可选

## 编辑器通用约定
- 条件格：默认「通配」= 灰字；具体算子 = 彩块白字（自绘下拉，展开也着色）
- 一格里多控件分行 + 宽度对齐；多行文本自动增高
- 变量中括号输入，非法变量名整框标红
- 编辑实时写回 JSON + 自动保存(localStorage) + 撤销/重做 + 操作日志
- 纯浏览器运行（无任何后端服务）：以「打开 JSON」**选中具体的 .json 文件**载入 → 编辑自动写回原文件（或点「保存」立即写回）；需要「覆盖前备份」时用「⋯」→「打开目录（启用覆盖前备份）」选一次 JSON 所在文件夹
- **覆盖前备份**：每次落盘（自动保存 / 手动保存）前，先把磁盘上即将被覆盖的旧内容原样写一份到 JSON 同目录的 \`备份\` 文件夹（不存在当场创建）；文件名 = \`原名_YYYYMMDD_HHMMSS.json\`，同秒多次则追加 \`_2\`/\`_3\`…。找回方式：把备份文件复制回原名 \`主转换逻辑.json\` 覆盖即可。`;

/* 环节列表：从 JSON 转换逻辑动态读取（通用化，不硬编码项目环节名） */
/* ===== 通用流水线：边界节点（开始/结束）+ 环节顺序 =====
   边界节点 key 约定：阶段0_开始 / 阶段99_结束（与「环节N」并存，不参与 环节N 数值排序）。
   开始/结束节点是「提示词驱动脚本」的权威规格（取数/落库），纯文档+可编辑，引擎视其为 no-op 跳过。
   编辑器对任何 agent 开放：环节可双击改名、可增删/插入、每环节可在「短路表 ↔ 提示词」间切换。 */
const START_KEYS = ["阶段0_开始", "0_开始", "开始"];
const END_KEYS = ["阶段99_结束", "99_结束", "结束"];
function isBoundaryKey(k) { return START_KEYS.includes(k) || END_KEYS.includes(k); }
function isStartKey(k) { return START_KEYS.includes(k); }
function isEndKey(k) { return END_KEYS.includes(k); }

/* ★编辑器格式版本号（用户 2026-11-05 定）：
   - 只在 JSON 格式定义变化（顶层键 / 结构 / 枚举 / 字段约定变化，需要迁移）时才 bump；
     Editor 微调 UI（不动 JSON 格式）不 bump。
   - JSON 顶层可选维护「编辑器版本号」= 该 JSON 内容所对齐的编辑器格式版本。
     缺失或落后 → ① 顶栏「重新加载JSON」左侧红标提示；② Engine 启动即报错拒绝执行（见 README「格式版本号规范」），
     后续由 Agent 介入做格式对齐。Editor 渲染/保存**不会自动 bump** JSON 里的该字段（只有对齐后由人/Agent 更新），
     否则红标会在未对齐的情况下消失，失去提示意义。 */
const EDITOR_FORMAT_VERSION = "V8.2";  // V8.2：输出字段层序规范（2026-11-13，用户定；同日下调为建议型）——定义层的模式（短路表/提示词）输出字段建议单据头在前、明细行在后、不交错（缺省视同单据头）；仅排列建议、不改语义，Editor 对违序 JSON 如实渲染、不重排不拦截，可长按拖拽自行调整顺序；小数位 bump、JSON 结构零变化。2026-11-13：模式「键映射」界面更名「键映射表」（纯 UI 微调、按 bump 原则不 bump，JSON 内部值与独占键不变）；同日术语定名——界面与文档「字段名/字段名称」统一改称「键别名」（键不变），目的让键别名明确从属于键，纯用语调整、JSON 结构零变化、不 bump；次日（2026-11-14）再定「键别名」→「键别名」（「别名」词义自带从属，键别名在英文键场景覆盖不准；JSON 结构键「字段键别名」与存量兼容键「键别名」保留不改），仍纯用语调整、不 bump。V8.1：键映射层列只读（2026-11-13，用户定）——层只在输出字段定义处声明（短路表/提示词重新定义输出字段时声明），键映射属透传型环节只继承；面板层列改只读、改层入口（commitKeyLayer）移除，改名条目一律落继承层的桶。JSON 结构零变化，实例 JSON「编辑器版本号」对齐随结构类对齐动作一并推进。V8：键层贯穿（2026-11-12，用户定；需求表 #85）——输出字段定义新增可选键 "键层": "单据头"|"明细行"（缺省单据头、缺省不落盘），键的报文层归属在键诞生处声明、贯穿整套流程；键映射未改名行层 = 沿上游键层声明，首次改名沿用上游层；键映射两桶结构不变（V7）。实例侧对齐：顶层「编辑器版本号」→ "V8"，引擎版本白名单同批升（只改一边会拒跑）。V7：键映射分层（2026-11-12，用户定；专项需求表 #2013）——独占键「键映射」由扁平改名表 {字段名:目标键名} 改为按层分桶 {单据头:{…},明细行:{…}}；桶内只存改名项（没改名的不写），层 = 这次改名落在报文哪一层；同层同目标键才算重复、跨层同键合法；旧扁平格式加载时内存迁移为「全部归单据头」（不写盘）。实例侧对齐：键映射环节改写成两桶 + 顶层「编辑器版本号」→ "V7"，且 Engine 的 SUPPORTED_EDITOR_FORMAT_VERSION 必须同批升 V7（只改一边会拒跑）。V6：键映射更名（2026-11-11，用户定；需求表 #74）——模式值与独占键 "Key映射" → "键映射"（枚举/字段约定变更，整数位 bump）；Editor 加载时内存迁移旧值，实例侧 JSON 对齐动作：把键映射环节的 "模式":"Key映射" 与独占键 "Key映射" 改为 "键映射"，然后把顶层「编辑器版本号」更新为 "V6"。V5.2：输入字段铁律（2026-11-11，用户定；需求表 #71）——环节输入字段 ≡ 上一环节「输出字段」（完全相等含顺序），上游无输出字段定义则输入为空；「输入字段」存储键废弃不读，存量由实例侧清理。V5.1：提示词逐字段声明层次化写法规范（2026-11-11，用户定；需求表 #68/#69）——特殊规则第一板块 A 节：字段名/键/逻辑首行顶格，缩进仅用于逻辑分支（如果…则：顶格、分支体缩进1级、否则随层级递进），存量提示词环节文案由实例侧对齐改写（已定调弱规范、改写自愿）；配套渲染器支持行首缩进可见（md-i1..4）。V5：查表判定条件规范收紧（2026-11-07，用户定）——条件元素 {字段, 查表:{...}} 必须带「字段」键（渲染进所属字段列，不设独立列）；「匹配」恒为 [字段] 自动生成、不可手写；「存在检查」必须为 true，「不存在」=true 即「未查到」（界面为 查到/未查到 单选器）。V4：静态表序号规范变更（2026-11-06，需求表 #36）——序号 Editor 独立渲染、不写入 JSON、不建议维护；存量旧「序号」列由 Editor 兼容隐藏让位。实例侧 JSON 应对齐后更新「编辑器版本号」
function parseFormatVersion(s) { const m = String(s ?? "").match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : 0; }  // ★支持小数位：整数位=结构变更、小数位=规范/约定收紧（用户 2026-11-11 定）
function jsonEditorVerLags() {
  return parseFormatVersion(CONFIG && CONFIG["编辑器版本号"]) < parseFormatVersion(EDITOR_FORMAT_VERSION);
}
/* 版本相关 UI 刷新：「⋯」菜单两行版本信息 + 落后红标（setConfig 与启动时调用） */

/* ★设计标准：算子 / 输出动作枚举 = JSON 约定的一部分（与「转换逻辑」条件算子、输出类型一一对应），
   增删算子必须同步修改 JSON schema 文档（本文件头部注释 + 「格式说明」） */
const OPS = ["完全等于", "不等于", "包含", "前缀包含", "后缀包含", "正则", "数字大于", "数字小于", "数字大于等于", "数字小于等于", "为空", "非空"];
const NO_VALUE_OPS = ["为空", "非空"]; // ★设计标准：无值算子（布尔判断）选中后不显示值输入框
const OUT_TYPES = ["常量", "变量", "跳过", "报异常", "停止", "查表"];  // ★设计标准：输出动作6种（变量支持[字段]混排文本，结构化留底串也走变量，无需单独 JSON 动作）
/* ★设计标准（2026-10-23 用户定）：短路表 = 判断 + 映射 ——【只产出值，不做检测拦截】。
   一条短路规则 = 若干条件（判断）+ 一个产出值（映射）；谁要检测谁去检测环节，
   谁要剔行谁去过滤环节：混淆的代价是检测被藏进某个字段的第 N 条规则，一眼看不全谁拦了谁。
   ○MAPPING_OUT_TYPES = 短路表（inMappingField() 为真）下拉里唯一可选的三类 —— 都只是「算出一个值」
   ○INTERCEPT_OUT_TYPES = 拦截类动作：跳过→过滤表（弃行）、报异常→检测表（记录）、停止→检测表（终止）
   ○UI 落地：短路表下拉不列拦截动作（选不到 = 不可能再犯）；存量脏配置照实显示 + 挂红标 + 面板顶部汇总，
     由人工搬去检测环节，编辑器不擅自改数据（禁止静默挪动规则行）。 */
const MAPPING_OUT_TYPES = ["常量", "变量", "查表"];
const INTERCEPT_OUT_TYPES = ["跳过", "报异常", "停止"];
function isInterceptOut(t) { return INTERCEPT_OUT_TYPES.indexOf(t) >= 0; }
/* 本环节（短路表）里的违规拦截行清单：[{字段, 行号, 类型}] —— 顶部警示条与红标共用同一份判据 */
function illegalInterceptRows(sk) {
  const out = [];
  const st = (CONFIG["转换逻辑"] || {})[sk || curStage] || {};
  const fields = st["输出字段"] || {};
  for (const f of Object.keys(fields)) {
    const rules = (fields[f] || {})["规则"] || [];
    rules.forEach((r, i) => {
      const t = (r["输出"] || {})["类型"];
      if (isInterceptOut(t)) out.push({ field: f, ri: i, type: t });
    });
  }
  return out;
}
/* 短路表出现拦截类动作时的顶部警示条（只警示，不动数据：搬去哪个检测环节由人工决定） */
function interceptBannerHTML(sk) {
  const rows = illegalInterceptRows(sk || curStage);
  if (!rows.length) return "";
  const byType = {};
  rows.forEach(r => { byType[r.type] = (byType[r.type] || 0) + 1; });
  const typeTxt = Object.keys(byType).map(t => `${t} ×${byType[t]}`).join("、");
  const allF = [...new Set(rows.map(r => r.field))];
  const shown = allF.slice(0, 8);
  const more = allF.length > shown.length ? ` 等 ${allF.length} 个字段` : "";
  return `<div class="act-banner" title="短路表 = 判断 + 映射，只产出值；检测拦截请单独放到检测环节去做">`
    + `<b>⚠ 本环节有 ${rows.length} 行规则用了拦截类动作（${escHtml(typeTxt)}）</b><br>`
    + `短路表<b>只负责「判断 + 映射」</b>（每条规则 = 条件判断 + 产出值），<b>不做检测拦截</b>；`

/* ============ UI 状态（环节/输出字段/静态表）持久化 ============
   ★设计标准：刷新保留现场（当前环节/输出字段/静态表/视图），配置变了自动回退默认；

function saveUiState() {

    localStorage.setItem(LS_UI_KEY, JSON.stringify({ stage: curStage, field: curField, static: curStatic, view: curView, doc: curDoc, navTab: curNavTab }));
  } catch (e) {}

}

function pushHistory() {
  // 记录当前编辑目标快照（修改前调用）：规则表或静态表
  if (curView === "static") {
    const st = (CONFIG["静态数据"] || {})[curStatic];
    UNDO_STACK.push({ kind: "static", table: curStatic, rows: JSON.parse(JSON.stringify(st ? st["行"] : [])) });
  } else {
    const stage = CONFIG["转换逻辑"][curStage];
    if (!stage) return;
    if (isFilterTableStage(curStage)) {
      // ★过滤表：规则挂环节对象、无「输出字段」键（既有缺陷修复：此前落入下方 fd 分支，
      //   undefined["输出字段"] 取键崩溃，过滤表下所有走撤销栈的编辑全部静默失败）
      UNDO_STACK.push({ kind: "rules", stage: curStage, field: "", rules: JSON.parse(JSON.stringify(stage["规则"] || [])) });
    } else if (isSingleRuleStage(curStage)) {
      // 检测表（环节级）模式：规则挂在环节对象上
      UNDO_STACK.push({ kind: "rules", stage: curStage, field: "", rules: JSON.parse(JSON.stringify(stage["规则"] || [])) });
    } else {
      const fd = stage["输出字段"][curField];
      UNDO_STACK.push({ kind: "rules", stage: curStage, field: curField, rules: JSON.parse(JSON.stringify(fd ? fd["规则"] : [])) });
    }
  }
  if (UNDO_STACK.length > 200) UNDO_STACK.shift();
  REDO_STACK = [];
}

/* 把当前编辑目标压入重做/撤销栈（用于跨 kind 恢复前的状态保存） */
function pushCurrentSnapshot(stack) {
  if (curView === "static") {
    const st = (CONFIG["静态数据"] || {})[curStatic];
    stack.push({ kind: "static", table: curStatic, rows: JSON.parse(JSON.stringify(st ? st["行"] : [])) });
  } else {
    const stage = CONFIG["转换逻辑"][curStage];
    if (!stage) return;
    if (isFilterTableStage(curStage) || isSingleRuleStage(curStage)) {
      // 过滤表 / 检测表（环节级）：规则挂环节对象（过滤表分支为既有缺陷修复，同 pushHistory）
      stack.push({ kind: "rules", stage: curStage, field: "", rules: JSON.parse(JSON.stringify(stage["规则"] || [])) });
    } else {
      const fd = stage && stage["输出字段"] && stage["输出字段"][curField];
      stack.push({ kind: "rules", stage: curStage, field: curField, rules: JSON.parse(JSON.stringify(fd ? fd["规则"] : [])) });
    }
  }
}

/* 整条「转换逻辑」改动（增删/重排环节、输出字段编辑等）：规则行没变，撤销栈里必须存整条链，否则 Ctrl+Z 看不出效果 */
function pushChainSnapshot(stack) {
  stack.push({ kind: "chain", logic: JSON.parse(JSON.stringify(CONFIG["转换逻辑"] || {})) });
  if (stack.length > 200) stack.shift();
  REDO_STACK = [];
}

/* 压入「与被撤销/重做快照同类型」的当前状态（跨类型混压会让重做只恢复一半） */
function pushSnapshotFor(stack, snap) {
  if (!snap) return;
  if (snap.kind === "chain") { pushChainSnapshot(stack); return; }
  pushCurrentSnapshot(stack);
}

/* 按快照恢复并渲染对应视图 */
function restoreSnapshot(snap) {
  curNavTab = navTabOfView(snap.kind === "static" ? "static" : "rules");   // 板块选项卡跟随恢复后的视图
  saveUiState();   // 撤销/重做也改变激活选项卡，同步持久化
  if (snap.kind === "static") {
    curView = "static"; curStatic = snap.table;
    CONFIG["静态数据"][snap.table]["行"] = JSON.parse(JSON.stringify(snap.rows));
    renderLeft(); renderStaticPanel();
  } else if (snap.kind === "chain") {
    curView = "rules";
    CONFIG["转换逻辑"] = JSON.parse(JSON.stringify(snap.logic));
    renderLeft(); renderPanel();
  } else {
    curView = "rules";
    curStage = snap.stage; curField = snap.field || "";
    const stage = CONFIG["转换逻辑"][snap.stage];
    if (isFilterTableStage(snap.stage) || isSingleRuleStage(snap.stage)) {
      // 过滤表 / 检测表（环节级）：规则挂环节对象（过滤表分支为既有缺陷修复，同 pushHistory）
      stage["规则"] = JSON.parse(JSON.stringify(snap.rules));
    } else if (stage["输出字段"] && stage["输出字段"][snap.field]) {
      stage["输出字段"][snap.field]["规则"] = JSON.parse(JSON.stringify(snap.rules));
    }
    renderLeft(); renderPanel();
  }
}

/* 顶栏「⋯」菜单：低频操作收进来，顶栏只留高频的（打开/保存/撤销/重做/日志/源） */
function toggleTopMenu(ev) {
  if (ev) { ev.stopPropagation(); }
  const el = document.getElementById("topMenuList");
  if (!el) return;
  el.style.display = el.style.display === "none" ? "block" : "none";
}
function closeTopMenu() {
  const el = document.getElementById("topMenuList");
  if (el) el.style.display = "none";
}
function runTopMenu(fn) {
  if (fn !== "cycleTheme") closeTopMenu();   // 主题循环保留菜单展开：便于连续切换并即时看到「主题：xx」文案变化
  if (EDIT_LOCK && (fn === "newConfig" || fn === "clearCache")) { roHint(); return; }   // 只读态：拦截破坏性菜单项
  const f = (typeof window[fn] === "function") ? window[fn] : null;
  if (f) f();
}
/* 点页面任意处收起菜单 */
document.addEventListener("click", function (e) {
  const box = document.querySelector(".tb-menu");
  if (box && !box.contains(e.target)) closeTopMenu();
});

function doUndo() {
  if (EDIT_LOCK) { roHint(); return; }   // 只读态：撤销会改动配置，拦
  if (!UNDO_STACK.length) { setAutoHint("没有可撤销的操作"); return; }
  pushSnapshotFor(REDO_STACK, UNDO_STACK[UNDO_STACK.length - 1]);
  const snap = UNDO_STACK.pop();
  restoreSnapshot(snap);
  log("撤销", snap.kind === "static" ? `静态表 ${snap.table}`
    : snap.kind === "chain" ? "整条转换逻辑" : `字段 ${snap.field || snap.stage}`);
  scheduleSave();
}

function doRedo() {
  if (EDIT_LOCK) { roHint(); return; }   // 只读态：重做会改动配置，拦
  if (!REDO_STACK.length) { setAutoHint("没有可重做的操作"); return; }
  pushSnapshotFor(UNDO_STACK, REDO_STACK[REDO_STACK.length - 1]);
  const snap = REDO_STACK.pop();
  restoreSnapshot(snap);
  log("重做", snap.kind === "static" ? `静态表 ${snap.table}`
    : snap.kind === "chain" ? "整条转换逻辑" : `字段 ${snap.field || snap.stage}`);
  scheduleSave();
}

/* ============ 编辑锁（用户 2026-11-07 定）============
   ★默认只读：顶栏「重新加载JSON」左侧按钮两态「🔒 编辑 / ✏️ 完成」（图标表示状态，用户 2026-11-11 定）。
   只读态只放行纯导航/查看（环节链、字段/文档/静态表选项卡、面板视图选项卡、查表箭头），
   其余一切会写 CONFIG 的交互一律拦截并提示：
   ○CSS 层：body.readonly 下 .panel/.left 内 input/textarea/select/button pointer-events:none
    （覆盖添加规则、模式单选器、各输入框、+增加文档/静态表、删除按钮等）；
   ○捕获层：click（带 onclick 且不在导航白名单）、dblclick（环节/文档/静态表改名、改标题）、
     dragstart（文档/静态表/列头拖动）、keydown（输入控件兜底）统一拦截；
   ○wysiwyg（提示词/SOP/特殊规则 MD 编辑器）contenteditable 置 false，面板每次渲染后同步（finishPanelRender）。 */
let EDIT_LOCK = true;
const _RO_NAV_SEL = ".sc-stage, .field-tab, .ptab-nav, .ft-nav, .topbar, .nav-tab";   // .nav-tab：侧边栏板块选项卡=导航动作，只读态放行（用户 2026-11-13 定）
function roHint() { setAutoHint("只读状态：点击顶栏「开始编辑」后才能修改"); }
function syncEditLockDom(root) {
  (root || document).querySelectorAll(".wysiwyg").forEach(el => el.setAttribute("contenteditable", EDIT_LOCK ? "false" : "true"));
  // 静态表单元格（用户 2026-11-10 定）：只读态可选中/可拷贝、不可改——非只读列 textarea 置原生 readOnly 兜底
  (root || document).querySelectorAll(".st-cell:not(.st-ro)").forEach(el => { el.readOnly = EDIT_LOCK; });
  // 键映射表目标键输入框（#66/#74）：只读态不可改（渲染期已烘焙，此处覆盖切锁不重渲的场景）。
  // 层列 2026-11-13 起整体只读（层只继承、无选择器），无需此处处理
  (root || document).querySelectorAll(".km-target").forEach(el => { el.readOnly = EDIT_LOCK; });
}
function applyEditLock() {
  document.body.classList.toggle("readonly", EDIT_LOCK);
  const b = document.getElementById("editLockBtn");
  if (b) {
    b.textContent = EDIT_LOCK ? "🔒 编辑" : "✏️ 完成";
    b.classList.toggle("editing", !EDIT_LOCK);
    b.title = EDIT_LOCK
      ? "当前只读：不能拖动、双击改名、删除或改动任何规则/静态数据/文档。点击进入编辑状态"
      : "当前可编辑。点击完成编辑，回到只读状态";
  }
  syncEditLockDom();
}
function toggleEditLock() {
  EDIT_LOCK = !EDIT_LOCK;
  applyEditLock();
  log("编辑锁", EDIT_LOCK ? "切换到只读状态" : "切换到编辑状态");
  setAutoHint(EDIT_LOCK ? "已回到只读状态" : "已进入编辑状态");
}
/* 捕获层拦截（只读态）：capture 保证先于元素内联 handler 执行 */
document.addEventListener("click", (e) => {
  if (!EDIT_LOCK) return;
  const t = (e.target instanceof Element) ? e.target : null;
  if (!t) return;
  const oc = t.closest("[onclick]");
  if (!oc) return;
  if (oc.closest(".ft-add")) { e.stopPropagation(); e.preventDefault(); roHint(); return; }   // ＋添加输出字段虽在 .ft-nav 内，但属变更操作，拦
  if (oc.closest(_RO_NAV_SEL)) return;   // 导航/查看放行
  e.stopPropagation(); e.preventDefault(); roHint();
}, true);
document.addEventListener("dblclick", (e) => {
  if (!EDIT_LOCK) return;
  const t = e.target;
  if (t && t.classList && t.classList.contains("st-cell")) return;   // 静态表单元格内双击=选词，放行（改名入口在列头，不受影响）
  e.stopPropagation(); e.preventDefault(); roHint();
}, true);
document.addEventListener("dragstart", (e) => {
  if (!EDIT_LOCK) return;
  e.preventDefault(); roHint();
}, true);
document.addEventListener("keydown", (e) => {
  if (!EDIT_LOCK) return;
  const t = e.target;
  if (t && t.classList && (t.classList.contains("search") || t.classList.contains("st-cell"))) return;   // 静态表搜索框 / 单元格放行（搜索=视图过滤；单元格=readOnly 挡输入，放行 Cmd+C 拷贝）
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) {
    e.preventDefault(); e.stopPropagation();   // Tab 聚焦兜底：只读态输入控件不接受键入
  }
}, true);

function log(op, detail) {
  OP_LOG.push({ t: new Date().toLocaleTimeString("zh-CN", { hour12: false }), op, detail });
  if (OP_LOG.length > 500) OP_LOG.shift();
}

function showLog() {
  const body = document.getElementById("logBody");
  if (!OP_LOG.length) {
    body.innerHTML = '<div class="empty">暂无操作记录</div>';
  } else {
    body.innerHTML = OP_LOG.slice().reverse().map(l =>
      `<div style="padding:4px 6px; border-bottom:0.5px solid var(--border-tertiary); font-size:12px;">
        <span style="color:var(--text-tertiary); font-family:monospace;">${escHtml(l.t)}</span>
        <span style="color:var(--accent); margin:0 6px; font-weight:500;">${escHtml(l.op)}</span>
        <span style="color:var(--text-secondary);">${escHtml(l.detail)}</span>
      </div>`).join("");
  }
  document.getElementById("logMask").classList.add("show");
}
function closeLog() { document.getElementById("logMask").classList.remove("show"); }
function clearLog() { OP_LOG = []; showLog(); }

/* ════════════════════════════════════════════════════════════════════════
   ═══ 2. 配置模型层（纯读写） ═══  环节/字段/模式判定 · 表名解析 · 模式存档 · 输入条件字段白名单 · 静态表列判定
   ════════════════════════════════════════════════════════════════════════ */

/* 环节序号（用于排序）：阶段0_开始→0、环节N→N、阶段99_结束→99；其余→50（中性） */
function stageNum(k) {
  const s = String(k);
  if (START_KEYS.includes(s)) return 0;
  if (END_KEYS.includes(s)) return 99;
  const m = s.match(/环节(\d+)/);
  return m ? parseInt(m[1], 10) : 50;
}

/* ★设计标准：环节链顺序 = 开始 → 环节1..N（按数值）→ 结束；JSON 里边界 key 放首尾不影响数据语义 */
function stageKeys() {
  const all = Object.keys((CONFIG && CONFIG["转换逻辑"]) || {});
  const start = all.find(k => START_KEYS.includes(k));
  const end = all.find(k => END_KEYS.includes(k));
  const mids = all.filter(k => !START_KEYS.includes(k) && !END_KEYS.includes(k))
                  .sort((a, b) => stageNum(a) - stageNum(b));
  return [...(start ? [start] : []), ...mids, ...(end ? [end] : [])];
}

/* 首个「数据环节」（环节N），用于确定输入字段来源；边界节点不属于数据层 */
function firstDataStageKey() {
  const ks = stageKeys();
  const fd = ks.find(k => !isBoundaryKey(k));
  return fd || ks[0] || "";
}

/* ★设计标准：环节结构约定——环节 key = "环节N"（序号）；环节对象不再含「起点 / 终点」数据层标签
   （2026-11-05 用户定，已废弃：这两个键没有任何消费方，Editor 不再渲染 / 编辑 / 写入）。
   环节之间的数据衔接由「上一环节输出字段 = 下一环节输入字段」表达（见 README #2003「同一集合」）。
   stageMeta 只提供环节序号；存量 JSON 里若仍带有这两个键，原样保留、忽略，不主动删除。 */
function stageMeta(k) {
  const num = (String(k).match(/环节(\d+)/) || [null, ""])[1] || "";
  return { num };
}

/* ★设计标准：提示词环节——环节「模式」= 提示词，或（无输出字段且无规则、无边界）默认提示词。
   编辑器仅呈现可编辑 markdown 提示词（同「文档集合里各文档」/特殊规则渲染机制），不显示规则表。
   提示词是「驱动生成脚本的权威规格」（如 开始=取数、结束=落库），编辑写回 特殊规则 字段，立即生效。 */
function isPromptStage(stageKey) {
  const st = (CONFIG["转换逻辑"] || {})[stageKey];
  if (!st) return false;
  if (st["模式"] === "提示词") return true;
  if (st["模式"] === "键映射" || st["模式"] === "Key映射") return false;   // #66/#74：键映射表同样「无输出字段无规则」，但不是提示词（显式模式优先于形态推断；旧值 Key映射 兼容）
  const outs = st["输出字段"] || {};
  return Object.keys(outs).length === 0 && !Array.isArray(st["规则"]) && !isBoundaryKey(stageKey);
}

/* ★设计标准：环节级规则形态判定——某环节「输出字段」为空 且 模式=检测表 时，
   规则挂环节对象（而非某输出字段），撤销/重做/curField 均按环节级处理。
   （历史上曾含「短路表空输出字段亦走单规则表」分支，因业务不存在该形态已移除；
    短路表一律按输出字段分选项卡处理，故此处只保留检测表的环节级判定。） */
function isSingleRuleStage(stageKey) {
  const st = (CONFIG["转换逻辑"] || {})[stageKey];
  if (!st) return false;
  const outs = st["输出字段"] || {};
  // ★有输出字段 = 短路表（字段各自规则），一律按字段分表处理，不再走单规则表分支。
  if (Object.keys(outs).length > 0) return false;
  // 检测表：输出字段为空时规则挂在环节对象（环节级），撤销/重做/curField 按环节级处理。
  if (st["模式"] === "检测表") return true;
  return false;
}

/* ★设计标准：一个环节里同时存在「字段映射表」（输出字段）与「检测规则表」（环节级规则）时，
   检测规则以虚拟选项卡 `__detect__` 呈现——不占「输出字段」定义、不写进 JSON。
   为什么必须这么做：三层版把映射与检测合并进同一环节，若按 模式=检测表 直接整屏渲染检测表，
   用户点任何字段看到的都是检测表，24 个字段的映射规则永远改不了（2026-10-21 实测踩到）。 */

function stageHasDetectTab(sk) {
  const st = CONFIG["转换逻辑"][sk] || {};
  return stageModeKey(sk) === "检测表"
    && Object.keys(st["输出字段"] || {}).length > 0
    && (st["规则"] || []).length > 0;
}

/* ★设计标准：环节有五种「模式」——短路表 / 过滤表 / 检测表 / 提示词 / 键映射表（内部值「键映射」）：
   短路表 = 引擎通用执行（输出字段+规则/展开/过滤）；
   过滤表 = 字段透传、多行规则 OR、行内条件 AND、命中即弃行；JSON 里只写「规则」、不维护任何字段键
     （透传无增删改 → 下游向上找，用户 2026-11-12 定）；条件单元两种形态：\n\
     存在性 {字段,表,列,模式}（行值 ∈ 表某列）／值比较 {字段,算子,值}（如 日期小于等于）；
   检测表 = 字段透传、规则挂环节级、命中仅记录（报异常+说明，不弃行、可多行命中）；
     条件单元**与过滤表同构**（两种形态都支持）——存在性形态用于「行值 ∈ 某外部快照表列」类判定
     （如查重报警：源单号 被 备注指纹表.备注 包含）；
   提示词 = 纯规格（驱动生成脚本，如 开始=取数、结束=落库），仅渲染 markdown、可编辑；
   键映射表 = 值全透传、只改输出键名（#66 定、#74 更名、#2013 分层，用户 2026-11-11/12 定）：独占键「键映射」
     = {单据头:{字段名:目标键名}, 明细行:{…}}——两层桶（V7 起），桶内**只存改名项**，没改名的不写；
     层 = 这次改名落在报文哪一层（同一个键可同时是两层槽位，如 department_id）。明细行 = 上一环节输出字段，无添加/删除行逻辑。
     引擎数据面零改动（无 输出字段/规则 → 整行透传）；目标键名的消费方（如制单报文组装）按
     「键映射[层][字段] || 上游 api_key_name || 字段名」解析——实例引擎/脚本对接见 README「键映射表模式」节。
   缺省模式由形态推断：有输出字段或挂「规则」数组 → 短路表；否则 → 提示词（无规则、无输出字段的声明型环节）。
   键映射表 只认显式声明（模式="键映射"，旧值 "Key映射" 加载时迁移），不做形态推断（与短路表数据面无异，推断不出）。 */
function stageModeKey(sk) {
  const st = (CONFIG["转换逻辑"] || {})[sk];
  if (!st) return "规则";
  if (st["模式"] === "Key映射") return "键映射";               // #74 旧值兼容：加载迁移兜底（未走 setConfig 的路径也能识别）
  if (st["模式"] === "键映射表") return "键映射";              // 界面同名词兼容（2026-11-13 更名，与「短路表」同名词先例一致）
  if (MODE_KEYS.indexOf(st["模式"]) >= 0) return st["模式"];   // 只认五种合法模式，脏值走形态推断
  if (st["输出字段"] && Object.keys(st["输出字段"]).length) return "规则";
  if (Array.isArray(st["规则"])) return "规则";
  return "提示词";
}
/* 过滤表模式：字段透传、仅按规则数组弃行（多行 OR、行内条件 AND、命中即弃行）。无输出字段。 */
function isFilterTableStage(sk) {
  return stageModeKey(sk) === "过滤表";
}
/* 键映射表模式（#66 定、#74 更名，用户 2026-11-11 定）：值全透传、只改输出键名；明细行 = 上一环节输出字段。 */
function isKeyMapStage(sk) {
  return stageModeKey(sk) === "键映射";
}
/* 环节模式「展示名」：内部键「规则」对用户就叫「短路表」（与模式切换条上的按钮文案一致）。
   左导航每个环节块右侧挂一枚小标签，一眼能看出这条链是 过滤表/短路表/检测表/提示词（2026-10-21 用户数次按编号问
   「XX 环节是什么表」—— 只显示序号看不出形态，故补此标签）。 */
function stageModeLabel(sk) { return modeLabel(stageModeKey(sk)); }
/* 模式内部键 → 展示名（内部键「规则」对用户就叫「短路表」、内部值「键映射」对用户就叫「键映射表」，
   2026-11-13 用户定；只为五种模式产出文案。JSON 内部值与独占键仍为「键映射」不变，零结构变化） */
function modeLabel(m) { return m === "规则" ? "短路表" : (m === "键映射" ? "键映射表" : (m || "短路表")); }

function stageFieldList(stageKey) {
  const st = CONFIG["转换逻辑"][stageKey] || {};
  // ★键映射表：无「输出字段」，对外字段清单 = 透传（本环节输入 = 上一环节输出），下游推导无缝衔接
  if (isKeyMapStage(stageKey)) return stageInputFields(stageKey);
  // ★过滤表（用户 2026-11-12 定）：JSON 里只写「规则」，不维护任何字段键——透传环节对外字段清单 =
  //   「向上找」：跳过本环节、直接取上一环节的对外字段清单（上一环节若也是透传型则继续向上递归）。
  //   语义：某模式在传递字段时完全没有增删改，该模式就不单独维护输入/输出字段。
  if ((st["模式"] || "") === "过滤表") {
    const ks = stageKeys();
    const i = ks.indexOf(stageKey);
    return i > 0 ? stageFieldList(ks[i - 1]) : [];
  }
  // ★检测表纯形态（用户 2026-11-12 定）：无「输出字段」、规则挂环节级、命中仅记录不改数据 → 整行透传，
  //   对外字段清单 = 本环节输入（与过滤表同语义）。此前缺此回退，纯形态检测表返回空数组，
  //   下游（如键映射表环节）输入字段被推导为 0、键映射表面板一行没有（2026-11-12 实测踩到）。
  //   注意：混合形态（有「输出字段」+「规则」，走 __detect__ 虚拟选项卡）不在此列——下游取其声明输出。
  if ((st["模式"] || "") === "检测表" && Object.keys(st["输出字段"] || {}).length === 0) {
    return stageInputFields(stageKey);
  }
  return Object.keys(st["输出字段"] || {});
}

function stageInputFields(stageKey) {
  /* ★铁律（#71，用户 2026-11-11 定）：输入字段来源于上一环节「输出字段」——完全相等（含顺序）；
     上游没有「输出字段」定义 → 输入字段为空（同步为没有，没有例外）。
     不读环节对象里遗留的「输入字段」存储键（闲置数据，实例侧登记清理）；引擎本就不读该键（只读全量上下文）。
     两个非「输入字段」语义的例外：①过滤表环节自身无输入/输出之分，条件列 = 数据层全集；
     ②上一环节是过滤表/键映射表/纯形态检测表等透传型环节时，其对外字段清单 = 向上找（见 stageFieldList），下游输入照常衔接不为空。 */
  const st = CONFIG["转换逻辑"][stageKey] || {};
  if (st["模式"] === "过滤表") return Array.from(stageLayerFields(stageKey));
  const keys = stageKeys();
  const idx = keys.indexOf(stageKey);
  if (idx <= 0) return [];                     // 链首无上游 → 空
  return stageFieldList(keys[idx - 1]);        // 上一环节（含开始边界提示词环节）的输出字段，空即空
}

/* ★设计标准：数据层字段集（= 引擎运行时 ctx 的 keys）——首环节「输入字段」（源文件列）逐环节累积：
   每经过一个环节 = 原字段 ∪ 该环节「输出字段」keys ∪ 展开标记列（展开只拆行、仅新增标记列）。
   「输出字段」声明的是本环节参与计算的字段，不是数据层全量清单——未声明的字段引擎整行透传、不改值。
   （曾因此被误解：环节3 过滤只声明 4 个字段，被以为「源系统标准数据」丢了字段，实际其余 14 个全部透传） */
function stageLayerFields(stageKey) {
  const keys = stageKeys();
  const idx = keys.indexOf(stageKey);
  const set = new Set();
  if (idx < 0) return set;
  // 数据层种子 = 首数据环节的推导输入（#71 铁律 = 其上一环节「输出字段」，含开始边界；链首无上游则为空）——不读遗留「输入字段」存储键
  const fd = firstDataStageKey();
  const ks = stageKeys();
  const fdIdx = ks.indexOf(fd);
  (fdIdx > 0 ? stageFieldList(ks[fdIdx - 1]) : []).forEach(f => set.add(f));
  for (let i = 0; i < idx; i++) {
    const st = (CONFIG["转换逻辑"] || {})[keys[i]] || {};
    if (isBoundaryKey(keys[i])) continue; // 边界节点不贡献数据层字段
    const mark = ((st["展开"] || {})["标记列"]) || "";
    if (mark) set.add(mark);
    // 「展开」带入的列（随行从表里带进来的，如 段金额_raw）
    const bring = (st["展开"] || {})["带入"] || {};
    Object.values(bring["列"] || {}).forEach(f => { if (f) set.add(f); });
    // 「缩放」的输出列（如 段金额_缩放）
    const sc = st["缩放"] || {};
    if (sc["输出列"]) set.add(sc["输出列"]);
    Object.keys(st["输出字段"] || {}).forEach(f => set.add(f));
  }
  return set;
}

/* ★表格可选列 = 环节输入字段 ∪ 本环节规则里被条件引用的字段。
   为什么要并集：合并式环节（三层版一张大表）的检测规则经常拿「同表先算出来的中间字段」当条件
   （如 公司ID / 对象ID），它们不在「输入字段」里；只按输入字段算列，这些条件会变成不可见也点不到。 */
function stageTableFields(stageKey) {
  const st = CONFIG["转换逻辑"][stageKey] || {};
  const base = stageInputFields(stageKey);
  const seen = new Set(base);
  const extras = [];
  (st["规则"] || []).forEach(r => (r["条件"] || []).forEach(c => {
    const f = c["字段"];
    if (f && !seen.has(f)) { seen.add(f); extras.push(f); }
  }));
  return base.concat(extras);
}

/* 字段级表格可选列 = 环节输入字段 ∪ 本字段规则里被条件引用的字段。
   短路表天然会拿「同环节前面刚算出来的字段」当条件（如 bill_type 的条件是 object_type），
   这些不在输入字段里 —— 不并进来，条件就既看不见也点不到。 */
function fieldTableFields(stageKey, field) {
  const fd = ((CONFIG["转换逻辑"][stageKey] || {})["输出字段"] || {})[field] || {};
  const base = stageInputFields(stageKey);
  const seen = new Set(base);
  const extras = [];
  (fd["规则"] || []).forEach(r => (r["条件"] || []).forEach(c => {
    const f = c["字段"];
    if (f && !seen.has(f)) { seen.add(f); extras.push(f); }
  }));
  return base.concat(extras);
}

/* 是否为「透传字段」：在输入条件字段、但非本环节输出字段（仅作 getFd 稳健性保护用） */
function isPassthroughField(stageKey, f) {
  const st = CONFIG["转换逻辑"][stageKey] || {};
  const out = st["输出字段"] || {};
  const cond = stageInputFields(stageKey);   // #71 铁律：输入字段为推导值，不读存储键
  return cond.includes(f) && !(f in out);
}

/* 字段中文说明：查任意环节「输出字段」里的「说明」（如环节5 继承环节4 的目标系统字段 → 销售组织/供应组织…） */
function fieldDesc(f) {
  const logic = (CONFIG && CONFIG["转换逻辑"]) || {};
  for (const sk of Object.keys(logic)) {
    const fd = (logic[sk]["输出字段"] || {})[f];
    if (fd && fd["说明"]) return fd["说明"];
  }
  return "";
}

/* ★设计标准：字段在勾选菜单（显示输入条件字段等）中的标签 = 「层 · 中文:英文」——
   目标系统等英文键直接裸显无法辨认，必须带中文；中文键（源系统列/中间量）本身可读，原样显示不加冒号。
   前置「层」（单据头/明细行，用户 2026-11-12 定）：让用户一眼看出这个键属于报文哪一层。
   中文取 fieldDesc（上游输出字段的「说明」），取不到再退配置的「字段中文名」区 / 原键。 */
function fieldMenuLabel(f) {
  const cn = fieldDesc(f) || fieldDisplay(f);
  const base = /[\u4e00-\u9fa5]/.test(f) ? f : ((cn && cn !== f) ? `${cn}:${f}` : f);
  return `${fieldLayer(f)} · ${base}`;
}

/* ============ 表名解析：内嵌表 ∪ 外部表（只有声明，行数据在外部文件） ============
   规则里只认表名，两类表对规则完全同构；外部表只有「来源 + 键 + 表头」，行数据在外部文件。
   ★外部表不分「静态区 / 运行时区」：静态区里带「来源」的（如 ext_hesi_mdm 全量映射）同样是外部表
     —— 区分依据是「本地有没有这份数据的源文件」，不是它是不是映射关系。 */
function isExternalTable(t) { return !!(t && t["来源"] && !(t["行"] || []).length); }
function externalTables() {
  const m = Object.assign({}, (CONFIG["运行时数据"] || {})["表"] || {});
  Object.keys(CONFIG["静态数据"] || {}).forEach(n => {
    if (isExternalTable(CONFIG["静态数据"][n])) m[n] = CONFIG["静态数据"][n];
  });
  return m;
}
function runtimeTables() { return externalTables(); }   // 兼容旧调用点
function allTableNames() {
  const a = Object.keys(CONFIG["静态数据"] || {});
  const b = Object.keys(externalTables());
  return a.concat(b.filter(x => a.indexOf(x) < 0));
}
/* ★设计标准（2026-10-21）：映射只认静态表 —— 短路表（有「输出字段」的环节）不得引用运行时外部表。
   理由：外部表是「库表/运行态快照」，用它兜底会让同一份配置在本机/他人机器上结果不同，也看不出缺哪条映射。
   正确闭环：静态表缺数据 → 规则报异常 → 事后按外部数据补静态表 → 重跑。
   ⛔ 编辑器不得越过静态数据向外部表找映射关系：短路表内查表的下拉只列静态表。
   检测表/过滤表不受限（查重、跨主体校验等状态判断不是映射关系）。 */
function isMappingStage(k) {
  const st = (CONFIG["转换逻辑"] || {})[k || curStage] || {};
  return Object.keys(st["输出字段"] || {}).length > 0;
}
function inMappingField() {
  return curView === "rules" && isMappingStage(curStage) && !!curField && curField !== "__detect__";
}
function lookupTableNames() {
  if (!inMappingField()) return allTableNames();
  return Object.keys(CONFIG["静态数据"] || {}).filter(n => !isExternalTable(CONFIG["静态数据"][n]));
}
/* 外部表被误引用时的警示标签（短路表里出现即为违规） */
function extWarnTag(name) {
  if (!name || !inMappingField()) return "";
  return isExternalTable(anyTable(name))
    ? `<span class="ext-warn" title="★违规：短路表（映射环节）不得引用运行时外部表。静态表缺数据应报异常，再按外部数据补静态表">外部表·禁止</span>`
    : "";
}
function anyTable(name) {
  const s = (CONFIG["静态数据"] || {})[name];
  if (s) return s;
  return externalTables()[name] || null;
}

/* 可选静态表名列表（从 CONFIG.静态数据 取顶层 key） */
function filterTableNames() {
  return allTableNames();
}
/* 某静态表的列名（表头） */
function filterTableCols(tblName) {
  const t = anyTable(tblName);
  return t ? (t["表头"] || []) : [];
}

/* ============ 环节模式存档 ============
   ★设计标准（用户 2026-10-21 定）：切模式【不许丢数据】。
     一个环节同时保留五种模式各自的参数，「模式」字段只是「当前选中哪个」的指针：

       环节X: {
         "模式": "过滤表",            ← 当前生效的模式（指针）
         "规则": [ … ],              ← 当前模式正在用的参数（引擎只读这些规范键）
         "模式存档": {               ← 其它模式各自的参数，全部留着，切回来原样恢复
            "规则":   { "输出字段": { … 25 个字段 … } },
            "检测表": { "规则": [ … ], "输出字段": { 透传骨架 } }
         }
       }

     切走 = 把当前模式的独占参数收进存档；切回 = 从存档取回。
     引擎只认 模式 / 输出字段 / 规则 等规范键，不读 模式存档 → 存档是纯编辑器侧数据，不影响跑批。

   ○实现细节：每个模式「独占」哪些键（不独占的键如 特殊规则 / 输入字段 是全体共享，切换不动）：
     短路表(规则) → 输出字段（字段级规则）
     过滤表       → 规则（弃行规则数组）
     检测表       → 规则（检测规则数组）+ 输出字段（透传骨架）
     提示词       → 无独占（正文就放在共享的 特殊规则 里，故切到提示词/从提示词切走都零损耗）
     键映射表    → 键映射（改名表 {字段名:目标键名}，只记改名项；#66 定 #74 更名，用户 2026-11-11 定） */

function modeArchive(st) {
  if (!st["模式存档"] || typeof st["模式存档"] !== "object") st["模式存档"] = {};
  return st["模式存档"];
}
function deepCopy(v) { return JSON.parse(JSON.stringify(v)); }

/* 切模式的「数据搬运」：存档 from、取回 to。返回 {saved:[存档的键], restored:[取回的键]} 供日志/提示使用 */
function applyStageMode(sk, mode) {
  const st = CONFIG["转换逻辑"][sk] || {};
  const from = stageModeKey(sk);
  const arc = modeArchive(st);
  const saved = [], restored = [];
  if (from !== mode) {
    // ① 当前模式的独占参数 → 存档
    const slot = {};
    (MODE_OWN[from] || []).forEach(k => {
      if (st[k] !== undefined) { slot[k] = deepCopy(st[k]); saved.push(k); }
    });
    if (saved.length) arc[from] = slot;
    // ② 目标模式的独占参数：有存档就取回，没有就给该模式的空壳（绝不透传上一模式的数据）
    (MODE_OWN[mode] || []).forEach(k => {
      const v = (arc[mode] || {})[k];
      if (v !== undefined) { st[k] = deepCopy(v); restored.push(k); }
      else if (k === "规则") st[k] = [];
      else if (k === "键映射") st[k] = kmEmptyBuckets();   // 两桶空壳 = 全部沿用上游键、无改名项（#66/#74/#2013）
      else if (k === "输出字段") {
        // 检测表的输出字段 = 透传骨架（每字段一条空条件规则，原样取值，检测不动数据）
        const ins0 = stageInputFields(sk);   // #71 铁律：输入字段恒为推导值
        st[k] = (mode === "检测表") ? buildPassthruFields(ins0) : {};
      }
    });
    // ③ 清理：上一模式独占、但目标模式不认的键（如 检测表→过滤表 要去掉透传骨架）
    (MODE_OWN[from] || []).forEach(k => {
      if (!(MODE_OWN[mode] || []).includes(k)) delete st[k];
    });
  }
  st["模式"] = mode;
  // ④ 提示词模式：正文放共享的 特殊规则；尚无内容时给一句通用占位（不写死任何项目名）
  if (mode === "提示词" && !(st["特殊规则"] && String(st["特殊规则"]).trim())) {
    st["特殊规则"] = isStartKey(sk) ? "# 开始（提示词规格）\n\n> 描述本环节之前的取数/导出动作，由本提示词驱动的脚本执行。"
      : isEndKey(sk) ? "# 结束（提示词规格）\n\n> 描述本环节之后的落库动作，由本提示词驱动的脚本执行。"
        : "# 提示词环节\n\n> 本环节以提示词描述逻辑，不生成规则表。";
  }
  CONFIG["转换逻辑"][sk] = st;
  return { from, saved, restored };
}

/* 透传字段骨架：每字段一条空条件规则（全通配命中），输出=变量取本字段原值（检测不动数据） */
function buildPassthruFields(fieldList) {
  const pas = {};
  (fieldList || []).forEach(f => {
    pas[f] = { "规则": [{ "条件": [], "输出": { "类型": "变量", "字段": f } }], "隐藏": true };
  });
  return pas;
}

/* ★设计标准：输入条件字段（规则表中横向多列）可手动勾选「会用到哪些」——
   每个输出字段单独维护一份「显示输入条件字段」白名单，存于 输出字段[field]["显示输入条件字段"]（数组）。
   ★默认收敛（2026-10-21 用户要求）：不写该键 = **只显示该字段的规则里真带条件的字段**（自动模式）；
   写成显式数组 = 手工指定（含「全选」= 全部列都显示）。
   隐藏只是「视图收敛」，条件数据仍完整留在 JSON 中、不参与/不丢。 */
function condFieldsKey(stageKey, field) {
  const fd = (CONFIG["转换逻辑"][stageKey] || {})["输出字段"] || {};
  return (fd[field] || {})["显示输入条件字段"] || null;
}
function filterCondFields(stageKey, field, allFields) {
  const white = condFieldsKey(stageKey, field);
  if (white) { const set = new Set(white); return allFields.filter(f => set.has(f)); }
  const fd = ((CONFIG["转换逻辑"][stageKey] || {})["输出字段"] || {})[field] || {};
  return autoCondFields(fd["规则"] || [], allFields);   // 默认：只显示有条件的字段
}
function condFieldBadge(stageKey, field) {
  return '';   // 徽标已移除（2026-11-01 用户要求：去掉虚线框包着的数字）
}

/* 过滤表「显示输入条件字段」——环节级白名单（过滤表不分输出字段，故白名单挂在环节对象）。
   ★默认收敛（2026-10-21 用户要求）：不写该键 = **只显示「真带条件」的字段**（自动模式），全通配列不再默认铺满。
     要显示某个当前没条件的字段 → 在「显示输入条件字段」里勾上它，即写成显式白名单（键 = 手工指定的列集）。
   写成空集 = 该环节一列条件都不显示。
   隐藏只是「视图收敛」，已存在的条件单元数据仍保留在 JSON 中、不丢。 */
function filterFieldsKey(stageKey) {
  const st = CONFIG["转换逻辑"][stageKey] || {};
  return st["显示输入条件字段"] || null;
}
/* ★自动收敛集：当前规则里真被条件引用到的字段（保持原列顺序）。
   空集照实返回——"本表所有行都是无条件通配"本身就是要表达的事实，不塞回全量。 */
function autoCondFields(rules, allFields) {
  const used = new Set();
  (rules || []).forEach(r => (r["条件"] || []).forEach(c => { if (c["字段"]) used.add(c["字段"]); }));
  return allFields.filter(f => used.has(f));
}
function filterFields(stageKey, allFields) {
  const white = filterFieldsKey(stageKey);
  if (white) { const set = new Set(white); return allFields.filter(f => set.has(f)); }
  const st = CONFIG["转换逻辑"][stageKey] || {};
  return autoCondFields(st["规则"] || [], allFields);   // 默认：只显示有条件的字段
}
function filterFieldsBadge(stageKey) {
  return '';   // 徽标已移除（2026-11-01 用户要求：去掉虚线框包着的数字）
}

/* ============ 规则增删改 ============ */
function getFd() {
  const stage = CONFIG["转换逻辑"][curStage];
  // 环节级规则形态（检测表）：环节对象即规则容器（规则挂在「规则」数组）
  if (isSingleRuleStage(curStage)) return stage;
  if (isPassthroughField(curStage, curField)) return {};  // 透传字段：无规则表，返回空容器保护
  return stage["输出字段"][curField];
}

/* 过滤表规则数组通用入口（curStage 当前环节即过滤表） */
function getFilterRules() {
  const st = CONFIG["转换逻辑"][curStage] || {};
  if (!Array.isArray(st["规则"])) st["规则"] = [];
  return st["规则"];
}

/* 统一判空：null/undefined/false/空串 都视为空（兼容 xlsx 转 JSON 时的 False 占位） */
function isEmptyCell(v) { return v === null || v === undefined || v === false || String(v).trim() === ""; }

/* 纯数字单元格（用户 2026-11-05）：渲染时居右对齐。判定 = 数字类型，或去空格后完全匹配
   「可选正负号 + 整数/小数」；带千分位、单位、字母编号的不算；空值不算。 */
function isNumericCell(v) {
  if (isEmptyCell(v)) return false;
  if (typeof v === "number") return true;
  return /^[+-]?(\d+(\.\d+)?|\.\d+)$/.test(String(v).trim());
}

/* 只读列（用户 2026-11-05 定）：只认 JSON 表定义里显式声明的「只读列」（列名→索引）。
   ★不再按列名自动识别「名称列」——列角色一律以 JSON 为准；未声明「只读列」的表全部列可编辑。 */
function getReadonlyCols(st, header) {
  if (!st || !Array.isArray(st["只读列"]) || !st["只读列"].length) return [];
  return st["只读列"].map(cn => header.indexOf(cn)).filter(i => i >= 0);
}

/* 编码列探测：为 JSON 声明的只读列找配对编码列（按表头后缀），仅用于「名称空/编码有值」的橙色待补视觉标识。
   ★不参与列角色判定、不构成列格式约束；无「只读列」声明时不会命中任何列。 */
function detectCodeCols(header, nameCols) {
  const map = {};
  nameCols.forEach(ni => {
    const base = String(header[ni]).replace(/名称$/, "");
    let best = null;
    header.forEach((c, i) => {
      if (i === ni || best != null) return;
      const s = String(c);
      if (s === base + "代码" || s === base + "编码" || s === base + "编号" ||
          (base && s.startsWith(base) && (s.includes("代码") || s.includes("编码")))) best = i;
    });
    map[ni] = best;
  });
  return map;
}

/* 组织名称：优先内部「组织编码名称对照表」（不依赖 API）——原服务「补全名称」工具，工具下线后保留备用 */
function orgNameFromStatic(code) {
  const t = CONFIG["静态数据"] && (CONFIG["静态数据"]["组织编码名称对照表"] || CONFIG["静态数据"]["静态_财务_组织编码名称对照表"]);  // 新键优先，旧前缀键兜底
  if (!t) return null;
  const h = t["表头"] || [];
  const ci = h.findIndex(c => String(c).includes("编码"));
  let ni = h.findIndex(c => String(c).includes("名称"));
  if (ni < 0 && ci >= 0) ni = h.findIndex((c, i) => i !== ci);  // 表头无「名称」列（本表为「业务组织」）→ 取非编码列兜底
  if (ci < 0 || ni < 0) return null;
  for (const row of t["行"] || []) {
    if (String(row[ci] ?? "").trim() === String(code).trim()) return row[ni];
  }
  return null;
}

/* 名称列来源类型 → 内部判定（仅用于提示/组织特殊处理，不再调外部 API） */
function colTypeOf(header, ni) {
  const s = String(header[ni] || "");
  if (s.includes("客户")) return "客户";
  if (s.includes("商品") || s.includes("物料")) return "商品";
  if (s.includes("部门")) return "部门";
  if (s.includes("业务员")) return "业务员";
  if (s.includes("组织")) return "组织";
  return "";
}

/* ════════════════════════════════════════════════════════════════════════
   ═══ 3. 渲染层 ═══  转义/值控件 · markdown · 左导航 · 环节各形态面板 · 规则表/过滤表 · 静态表面板 · 浮层
   ════════════════════════════════════════════════════════════════════════ */

/* ============ 工具 ============ */
function escHtml(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s) { return escHtml(s).replace(/"/g,"&quot;"); }

/* 值输入框：短值用单行 input；长值（>20 字符）自动改用 textarea，保证完整展示 */
function valFieldHTML(value, placeholder, onchange, cls) {
  // ★设计标准：多行文本自动增高——长文本用 textarea、按内容自适应高度（完整展示不截断）；
  //   普通值超约 20 字符自动转 textarea，短值保持单行 input（界面不臃肿）
  const long = String(value ?? "").length > 20;

/* MD 编辑器行号（#26）：左侧 gutter 块对齐显示源码行号——每个渲染块（含空行块）的行号绝对定位
   在块顶内容偏移上，编号 = 该块首行的源码行号；随编辑/滚动实时重算（2026-11-12 用户报障改造：
   旧版按逻辑行等距排且 scrollTop 抄写，行号不对应、行数少时根本不滚）。
   富文本长行软换行时一个块只显示一个起始行号，属所见即所得编辑器的通用取舍。 */
function updateLineNumbers(idPrefix) {
  const wy = document.getElementById(idPrefix + "_wy");
  const gutter = document.getElementById(idPrefix + "_ln");
  const raw = document.getElementById(idPrefix + "_ta_raw");
  if (!wy || !gutter || !raw) return;
  if (!wy._lnBound) {
    wy._lnBound = true;
    wy.addEventListener("scroll", () => { gutter.scrollTop = wy.scrollTop; });

/* 提示词编辑器块对齐行号取值：源码块起始行号来自 mdRenderBlocks(raw)（块级 raw 恒等式保证
   逐块行数累加 = 源码行），DOM 块按序与源码块配对；htmlToMd 的 \n{3,} 压缩会把多个空行块
   合并（罕见），此时多出的 DOM 空块行号沿用前一块，偏差 ≤1-2 行。 */
function wysiwygLnItems(wy, src) {
  const starts = [];
  let ln = 1;
  for (const b of mdRenderBlocks(src)) { starts.push(ln); ln += (b.raw === "" ? 1 : b.raw.split("\n").length); }
  const items = [];
  let si = 0, last = 1;
  const wtop = wy.getBoundingClientRect().top, wst = wy.scrollTop;
  wy.childNodes.forEach(el => {
    if (el.nodeType !== 1) return;
    const md = el.getAttribute ? (el.getAttribute("data-md") || "") : "";

    if (!(el.textContent || "").trim() && md !== "space" && el.tagName !== "HR") return;
    const y = el.getBoundingClientRect().top - wtop + wst;
    const n = si < starts.length ? starts[si++] : last;
    last = n;
    items.push({ y, n });

/* 行号栏统一渲染（两编辑器共用）：内层绝对定位层高度=编辑区 scrollHeight → gutter 与编辑区

    //   但文字居中保留（用户 2026-11-13 定）：居中即与正式环节（左对齐+说明+模式标签）一眼区分，又不抢选中态语义。
    const cls = ["sc-stage", isBoundary ? "sc-bd" : "", sk === curStage && curView === 'rules' ? "sc-on" : ""].filter(Boolean).join(" ");
    const dbl = isBoundary ? "" : `ondblclick="editStage('${escAttr(sk)}')" `;
    h += `<div class="${cls}" onclick="selectStage('${escAttr(sk)}')" ${dbl}`
       + `title="${escAttr(sk)}">`
       + `<span class="sc-label">${escHtml(label)}</span>${descLabel}`
       + (isBoundary ? "" : `<span class="sc-slot"><span class="sc-tag" title="该环节的模式（点开后可在顶部切换）">${escHtml(stageModeLabel(sk))}</span></span>`)
       + `</div>`;
    // ★连接行零高度、不占位；按钮由 CSS 在悬停相邻环节块时浮现，显示时跨压上下两个块各一半。
    //   数据层节点名不再显示（编辑入口在面板标题行）。
    if (i < keys.length - 1) {
      h += `<div class="sc-link">`
         + `<button class="sc-ins" title="在「${escAttr(label)}」之后插入一个环节（二次确认）" onclick="event.stopPropagation();confirmInsert('${escAttr(sk)}')">＋环节</button>`
         + `</div>`;
    }
  }
  h += '</div>';
  return h;
}

/* ★设计标准：环节「特殊规则」提示词——规则表外的环节级逻辑（如「展开」行分裂等行级声明）以 markdown
   渲染在标题下方、字段选项卡上方（同「文档集合里各文档」的 markdown 渲染机制）；无该字段或为空则不显示。
   ★原则：能用规则表表达的坚决不用提示词——过滤/映射应规则表化（查表+跳过动作可完整表达），
   提示词仅用于规则表无法表达的行级声明（如展开=一行变多行） */
/* 环节级「特殊规则」呈现：提示词表的变体共用同一套所见即所得编辑器（开始/结束及任何带特殊规则的环节都走这里，继承一致体验）。
   无特殊规则时返回空（不渲染卡片）。 */
function stageSpecialHTML(stage, sk) {
  const md = stage && stage["特殊规则"];
  if (!md || !String(md).trim()) return "";
  return `<div class="stage-special">` + wysiwygEditorHTML("special", () => (CONFIG["转换逻辑"][sk] || {})["特殊规则"] || "", `onblur="commitSpecial('${escAttr(sk)}')"`) + `</div>`;
}

/* ★设计标准：输出字段选项卡栏——横向排布在规则表上方、超出横向滚动（环节/字段两级都是选项卡导航）。
   选项卡 = 本环节「输出字段」（仅参与计算/产出的字段）；透传字段（数据层携带、本环节不改值）不作 tab，
   由下方「字段透传」说明行提示「未声明的 N 个字段自动透传（未丢失）」。
   ★区分：输入条件字段（规则表左侧多列）= 本环节可引用的源系统原始/上游字段（如环节1=26 列源系统原始全量，由 stageInputFields 决定）；
   选项卡（输出字段）= 本环节真正算出来的字段（环节1 仅 4 个映射相关）。两者概念不同，不可混淆。 */
/* 输出字段悬停说明气泡：anchor 元素 hover 时，在视口内就近显示一段说明文字（来自字段「说明」）。
   说明性内容不再内联铺在界面上，改为 hover 才出现，界面更干净。 */
function fieldTipShow(anchor) {
  const text = anchor && anchor.getAttribute("data-tip");   // 说明文字经 escAttr 写入 data-tip，避免 JS 字符串嵌套进 HTML 属性导致的引号冲突
  if (!text) return;
  fieldTipHide();
  const tip = document.createElement("div");
  tip.className = "field-tip-bubble";
  tip.textContent = text;   // textContent 自动转义，且配合 white-space:pre-wrap 保留换行
  document.body.appendChild(tip);
  const r = anchor.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let top = r.bottom + 6;
  if (top + th > window.innerHeight - 6) top = Math.max(6, r.top - th - 6);  // 下方放不下则翻到上方
  let left = r.left;
  if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
  tip.style.top = top + "px";
  tip.style.left = left + "px";
}
function fieldTipHide() {
  const t = document.querySelector(".field-tip-bubble");
  if (t) t.remove();
}

/* 条件字段菜单项悬停提示：在【右侧】显示该字段「说明」（与 .field-tab 的下方提示区分）。
   复用 .field-tip-bubble 样式，但 z-index 提到菜单(99999)之上，避免被菜单遮挡；
   右侧放不下则翻到左侧；无说明的字段不挂 data-tip，本函数直接 return。 */
function condDescTipShow(anchor) {
  const text = anchor && anchor.getAttribute("data-tip");
  if (!text) return;
  fieldTipHide();
  const tip = document.createElement("div");
  tip.className = "field-tip-bubble";
  tip.style.zIndex = 100000;
  tip.textContent = text;
  document.body.appendChild(tip);
  const r = anchor.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.right + 8;                              // 默认在右侧
  if (left + tw > window.innerWidth - 8) left = Math.max(8, r.left - tw - 8);   // 右侧放不下翻到左侧
  let top = r.top;
  if (top + th > window.innerHeight - 8) top = Math.max(8, window.innerHeight - th - 8);
  tip.style.top = top + "px";
  tip.style.left = left + "px";
}

function fieldTabsHTML(stageKey, editable) {
  // ★设计标准：被标记 "隐藏": true 的字段（如 _客户代码映射/_商品代码映射 这类纯引擎中间量）
  //   不渲染为本环节字段选项卡，仅保留业务上可见的输出字段（如 环节1 的 11 个 SOP 标准列）。
  //   editable=true（短路表视图）才挂 双击编辑 / 拖动排序 / 添加卡片；检测表视图只保留「切回映射表」。
  const fields = stageFieldList(stageKey).filter(f => {
    const fd = (CONFIG["转换逻辑"][stageKey]["输出字段"] || {})[f] || {};
    return !fd["隐藏"];
  });
  if (!fields.length && !editable) return "";
  let h = `<div class="scroll-wrap ft-scroll"><span class="ft-label">输出字段</span>`
    // 字段选项卡行：标签 + [左箭头 · 滚动区(阴影+字段) · 右箭头]；箭头在阴影区外，阴影只罩滚动区
    + `<div class="ft-nav">`
    + `<button class="ft-arrow ft-arrow-l" type="button" title="上一个输出字段" aria-label="上一个输出字段" onclick="stepField(-1)">‹</button>`
    + `<div class="ft-pane"><div class="scroll-shadow sh-left"></div><div class="scroll-shadow sh-right"></div>`
    + `<div class="field-tabs" data-scroll-key="${escAttr(tabScrollKey(stageKey))}">`;
  for (let fi = 0; fi < fields.length; fi++) {
    const f = fields[fi];
    const fd = (CONFIG["转换逻辑"][stageKey]["输出字段"] || {})[f] || {};
    const desc = fd["说明"] || "";
    let main, sub;
    // ★统一口径（与规则表列头 condHeadHTML、条件字段菜单 fieldMenuLabel 同源）：
    //   输出字段卡片 = hstack(序号, vstack(层, 键别名, 键))。
    //   首行=层（单据头/明细行，#2013 键层贯穿，用户 2026-11-12 定「凡渲染名+键处都带层」）。
    //   中行=键别名：中文键用键本身；英文键取跨环节「输出字段[f] 的键别名（存量 JSON 键「中文名」，兼容读取）」/顶层配置区「字段中文名」，缺才回退键本身。
    //     ⚠ 中行不能直接放键（api_key_name）：英文键的对象键往往就是键本身，会把中行也渲染成键。
    //   末行=键（本环节声明优先，缺则跨环节回退）；与中行同值时留空占位，
    //     避免中行与键行同文案重复（环节6 的 12 个英文键字段即属此情形）。
    //   「说明」是长句备注，仅 hover，不进中行（同 condHeadHTML 的约束）。
    const isCn = /[\u4e00-\u9fa5]/.test(f);
    const shortName = fieldShortName(f);
    main = isCn ? f : (shortName || f);
    const ak = fd["api_key_name"] || fieldApiKey(f);
    sub = (ak && ak !== main) ? ak : "";
    /* 层（用户 2026-11-12 定：凡渲染「键别名+键」处一并渲染「层」）：本环节键映射表改名条目所在桶优先，
       否则本环节输出字段的「键层」声明，缺省单据头（与 kmRows 同源）。 */
    const ent = kmEntry(CONFIG["转换逻辑"][stageKey], f);
    const layer = ent.target ? ent.layer : outFieldLayer(fd);
    const ef = escAttr(f);
    // 可编辑视图：单击延后 200ms 切字段，期间若来第二次点击即判为双击 → 打开编辑弹窗。
    //   这样避免「第一次 click 的 renderPanel 重建 DOM 导致原生 dblclick 丢失」。
    // ★拖动排序改为「长按」（用户 2026-11-13 定，防误触）：不用 HTML5 draggable（按下即拖），
    //   改挂 pointerdown，按住 400ms 才进入拖拽，见下方「输出字段定义顺序 · 长按拖拽排序」。
    const editAttrs = editable
      ? ` data-field="${ef}" onpointerdown="lpDragDown(event,this,'h')"`
      : "";
    h += `<div class="field-tab ${f===curField?'active':''}${desc?' has-tip':''}"`
       + (editable ? ` onclick="fieldTabClick('${ef}')"` : ` onclick="selectField('${ef}')"`)
       + (desc ? ` data-tip="${escAttr(desc)}" onmouseenter="fieldTipShow(this)" onmouseleave="fieldTipHide()"` : "")
       + editAttrs
       + `>`
       + `<span class="ft-num">${fi + 1}</span>`
       + `<span class="ft-vstack">`
       + `<span class="ft-layer" data-full="${escAttr(layer)}">${escHtml(layer)}</span>`
       + `<span class="ft-main" data-full="${escAttr(main)}">${escHtml(main)}</span>`
       + `<span class="ft-sub" data-full="${escAttr(sub)}">${escHtml(sub)}</span>`
       + `</span>`
       + `</div>`;
  }
  // 同环节的检测规则：虚拟选项卡（点它切到检测表视图，点任一字段切回映射表）
  if (stageHasDetectTab(stageKey)) {
    const n = ((CONFIG["转换逻辑"][stageKey] || {})["规则"] || []).length;
    h += `<div class="field-tab detect-tab ${curField===DETECT_TAB?'active':''}" onclick="selectField('${DETECT_TAB}')" `
       + `title="本环节的 ${n} 条检测规则（报异常不短路、仅记录；不动数据、不弃行）">`
       + `<span class="ft-main" data-full="检测规则（${n}）">检测规则（${n}）</span>`
       + `</div>`;
  }
  // 常驻「+ 添加输出字段」虚线卡片：置于选项卡行最右端（检测规则虚拟卡之后），不是 field-tab，
  //   故不参与 stepField 的箭头切换、也不参与拖动排序（无 data-field）。
  if (editable) {
    h += `<div class="ft-add" title="添加输出字段（新建后自动进入编辑）" onclick="addOutputFieldDef(true)">+ 添加输出字段</div>`;
  }
  h += `</div></div>`;   // field-tabs → ft-pane
  h += `<button class="ft-arrow ft-arrow-r" type="button" title="下一个输出字段" aria-label="下一个输出字段" onclick="stepField(1)">›</button>`;
  h += `</div></div>`;   // ft-nav → ft-scroll
  return h;
}

/* 「模式切换」条（2026-11-13 用户定：移入双击环节按钮打开的编辑弹窗，主面板不放切换条防误触）。
   环节可在 短路表 / 过滤表 / 检测表 / 提示词 / 键映射表 间切换；边界环节模式固定、不渲染。
   ○悬停浮窗（#82，用户 2026-11-12 定）：每个选项 hover 弹「field-tip-bubble」介绍该模式。
   ○文案只写名词本体不写括号解释（与「界面文案防废话」约定一致）。
   ○切换即走 switchStageMode 原确认流（点按钮即生效并刷新弹窗内条的高亮）。 */
const MODE_TIPS = {
  "规则":   "短路表：判断 + 映射，只产出值。引擎通用执行模式，规则挂在输出字段上",
  "过滤表": "过滤表：字段透传。多行规则之间 OR、行内条件之间 AND，命中即弃行",
  "检测表": "检测表：字段透传。命中仅记录报警（报异常 + 说明），不弃行、允许多行命中",
  "提示词": "提示词：纯规格文本，驱动生成脚本。只渲染与编辑，无结构化规则",
  "键映射": "键映射表：值全透传，只改输出键名；报文层沿上游键层声明继承，不提供层修改。行清单 = 上一环节输出字段",
};
function modeSwitchBar(sk) {
  if (isBoundaryKey(sk)) return "";   // 边界（开始/结束）环节模式固定，不需要模式单选器
  const mode = stageModeKey(sk);
  const tipAttr = m => MODE_TIPS[m] ? ` data-tip="${escAttr(MODE_TIPS[m])}" onmouseenter="fieldTipShow(this)" onmouseleave="fieldTipHide()"` : "";
  return `<div class="mode-switch">`
    + `<button class="ms-btn ${mode==='规则'?'on':''}" onclick="switchStageMode('${escAttr(sk)}','规则')"${tipAttr('规则')}>短路表</button>`
    + `<button class="ms-btn ${mode==='过滤表'?'on':''}" onclick="switchStageMode('${escAttr(sk)}','过滤表')"${tipAttr('过滤表')}>过滤表</button>`
    + `<button class="ms-btn ${mode==='检测表'?'on':''}" onclick="switchStageMode('${escAttr(sk)}','检测表')"${tipAttr('检测表')}>检测表</button>`
    + `<button class="ms-btn ${mode==='提示词'?'on':''}" onclick="switchStageMode('${escAttr(sk)}','提示词')"${tipAttr('提示词')}>提示词</button>`
    + `<button class="ms-btn ${mode==='键映射'?'on':''}" onclick="switchStageMode('${escAttr(sk)}','键映射')"${tipAttr('键映射')}>键映射表</button>`
    + `</div>`;
}

/* ★设计标准：同视图内的表格重渲染不丢滚动位置——moveRule/addRule/delRule/updateCond 等
   编辑操作都会整体重建规则表 DOM，若不恢复滚动条，横向滚到右侧字段列编辑一次就被拉回最左。
   ○实现：滚动容器带 key，滚动即时入记忆，重渲染后按 key 回写。
   ○2026-10-23 踩坑修正（不能再用「渲染 key 相同才保留」）：
     旧做法的 renderKey 里含「当前输出字段」，于是点选项卡切字段 = key 必变 = 本次不保留任何滚动位置，
     把两个容器一起拉回最左。可被 `切换输出字段` 这一个动作同时打中的容器有两个：
       · 选项卡栏 .field-tabs      —— 它的 tab 集合只随【环节】变，与当前选中哪个字段毫无关系，
                                       却跟着换了表：用户横向滚一段选项卡、点一眼靠右的 tab，整栏立刻弹回起点；
       · 规则表 .rules-view-body  —— 换了字段确实是换了表，但同一环节的条件列集合基本同构，
                                       每次切字段都从最左重新滚也是折磨。
     故改为：key 跟着「容器身份」走，与当前选中字段解耦。
   ○三级 key：
       TAB::<环节>                    选项卡栏（只随环节变 → 切字段、点检测规则 tab 都不动它的位置）
       TBL::<环节>|<字段>|<模式>       规则表（每个字段各自记住自己滚到哪，切回来还在原处）
       STG::<环节>|<模式>             兜底：首次进某字段（没有自己的记忆）时，透传同环节最近一次横向位置
   ○写回 scrollLeft 会触发 scroll 事件，阴影指示器随之自动更新，无需额外处理。 */

function tabScrollKey(sk) { return "TAB::" + (sk || curStage || ""); }
function tableScrollKey() {
  return "TBL::" + (curStage || "") + "|" + (curField || "") + "|" + (stageModeKey(curStage) || "");
}
function stageScrollKey() {
  return "STG::" + (curStage || "") + "|" + (stageModeKey(curStage) || "");
}
function staticScrollKey(name) { return "STT::" + (name || curStatic || ""); }

/* 给带 data-scroll-key 的容器挂监听：滚动即时写入记忆（主 key 与兜底 key 同步更新） */
function _bindScrollMem(root) {
  if (!root) return;
  root.querySelectorAll("[data-scroll-key]").forEach(el => {
    if (el.dataset.scrollMem) return;
    el.dataset.scrollMem = "1";
    const key = el.getAttribute("data-scroll-key");
    const fb = el.getAttribute("data-scroll-fallback");
    el.addEventListener("scroll", () => {
      const pos = { l: el.scrollLeft, t: el.scrollTop };
      _SCROLL_MEM[key] = pos;
      if (fb) _SCROLL_MEM[fb] = pos;
    }, { passive: true });
  });
}
/* 面板重渲染后回写滚动位置：优先用本 key 自己的记忆，没有再退到兜底 key */
function _applyScrollMem(root) {
  if (!root) return;
  root.querySelectorAll("[data-scroll-key]").forEach(el => {
    const key = el.getAttribute("data-scroll-key");
    const fb = el.getAttribute("data-scroll-fallback");
    const m = _SCROLL_MEM[key] || (fb && _SCROLL_MEM[fb]);
    if (!m) return;
    try { el.scrollLeft = m.l; el.scrollTop = m.t; } catch (e) { /* 忽略越界 */ }
  });
}
/* 选项卡栏粒度修正：回写位置后，若当前选中的 tab 仍 partly/completely 在可视区外，
   按「刚好露出」的最小位移补一下（不改变已有滚动进度的前提下保证点得着的 tab 看得见）。
   ○block 方向绝不干预：内联地只动 scrollLeft，避免把整页纵向顶走。 */
function _ensureActiveTabVisible(root) {
  if (!root) return;
  const tabs = root.querySelector(".field-tabs");
  const act = tabs && tabs.querySelector(".field-tab.active");
  if (!act) return;
  const tr = act.getBoundingClientRect(), cr = tabs.getBoundingClientRect();
  let d = 0;
  if (tr.left < cr.left) d = tr.left - cr.left;
  else if (tr.right > cr.right) d = Math.min(tr.right - cr.right, tr.left - cr.left);
  if (d) tabs.scrollLeft += d;
}

/* ★纵滚 → 横滚转发（用户 2026-11-07 定）：字段选项卡栏（.field-tabs）是 overflow-x 横滚区，
   但大部分鼠标没有横向滚轮，光标停在栏上时纵滚毫无反应。
   规则：① 仅当该栏真的有横向溢出时才接管；② deltaY 为 0（纯横向）或触控板斜滚（|deltaX|≥|deltaY|）
   不劫持、走原生；③ 已滚到左/右边界时放行纵滚——栏到头后继续滚就顺势滚页面，不会卡死在栏上。
   面板每次重渲染都会整体替换 DOM，故挂 document 委托（capture + passive:false 才能 preventDefault），只注册一次。 */
document.addEventListener("wheel", (e) => {
  const tabs = (e.target && e.target.closest) ? e.target.closest(".field-tabs") : null;
  if (!tabs) return;
  const max = tabs.scrollWidth - tabs.clientWidth;
  if (max <= 0) return;
  if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return; // 触控板横滚/斜滚走原生
  let dy = e.deltaY * (e.deltaMode === 1 ? 40 : 1);      // Firefox 行模式按行高折算
  if (!dy) return;
  if ((dy < 0 && tabs.scrollLeft <= 0) || (dy > 0 && tabs.scrollLeft >= max - 1)) return; // 边界放行
  e.preventDefault();
  tabs.scrollLeft += dy;
}, { passive: false, capture: true });

/* ★键层（#2013 改根，用户 2026-11-12 定）：键的报文层归属在键诞生处声明——输出字段定义自带
   "键层": "单据头"|"明细行"，与 api_key_name 并列；贯穿整套流程，键映射表只是末端改名不再承担分桶源头。

/* ============ 短路表：输出字段的增 / 删 / 改 / 拖动排序 ============
   ★设计标准：输出字段的显示顺序 = JSON「输出字段」的键序，顺序随配置文件走（不另存浏览器缓存）。
     拖动只重排【可见】字段；被标记「隐藏」的引擎中间量保持原有槽位不动。
   ⚠ 引擎按声明顺序逐字段求值（engine.py stage_fields / run_stage_fields）；同环节若存在
     「后字段引用前字段」的规则，重排键序会改变求值结果——此处不静默拦截，由配置编写者核对
     （见 README「输出字段并行语义」铁律）。 */

   ★例外（用户 2026-11-05 报障修复）：左右方向箭头触发的点击直接同步选中、不进双击判定。
     否则箭头连点时切换被 200ms 延后，第二次点击仍落在同一张字段卡上 → 误判为双击编辑。 */

    selectField(f);          // 箭头点击：立即切换，连点才能逐格前进
    return;
  }
  if (_fieldClickTimer && _fieldClickKey === f) {

/* ★输出字段「定义顺序」长按拖拽排序（用户 2026-11-13 定）
   两处「定义输出字段」界面共用：短路表字段选项卡（axis="h"，横排）、提示词输出字段表格（axis="v"，纵排）。
   · 为什么长按：短按即拖会与「单击切字段 / 双击编辑 / 表格内输入」互相冲突，按住 400ms 才进入拖拽态（防误触）。
   · 为什么不用 HTML5 draggable：原生拖拽要求按下那一刻元素已是 draggable，「长按后解锁」无法在同一次按压内
     启动拖动，故改用 Pointer Events 自绘：源元素半透明 + 目标插入位指示，松手按落点重排定义顺序。
   · 只改 JSON「输出字段」对象的键顺序（= 定义顺序）：不按层自动排序、不做层序校验——违序 JSON 如实渲染
     （层序属建议型规范，用户 2026-11-13 定）。 */
const LP_HOLD_MS = 400, LP_MOVE_TOL = 8;
let _lp = null;
function lpDragItems() {
  if (!_lp) return [];
  const box = _lp.el.parentElement;                 // 卡片= .field-tabs；表格行= tbody
  return box ? Array.from(box.querySelectorAll("[data-field]")) : [];
}
function lpDragDown(ev, el, axis) {
  if (EDIT_LOCK) return;                                     // 只读态不放行
  if (ev.button !== undefined && ev.button !== 0) return;     // 只认主键（触屏 button=0）
  if (!el.getAttribute("data-field")) return;
  if (ev.target.closest("input, select, button, textarea, a")) return;   // 行内控件优先，不抢其操作
  lpCancel();
  const defs = (CONFIG["转换逻辑"][curStage] || {})["输出字段"] || {};
  const pool = el.tagName === "TR"
    ? Object.keys(defs)                                             // 表格渲染全量（含隐藏中间量）
    : Object.keys(defs).filter(k => !(defs[k] && defs[k]["隐藏"]));  // 选项卡不渲染隐藏中间量
  _lp = { el, key: el.getAttribute("data-field"), axis, x0: ev.clientX, y0: ev.clientY,
          armed: false, to: null, before: true, pool, timer: null };
  _lp.timer = setTimeout(lpArm, LP_HOLD_MS);
  document.addEventListener("pointermove", lpDragMove, { passive: false });
  document.addEventListener("pointerup", lpDragUp, true);
  document.addEventListener("pointercancel", lpCancel, true);
}
function lpArm() {
  if (!_lp) return;
  if (_lp.timer) { clearTimeout(_lp.timer); _lp.timer = null; }
  _lp.armed = true;
  _lp.el.classList.add("lp-dragging");
  document.body.classList.add("lp-holding");

}
function lpMarkTarget(ev) {
  const items = lpDragItems();
  const pos = _lp.axis === "h" ? ev.clientX : ev.clientY;
  let target = null, before = true;
  items.forEach(it => {
    if (it === _lp.el) return;                                 // 源自身不参与落点判定
    const r = it.getBoundingClientRect();
    const mid = _lp.axis === "h" ? r.left + r.width / 2 : r.top + r.height / 2;
    if (pos > mid) { target = it; before = false; }            // 越过中线 → 落到该项之后
    else if (!target && pos >= (_lp.axis === "h" ? r.left : r.top)) { target = it; before = true; }
  });
  items.forEach(it => it.classList.remove("drop-before", "drop-after"));
  _lp.to = target ? target.getAttribute("data-field") : null;

  if (target) target.classList.add(before ? "drop-before" : "drop-after");
}
function lpDragMove(ev) {
  if (!_lp) return;

    if (Math.abs(ev.clientX - _lp.x0) > LP_MOVE_TOL || Math.abs(ev.clientY - _lp.y0) > LP_MOVE_TOL) lpCancel();

function lpSwallowNextClick() {

}

    _lp.el.classList.remove("lp-dragging");

  document.body.classList.remove("lp-holding");

/* 重排「输出字段」定义顺序（= JSON 对象键序）。pool = 本次可拖动的键集合：

   池外键留在原槽位不动，池内键按拖拽结果依次填空。 */
function reorderOutputFields(fromKey, toKey, placeBefore, pool) {
  const st = CONFIG["转换逻辑"][curStage];
  const defs = st && st["输出字段"];
  if (!defs) return;
  const keys = Object.keys(defs);
  const vis = (pool ? pool.filter(k => defs[k]) : keys.filter(k => !(defs[k] && defs[k]["隐藏"])));
  const from = vis.indexOf(fromKey), to = vis.indexOf(toKey);
  if (from < 0 || to < 0 || from === to) return;

  vis.splice(from, 1);

  const rebuilt = {};
  let vi = 0;
  keys.forEach(k => {
    if (vis.indexOf(k) < 0) rebuilt[k] = defs[k];               // 池外键（隐藏中间量）留在原槽位
    else { const nk = vis[vi++]; rebuilt[nk] = defs[nk]; }
  });
  st["输出字段"] = rebuilt;
  log("调整输出字段顺序", curStage + " 「" + fromKey + "」移到「" + toKey + "」" + (placeBefore ? "之前" : "之后"));
  renderPanel(); scheduleSave();
}

/* 双击编辑弹窗：键别名 / 键 / 说明（独立「键别名」属性已并入对象键，不再单列）；底部「删除」再走 openConfirm 二次确认 */
function closeFieldEditDialog() {

  box.innerHTML = `<div class="field-edit-title">编辑输出字段</div>`
    + `<div class="field-edit-form">`

function applyFieldEdit(oldKey, vals) {
  const st = CONFIG["转换逻辑"][curStage], defs = st && st["输出字段"];
  if (!defs || !defs[oldKey]) return;
  const name = (vals.name || "").trim();
  if (!name) { setAutoHint("键别名不能为空"); return; }
  if (name !== oldKey && defs[name]) { setAutoHint("键别名「" + name + "」已存在"); return; }
  pushChainSnapshot(UNDO_STACK);
  const obj = defs[oldKey];
  obj["api_key_name"] = vals.ak || "";
  if (vals.layer === KM_DEFAULT_BUCKET) delete obj["键层"];   // 缺省不落盘
  else obj["键层"] = vals.layer;
  obj["说明"] = vals.desc || "";
  if (name !== oldKey) {
    (obj["规则"] || []).forEach(r => { if (r["输出"] && r["输出"]["字段"] === oldKey) r["输出"]["字段"] = name; });
    const rebuilt = {};
    Object.keys(defs).forEach(k => { rebuilt[k === oldKey ? name : k] = defs[k]; });   // 原名替换、位置不变
    st["输出字段"] = rebuilt;
    if (curField === oldKey) curField = name;

  const st0 = CONFIG["转换逻辑"][curStage];

  const n = ((fd0 && fd0["规则"]) || []).length;
  closeFieldEditDialog();
  if (!confirm("确认删除输出字段「" + key + "」及其 " + n + " 条规则？删除后可用 Ctrl+Z 撤销。")) return;
  const st = CONFIG["转换逻辑"][curStage];
  if (!st || !st["输出字段"] || !st["输出字段"][key]) return;
  pushChainSnapshot(UNDO_STACK);
  delete st["输出字段"][key];
  if (curField === key) {
    curField = Object.keys(st["输出字段"]).filter(k => !(st["输出字段"][k] && st["输出字段"][k]["隐藏"]))[0] || "";
  }
  log("删除输出字段", curStage + " 删除 " + key);
  renderPanel(); scheduleSave();
}

/* ═══ 键映射表模式（#66 定、#74 更名、#2013 分层，用户 2026-11-11/12 定）═══
   ★设计标准：值全透传、只改输出键名，并给「有改名的字段」标注所在报文层。
   独占键「键映射」= 按层分桶（V7 起，两桶固定名、恒存在，空桶写 {}）：
     { "单据头": {字段名:目标键}, "明细行": {字段名:目标键} }
     · **桶内只存改名项**（用户 2026-11-12 定：「没改名的不写即可」）——某字段没改名就不出现在任何桶里，
       不写空串、不写占位。
     · 层 = 这个改名落在报文哪一层（单据头 / 明细行）。同一个键可以同时是两层槽位
       （如 department_id：单据头 部门ID、明细行 明细部门ID），靠桶区分，不需要任何例外规则。
     · ★层不可改、只继承（用户 2026-11-13 定）：层的唯一定义处 = 输出字段定义的「键层」声明
       （短路表 / 提示词这类重新定义输出字段的模式；本质是定义不是改层）；键映射表属透传型环节、
       没有层定义逻辑——面板层列只读，改名条目一律落继承层的桶（commitKeyTarget）。
     · 读取时不在任何桶 → 层兜底「单据头」、目标键为空（= 未改名，沿用上游键）。
   ★为什么要分层（#2013 动因）：扁平渲染把「单据头 部门ID → department_id」与「明细行 明细部门ID →
     department_id」当成同键重复整行标黄；分层后重复判据 =「同层 + 同目标键」，跨层同键合法不加任何标注（2026-11-13 用户定：灰注属废话移除）。
   ★对外字段清单 = 输入清单原样传递（#79）：键映射表不定义「输出字段」，下游取到的即本环节输入清单。
   ★孤儿项口径（#74 定、#75 收敛）：JSON 里存了上游暂不存在的字段**永不清理、不渲染**——上游再输出该字段时
     条目与层归属即生效（commit* 只动当前字段这一条，绝不动其他条目）。 */
const KM_BUCKETS = ["单据头", "明细行"];   // 固定枚举（写进 JSON，不随文案改）
const KM_DEFAULT_BUCKET = "单据头";        // 读取兜底：不在任何桶 = 单据头、未改名（用户 2026-11-12 定）

function kmEmptyBuckets() {
  const b = {};
  KM_BUCKETS.forEach(k => { b[k] = {}; });
  return b;
}
/* 是否已是分桶结构：桶值是对象（扁平格式的值是字符串）。
   空对象 {} 也算分桶结构——它等价于「两桶皆空」，只差把两个桶名补齐（用户 2026-11-12 定：强制两个桶）。 */
function kmIsBucketStyle(v) {
  if (!v || typeof v !== "object" || Array.isArray(v)) return false;
  const ks = Object.keys(v);
  if (!ks.length) return true;
  return ks.some(k => KM_BUCKETS.indexOf(k) >= 0) || ks.some(k => v[k] && typeof v[k] === "object");
}
/* 取（必要时建立）本环节分桶；旧扁平格式在此一次性迁成「全部单据头」（仅内存，落盘由调用方决定） */
function kmBuckets(st, create) {
  let v = (st && typeof st === "object") ? st["键映射"] : undefined;
  if (!v || typeof v !== "object" || Array.isArray(v)) v = {};
  if (kmIsBucketStyle(v)) {
    KM_BUCKETS.forEach(k => { if (!v[k] || typeof v[k] !== "object" || Array.isArray(v[k])) v[k] = {}; });
    // 清掉历史残留桶（仅内存，不写盘）：桶名只有单据头 / 明细行两个，其余键一律视为脏键丢弃
    Object.keys(v).forEach(k => { if (KM_BUCKETS.indexOf(k) < 0) delete v[k]; });
  } else {
    const flat = v;
    v = kmEmptyBuckets();
    Object.keys(flat).forEach(f => {
      if (typeof flat[f] === "string") v[KM_DEFAULT_BUCKET][f] = flat[f];   // 旧数据无层信息 → 单据头
    });
  }
  if (create && st) st["键映射"] = v;
  return v;
}
/* 某字段的层归属与改名值：命中第一个桶即返回；全未命中 → 单据头 + 空目标键（未改名） */
function kmEntry(st, field) {
  const b = kmBuckets(st, false);
  for (let i = 0; i < KM_BUCKETS.length; i++) {
    const L = KM_BUCKETS[i];
    if (Object.prototype.hasOwnProperty.call(b[L], field)) {
      return { layer: L, target: b[L][field] || "" };
    }
  }
  return { layer: KM_DEFAULT_BUCKET, target: "" };
}
/* ★强制两个桶（用户 2026-11-12 定 R1d）：键映射表环节的「键映射」恒为 {单据头:{…}, 明细行:{…}}——
   两个桶名永远在、空桶写 {}，不存在第三个桶，也不允许只剩一个桶或整个键缺失。
   在所有落盘出口前跑一遍（cfgText），把扁平旧格式、空对象 {}、缺键、残留桶名一次性归一。 */
function kmNormalizeAll(cfg) {
  const obj = cfg || CONFIG;
  const logic = (obj && obj["转换逻辑"]) || {};
  let changed = false;
  Object.keys(logic).forEach(k => {
    const st = logic[k];
    if (!st || typeof st !== "object") return;
    const isKm = (st["模式"] === "键映射" || st["模式"] === "Key映射");
    if (!isKm) return;
    const before = JSON.stringify(st["键映射"]);
    kmBuckets(st, true);   // create=true：缺键 / 空对象 / 扁平 → 就地补成两桶
    if (JSON.stringify(st["键映射"]) !== before) changed = true;
  });
  return changed;
}
/* 落盘统一出口：先强制两桶，再序列化——所有写盘/导出/预览路径都必须走这里，避免某条路径漏归一。 */
function cfgText() {
  kmNormalizeAll(CONFIG);
  return JSON.stringify(CONFIG, null, 2);
}
function kmRows(sk) {
  const fields = stageInputFields(sk);
  const keys = stageKeys();
  const idx = keys.indexOf(sk);
  const st = CONFIG["转换逻辑"][sk] || {};
  return fields.map(name => {
    let upKey = "", upLayer = "";
    for (let i = idx - 1; i >= 0; i--) {
      if (isBoundaryKey(keys[i])) continue;
      const fd = ((CONFIG["转换逻辑"][keys[i]] || {})["输出字段"] || {})[name];
      if (fd) { upKey = fd["api_key_name"] || ""; upLayer = outFieldLayer(fd); break; }
    }
    const ent = kmEntry(st, name);
    /* ★键层贯穿（用户 2026-11-12 定）：层在键诞生处（输出字段定义）声明，键映射表只是末端——
       已改名 → 改名条目所在桶；未改名 → 沿上游输出字段的键层声明；全链未声明 → 单据头缺省。 */
    const layer = ent.target ? ent.layer : (upLayer || KM_DEFAULT_BUCKET);
    return { name, upKey, layer, target: ent.target };
  });
}
function keyMapPanelHTML(stage) {
  const sk = curStage;
  const rows = kmRows(sk);
  // ★冻结表头（用户 2026-11-12 定）：与规则表同一套布局——表格进单一滚动体，thead sticky top 0 钉住；
  //   明细行多时只滚表体，列头（#/层/输入键别名/输入键/目标键）恒在视口顶。
  //   （模式条已移入双击环节的编辑弹窗，2026-11-13 用户定：面板不放切换条防误触，冻结头留空。）
  const head = "";
  /* ★重复标黄（#2013 改口径，用户 2026-11-12 定）：按「同层 + 同生效目标键（改名值 || 沿用上游键 || 对象键）」
     统计，出现 2 次及以上整行标黄。跨层同键（部门ID 单据头 / 明细部门ID 明细行 → 都 department_id）
     是报文本身的事实、合法——层列本就逐行显示所属层，不加任何标注（2026-11-13 用户定：灰注属废话移除）。 */
  const finals = rows.map(r => r.target || r.upKey || r.name);
  const seen = {};
  rows.forEach((r, i) => {
    const k = r.layer + "\u0000" + finals[i];
    seen[k] = (seen[k] || 0) + 1;
  });

  let h = '<table class="km-table"><thead><tr>'
    + '<th class="km-idx">#</th><th style="width:96px">层</th>'
    + '<th style="width:19%">输入键别名</th><th style="width:25%">输入键</th><th>目标键</th>'
    + '</tr></thead><tbody>';
  if (!rows.length) {
    h += '<tr><td colspan="5" class="km-empty">上一环节无输出字段，无可映射的明细行</td></tr>';
  } else {
    /* ★透传行空输入框 + 灰占位（#82）：未改名的行目标键输入框留空、原生 placeholder 显示缺省键
       （= 输入键，未标注退对象键）——一眼看出「这行没被人为干预」；清空即恢复透传。
       ★未改名 = 不落层（用户 2026-11-12 定「没改名的不写即可」）：层列显示「—」灰字、不给选择器，
       先填目标键把这一行变成改名项，层才有承载处（层挂在改名条目上，不单独立项）。 */
    rows.forEach((r, i) => {
      const effUp = r.upKey || r.name;
      const dup = seen[r.layer + "\u0000" + finals[i]] > 1;
      const mapped = !!r.target;
      h += `<tr${dup ? ' class="km-dup"' : ''}>`
        + `<td class="km-idx">${i + 1}</td>`
        + `<td class="km-layer">`
        + `<span class="km-layer-na" title="层沿上游输出字段的键层声明继承，键映射表不提供层修改（2026-11-13 定：层只在输出字段定义处声明）">${escHtml(r.layer)}</span>`
        + '</td>'
        + `<td class="km-name">${escHtml(r.name)}</td>`
        + `<td class="km-key km-ro">${r.upKey ? escHtml(r.upKey) : '<span class="km-nolabel">（未标注）</span>'}</td>`
        + `<td><input class="inp km-target" value="${escAttr(r.target)}"`
        + (r.target ? "" : ` placeholder="${escAttr(effUp)}"`)
        + ` onchange="commitKeyTarget('${escAttr(r.name)}', this.value)"${EDIT_LOCK ? " readonly" : ""}></td>`
        + '</tr>';
    });
  }
  h += '</tbody></table>';
  return ruleViewWrap(head, h);
}
/* ★改层入口已移除（用户 2026-11-13 定）：层只在输出字段定义处声明（短路表 / 提示词这类重新定义
   输出字段的模式，本质是定义不是改）；键映射表属透传型环节、没有层定义逻辑——层列只读、完全继承，
   改名条目一律落继承层的桶（commitKeyTarget）。历史遗留的错桶条目按事实所在桶显示，不静默搬家。 */
/* 改名：写入层桶；清空 / 改回原值 = 从所有桶删除该条目（不写空串——没改名就不写）。
   层取 kmRows 推导值：已改名行保留原桶；**首次改名沿用上游输出字段的键层声明**（键层贯穿，
   用户 2026-11-12 定），全链未声明才落单据头缺省——UI 不提供改层入口，层永远继承。 */
function commitKeyTarget(field, raw) {
  const st = CONFIG["转换逻辑"][curStage];
  if (!st || !isKeyMapStage(curStage)) return;
  if (EDIT_LOCK) { roHint(); renderPanel(); return; }   // 锁态守卫（纵深防御）
  const rows = kmRows(curStage);
  const row = rows.find(r => r.name === field);
  const effUp = (row && (row.upKey || row.name)) || field;
  const layer = (row && row.layer) || KM_DEFAULT_BUCKET;
  const v = String(raw ?? "").trim();
  const renamed = !!v && v !== effUp;
  pushChainSnapshot(UNDO_STACK);
  const b = kmBuckets(st, true);
  KM_BUCKETS.forEach(L => { if (Object.prototype.hasOwnProperty.call(b[L], field)) delete b[L][field]; });
  if (renamed) b[layer][field] = v;
  log("键映射表改名", `${curStage} ${field}${renamed ? "（" + layer + "）" : ""}：${effUp} → ${renamed ? v : effUp + "（沿用）"}`);
  scheduleSave();
  renderPanel();
}

function renderPanel() {
  requestAnimationFrame(refreshAllLineNumbers);
  const panel = document.getElementById("panel");
  panel.classList.remove("panel-fill");   // 非 MD 面板不撑满（由 renderPromptStagePanel 视情况再加）
  panel.classList.remove("panel-rules");  // 非规则表视图不冻结头（由 finishPanelRender 视情况再加）
  if (!curStage) { panel.innerHTML = '<div class="empty">请从左侧选择环节</div>'; return; }
  const stage = CONFIG["转换逻辑"][curStage];
  // ① 提示词环节：整屏 markdown（无规则表）
  if (isPromptStage(curStage)) { renderPromptStagePanel(panel, stage); return; }
  // ② 过滤表：专属规则表（无输出字段、无动作列）
  if (isFilterTableStage(curStage)) {
    finishPanelRender(panel, filterStagePanelHTML(stage), true);
    return;
  }
  // ③ 检测表：与短路表按字段分表不同，检测表右栏为「检测结果」而非输出动作（命中仅记录、不短路）
  if (stageModeKey(curStage) === "检测表" && (!stageHasDetectTab(curStage) || curField === DETECT_TAB)) {
    finishPanelRender(panel, detectStagePanelHTML(stage), true);
    return;
  }
  // ③.5 键映射表（#66 定 #74 更名）：三列改名表（值全透传），无字段选项卡、无添加行；表头行冻结（2026-11-12 用户定）
  if (isKeyMapStage(curStage)) {
    finishPanelRender(panel, keyMapPanelHTML(stage), false);
    return;
  }
  // ④ 短路表：按输出字段分选项卡，表 = 当前字段的规则
  const fd = stage["输出字段"][curField];
  if (!curField || !fd) { panel.innerHTML = '<div class="empty">请从上方选择字段</div>'; return; }
  finishPanelRender(panel, fieldRulesPanelHTML(stage, fd), true);
  // 字段选项卡文字溢出检测（超宽启用来回滚动）
  requestAnimationFrame(() => {
    panel.querySelectorAll(".field-tabs .ft-main, .field-tabs .ft-sub").forEach(el => {
      el.classList.remove("mq");
      if (el.scrollWidth > el.clientWidth + 4) el.classList.add("mq");
    });
  });
}

/* ★三栏分离结构下跨栏行高对齐：左/中/右三表各自独立，需把同一行号的三列行高锁定为三者最大值，
   否则条件列内容多行时左右栏行错位。每次渲染后调用一次；内容/窗口变化由 ResizeObserver 兜底重算。 */
function syncRuleRowHeights(panel) {
  if (!panel) return;
  const grid = panel.querySelector(".rules-grid");
  if (!grid) return;
  const leftRows = Array.from(grid.querySelectorAll(".rules-left tbody tr"));
  const midRows = Array.from(grid.querySelectorAll(".rules-mid tbody tr"));
  const rightRows = Array.from(grid.querySelectorAll(".rules-right tbody tr"));
  const n = Math.min(leftRows.length, midRows.length, rightRows.length);
  for (let i = 0; i < n; i++) {
    const h = Math.max(leftRows[i].offsetHeight, midRows[i].offsetHeight, rightRows[i].offsetHeight);
    if (h > 0) {
      leftRows[i].style.height = h + "px";
      midRows[i].style.height = h + "px";
      rightRows[i].style.height = h + "px";
    }
  }
  // 表头也按最大高度对齐（# / 条件 / 输出+操作 三表头行）
  const lh = grid.querySelector(".rules-left thead tr");
  const mh = grid.querySelector(".rules-mid thead tr");
  const rh = grid.querySelector(".rules-right thead tr");
  if (lh && mh && rh) {
    const hh = Math.max(lh.offsetHeight, mh.offsetHeight, rh.offsetHeight);
    if (hh > 0) { lh.style.height = hh + "px"; mh.style.height = hh + "px"; rh.style.height = hh + "px"; }
  }
}

/* ============ 过滤表模式：专属渲染与回调 ============ */
/* 渲染过滤表：每行 = 多个条件单元（AND）；字段透传、命中即弃行。
   ★条件单元两种形态：① 存在性 {字段,表,列,模式}（行值 ∈ 表某列）② 值比较 {字段,算子,值}
     （与引擎 match_any 一致：有「表+列」= ①，否则 = ②）。
   条件单元控件：字段(源列下拉) / 表(静态表下拉) / 列(动态) / 模式(精确·包含) / 删除单元（二次确认）；
   行级：添加条件单元 / 复制行 / 上移 / 下移 / 删除行。 */

/* 过滤表 · 存在性条件（行字段值 ∈ 某表某列）：表 / 列 / 模式 三下拉 + 转「值比较」 */
function filterLookupCondHTML(ri, ci, c, tnames) {
  const tbl = c["表"] || "";
  const colOpts = filterTableCols(tbl).map(col =>
    `<option value="${escAttr(col)}" ${(c["列"]===col)?'selected':''}>${escHtml(col)}</option>`).join("");
  return `<div class="ft-cell-head">表 <select class="ft-sel" onchange="updateFilterCond(${ri},${ci},'表',this.value)">
                ${tnames.map(t=>`<option value="${escAttr(t)}" ${(tbl===t)?'selected':''}>${escHtml(t)}</option>`).join("")}
              </select></div>
              <div class="ft-cell-head">列 <select class="ft-sel" onchange="updateFilterCond(${ri},${ci},'列',this.value)">

              </select></div>
              <div class="ft-cell-head">模式 <select class="ft-sel" onchange="updateFilterCond(${ri},${ci},'模式',this.value)">
                <option value="精确" ${(c["模式"]||"精确")==="精确"?'selected':''}>精确（行值=表列值）</option>

/* 过滤表 · 值比较条件（算子 + 值）：自绘算子下拉 + 值输入框 */
function filterValueCondHTML(ri, ci, c) {

/* 过滤表 · 某字段的条件格：同字段多条件 AND（虚线分隔）；无条件 → 占位「—」 */
function filterCondCellHTML(rule, ri, f, tnames, dispFields) {
  const conds = rule["条件"] || [];
  const idxs = [];
  conds.forEach((c, ci) => {
    // V5：查表判定条件必须带「字段」键；旧畸形形态（无字段键）兜底显示在首个字段列，不静默丢弃
    const cf = c["字段"] || (c["查表"] ? ((dispFields && dispFields[0]) || "") : undefined);
    if (cf === f) idxs.push(ci);
  });
  if (!idxs.length) {
    // 空格子也要能手动加规则：渲染占位符 + 「＋且」按钮（点击弹菜单选条件形态）
    let empty = `<div class="ft-empty">—</div>`;
    empty += `<button class="cond-add" title="加一条条件（AND）：点击后选 值比较 或 查表判定" onclick="openCondAddMenu(event,'filter',${ri},'${escAttr(f)}')">＋且</button>`;
    return empty;
  }
  let cell = "";
  idxs.forEach((ci, k) => {
    const c = conds[ci];
    if (k > 0) cell += `<div style="margin-top:6px;border-top:1px dashed var(--border2);padding-top:6px">`;
    // ★过滤条件三种形态（与引擎 match_any 一致）：有「查表」= ⓪ 查表判定（V5，必须关联字段）；有「表」= ① 存在性；否则 = ② 值比较
    cell += c["查表"] ? lookupGateBlockHTML(ri, ci, c, dispFields || []) : c["表"] ? filterLookupCondHTML(ri, ci, c, tnames) : filterValueCondHTML(ri, ci, c);
    cell += `<button class="cond-add danger" title="删除该条件" onclick="delFilterCond(${ri},${ci})">✕</button>`;
    if (k > 0) cell += `</div>`;

  cell += `<button class="cond-add" title="在同字段再加一条条件（AND）：点击后选 值比较 或 查表判定" onclick="openCondAddMenu(event,'filter',${ri},'${escAttr(f)}')">＋且</button>`;
  return cell;
}

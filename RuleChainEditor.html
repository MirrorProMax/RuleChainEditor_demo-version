function copyFilterRule(ri) {
  pushHistory();
  const rules = getFilterRules();
  rules.splice(ri + 1, 0, JSON.parse(JSON.stringify(rules[ri])));
  log("复制过滤规则", `${curStage} 复制第 ${ri+1} 行`);
  renderPanel(); scheduleSave();
}
function moveFilterRule(ri, dir) {
  const rules = getFilterRules();
  const j = ri + dir;
  if (j < 0 || j >= rules.length) return;
  pushHistory();
  [rules[ri], rules[j]] = [rules[j], rules[ri]];
  log("移动过滤规则", `${curStage} 第 ${ri+1} 行${dir>0?"下移":"上移"}`);
  renderPanel(); scheduleSave();
}
function addFilterCond(ri) {
  addFilterCondToField(ri, (stageInputFields(curStage)[0] || ""));
}

/* ★过滤条件两种形态（与引擎 match_exists 一致）：
     ① 值比较 {字段, 算子, 值}——默认形态（如 支付完成日期 日期小于等于 2026-08-31）
     ② 存在性 {字段, 表, 列, 模式}——行字段值 ∈ 某表某列（旧范式，排除表类过滤用） */
function addFilterCondToField(ri, field) {
  pushHistory();
  const rule = getFilterRules()[ri];
  if (!rule["条件"]) rule["条件"] = [];
  rule["条件"].push({ "字段": field, "算子": "完全等于", "值": "" });
  log("添加过滤条件单元", `${curStage} 第 ${ri+1} 行 ${field} ＋值条件`);
  renderPanel(); scheduleSave();
}
/* 形态互转：存在性 → 值比较（filterCondToLookup 已随「存在性新增/转入入口」一并移除——
   互转时清掉另一形态的键，避免引擎误判条件类型；filterCondToValue 保留供存量存在性条件切回） */
function filterCondToValue(ri, ci) {
  pushHistory();
  const c = getFilterRules()[ri]["条件"][ci];
  delete c["表"]; delete c["列"]; delete c["模式"];
  c["算子"] = "完全等于"; c["值"] = "";
  log("过滤条件改值比较", `${curStage} 第 ${ri+1} 行 条件${ci+1}`);
  renderPanel(); scheduleSave();
}

/* 过滤表的算子菜单：与规则表共用 op-menu 样式，但写回目标是「环节级过滤规则」 */
function toggleFilterOpMenu(e, ri, ci) {
  e.stopPropagation();
  const trigger = e.currentTarget;
  closeOpMenu();
  const c = ((getFilterRules()[ri] || {})["条件"] || [])[ci] || {};
  const curOp = c["算子"] || "";
  const wc = `<div class="op-item ${!curOp ? "on" : ""}" style="color:#8a8a8a" onclick="closeOpMenu();updateFilterCond(${ri},${ci},'算子','')">通配</div>`;
  const ops = OPS.map(o => `<div class="op-item ${curOp===o?'on':''}" style="background:${opColor(o)};color:#fff" data-op="${escAttr(o)}" onclick="closeOpMenu();updateFilterCond(${ri},${ci},'算子','${escAttr(o)}')">${o}</div>`).join("");
  // ★「查表（存在性条件）」转换项已移除（2026-11-07 用户定：存在性形态不再提供新增/转入入口，V5 查表判定覆盖其能力）
  mountOpMenu(wc + ops, trigger, { ri, field: "", ci, trigger });
}
function delFilterCond(ri, ci) {
  // ★设计标准：删除是破坏性操作，必须二次确认（与 delRule / delCond 一致）
  const cond = (getFilterRules()[ri]["条件"] || [])[ci];
  if (!cond) return;
  const same = (getFilterRules()[ri]["条件"] || []).filter(c => c["字段"] === cond["字段"]);
  const condTxt = cond["表"]
    ? `${cond["字段"] || "?"} ∈ ${cond["表"]}.${cond["列"] || "?"}（${cond["模式"] || "精确"}）`
    : `${cond["字段"] || "?"} ${cond["算子"] || "通配"} ${cond["值"] ?? ""}`;
  let tip = `确认删除第 ${ri+1} 行的过滤条件：${condTxt}？\n`
          + `（只删这一个条件；不可撤销，删除前会写入撤销栈，可从左侧「撤销」恢复。）`;
  if (same.length === 1) {
    tip += `\n⚠️ 删完后该行「${cond["字段"]}」无条件 = 该条件格回通配；若本行所有字段都无任何条件，本行将永不命中（等于失效）。`;
  }
  if (!confirm(tip)) return;
  _delFilterCondCore(ri, ci);
}
function _delFilterCondCore(ri, ci) {
  pushHistory();
  getFilterRules()[ri]["条件"].splice(ci, 1);
  log("删除过滤条件单元", `${curStage} 第 ${ri+1} 行 条件${ci+1}`);
  renderPanel(); scheduleSave();
}
function updateFilterCond(ri, ci, key, val) {
  pushHistory();
  const c = getFilterRules()[ri]["条件"][ci];
  c[key] = val;
  if (key === "表") { c["列"] = ""; }   // 切换表 → 列重置（列选项随表变）
  if (key === "op" || key === "算子") {   // 算子：菜单/输入两种入口都归一到「算子」键
    c["算子"] = val;
    if (NO_VALUE_OPS.includes(val)) c["值"] = "";   // 无值算子（为空/非空）清空残留值
    delete c["op"];
  }
  log("修改过滤条件", `${curStage} 第 ${ri+1} 行 条件${ci+1}.${key}=${val}`);
  renderPanel(); scheduleSave();
}

function updateStaticCell(ri, ci, val) {
  if (EDIT_LOCK) { roHint(); renderStaticPanel(); return; }   // 编辑锁守卫（纵深防御）：只读态拒绝写回
  const st = (CONFIG["静态数据"] || {})[curStatic];
  if (!st) return;
  const row = st["行"][ri];
  if (!row) return;
  const prev = row[ci];
  let nv = val;
  if (typeof prev === "number") {
    const n = Number(val);
    nv = (val !== "" && !isNaN(n)) ? n : (val === "" ? "" : val);
  }
  if (nv === prev) return;
  pushHistory();
  row[ci] = nv;
  const header = st["表头"] || [];
  log("编辑静态单元格", `${curStatic} 第${ri+1}行 ${header[ci] ?? ci} = ${nv}`);
  scheduleSave();
}

/* ★「导入字典 / 补全名称」手动工具已移除（用户 2026-11-06 定，按钮随工具条精简一并下线）；
   名称空缺的橙色 fill-pending 标识保留，仅作视觉提示。 */

/* ════════════════════════════════════════════════════════════════════════
   ═══ 5. IO 层 ═══  打开 / 保存 / 自动保存 / 覆盖前备份 / 句柄持久化 / 外部表读取
   ════════════════════════════════════════════════════════════════════════ */

/* ============ 加载 ============
   ○实现细节：加载优先级（http 打开时 fetch 同目录 JSON + Last-Modified 与缓存时间戳比新旧 →
   file:// 回退 localStorage → 空白模板）。
   注：「一个 html + 一个 JSON = 完整工具」是设计标准；具体加载策略可按部署方式调整 */
/* ============ 配置入口验货（2026-11-13 用户定） ============
   从磁盘 / 文件句柄 / 文件夹 / 配置源进入编辑器的 JSON 一律先过基本格式检验，
   不过就拒绝加载并逐条报问题——坏配置在门口拦住（0 脏单同思想），绝不带病进内部。
   口径（只做基本格式，不做语义校验）：
   ① 顶层必须是对象；② 「转换逻辑」必须是非空对象；③ 每个环节必须是对象、「说明」必须是字符串；
   ④ 「模式」若声明必须在合法词表内：五模式内部键（「规则」=短路表）+ 界面同名词「短路表」「键映射表」（存量 JSON 两种写法并存，
      stageModeKey 都按形态解析；「Key映射」旧值允许，加载时迁移）；
   ⑤ 「输出字段」必须是对象、「规则」必须是数组、「键映射」必须是对象（声明了才查，缺省走形态推断）；
   ⑥ 「静态数据」若声明必须是对象。 */
function configFormatProblems(obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return ["顶层不是 JSON 对象"];
  const logic = obj["转换逻辑"];
  if (!logic || typeof logic !== "object" || Array.isArray(logic) || !Object.keys(logic).length)
    return ["缺少「转换逻辑」或不是非空对象"];
  const P = [];
  const isPlainObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  Object.entries(logic).forEach(([k, st]) => {
    if (!isPlainObj(st)) { P.push(`环节「${k}」不是对象`); return; }
    if (typeof st["说明"] !== "string") P.push(`环节「${k}」缺少「说明」`);
    const m = st["模式"];
    if (m !== undefined && m !== "Key映射" && m !== "短路表" && m !== "键映射表" && MODE_KEYS.indexOf(m) < 0)
      P.push(`环节「${k}」的「模式」值「${m}」不在合法词表（短路表/过滤表/检测表/提示词/键映射表）`);
    if (st["输出字段"] !== undefined && !isPlainObj(st["输出字段"])) P.push(`环节「${k}」的「输出字段」不是对象`);
    if (st["规则"] !== undefined && !Array.isArray(st["规则"])) P.push(`环节「${k}」的「规则」不是数组`);
    if (st["键映射"] !== undefined && !isPlainObj(st["键映射"])) P.push(`环节「${k}」的「键映射」不是对象`);
  });
  if (obj["静态数据"] !== undefined && !isPlainObj(obj["静态数据"])) P.push("顶层「静态数据」不是对象");
  return P;
}
/* 验货闸门：通过返回 true；不过弹窗逐条列出问题（最多 10 条），返回 false——调用方不得继续 setConfig */
function gateConfigFormat(obj) {
  const P = configFormatProblems(obj);
  if (!P.length) return true;
  alert("配置未通过格式检验，已拒绝加载（共 " + P.length + " 处）：\n\n· " + P.slice(0, 10).join("\n· ") + (P.length > 10 ? "\n· …" : ""));
  return false;
}

function loadFile(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!gateConfigFormat(obj)) { ev.target.value = ""; return; }   // ★验货：不过不进（2026-11-13）
      // ★设计标准：载入比本地最后编辑更旧的文件前先确认——避免静默丢弃未保存编辑
      //   （注：本地不再存整份内容，仅比较「最后编辑时间戳」与「文件修改时间」）
      const auto = loadAuto();
      const fTime = f.lastModified || 0;
      const fmt = ts => new Date(ts).toLocaleString("zh-CN", { hour12: false });
      if (auto && auto.time && fTime && auto.time > fTime) {
        if (!confirm("本地有过编辑（最后编辑 " + fmt(auto.time) + "）晚于此文件修改时间 " + fmt(fTime) + "，\n载入此文件可能丢弃这些编辑。确定继续？")) {
          ev.target.value = "";
          return;
        }
      }
      setConfig(obj);
      saveAuto();
      openedFilePath = f.name;            // 记录载入文件名（供方案 C 保存助手定位同源文件；助手启动参数即该文件完整路径）
      httpSavePath = "";                  // 先清掉旧目标：仅当与源站同名文件逐字节一致时才重新启用
      adoptDiskBaseline(f.lastModified, f.size);   // ★#2010 乐观锁：加载成功即记录磁盘版本基线
      setAutoHint("已加载文件：" + f.name);
      tryMatchServerFile(f.name, e.target.result);   // ★服务器写回：与源站同名文件逐字节一致 → 保存改走 server.py（备份自动）
      ev.target.value = "";
    } catch (err) {
      alert("JSON 解析失败: " + err.message);
    }
  };
  rd.readAsText(f, "utf-8");
}

function newConfig() {
  // ○实现细节：空白模板内容（环节数量/命名）按项目写；「新建空白生成符合 schema 的空模板」是通用能力
  if (CONFIG && !confirm("新建空白配置将丢弃当前未保存的编辑，确定？")) return;

function setConfig(obj) {
  // schema 校验：版本不兼容则提示（不阻断，便于查看旧配置）
  const sv = obj && obj["schemaVersion"];
  if (sv && sv !== "V2") {
    setAutoHint(`⚠️ 配置 schemaVersion="${sv}" 与编辑器支持的 "V2" 不兼容，加载可能有误`);
  }
  const migratedDocs = migrateLegacyDocs(obj);
  const migratedKm = migrateLegacyKeyMap(obj);
  CONFIG = obj;
  UNDO_STACK = [];
  REDO_STACK = [];
  OP_LOG = [];
  if (migratedDocs) log("文档集合迁移", "顶层 README.md → 文档[0]「项目README」（仅内存，未写盘）");
  if (migratedKm) log("键映射迁移", "模式值/独占键 Key映射 → 键映射；扁平改名表 → 分桶（全部归单据头，#2013 V7，仅内存未写盘）");
  document.getElementById("appTitle").textContent = obj["标题"] || "规则链编辑器";
  refreshVersionUI();   // 「⋯」菜单版本两行 + 编辑器版本号落后红标（原顶栏 verBadge 已并入菜单）
  document.title = obj["标题"] || "规则链编辑器";
  // 默认选中第一个环节：环节级（检测表）模式无字段，否则选中第一个输出字段
  const logic = (obj["转换逻辑"] || {});
  curStage = stageKeys().find(k => logic[k]) || "";
  const stage = curStage ? logic[curStage] : null;
  curField = (stage && stage["输出字段"] && !isSingleRuleStage(curStage)) ? Object.keys(stage["输出字段"])[0] || "" : "";
  curStatic = obj["静态数据"] ? Object.keys(obj["静态数据"])[0] || "" : "";
  curDoc = 0;
  // 恢复上次的 UI 状态（环节/输出字段/静态表/视图/文档，校验存在性）
  const ui = loadUiState();
  if (ui) {
    if (ui.stage && logic[ui.stage]) curStage = ui.stage;
    const st2 = logic[curStage];
    if (!isSingleRuleStage(curStage) && ui.field && st2 && st2["输出字段"] && st2["输出字段"][ui.field]) curField = ui.field;
    else if (isSingleRuleStage(curStage)) curField = "";
    if (ui.static && obj["静态数据"] && obj["静态数据"][ui.static]) curStatic = ui.static;
    const docs = docsArray();
    if (Number.isInteger(ui.doc) && ui.doc >= 0 && ui.doc < docs.length) curDoc = ui.doc;
    else curDoc = 0;
    curView = (ui.view === "sop" && docs.length) ? "sop" : (ui.view === "static" && curStatic ? "static" : "rules");
  }
  // ★侧边栏板块选项卡记忆（用户 2026-11-13 定）：优先恢复上一次激活的选项卡（合法值校验），
  //   没存过就按当前视图对齐；两路都拿不到 → 缺省「转换环节」。
  curNavTab = (ui && ["docs", "stages", "static"].includes(ui.navTab)) ? ui.navTab : navTabOfView(curView);
  if (curNavTab !== "docs" && curNavTab !== "stages" && curNavTab !== "static") curNavTab = "stages";
  renderLeft();
  if (curView === "static" && curStatic) renderStaticPanel();
  else if (curView === "sop") showSOP();
  else renderPanel();
  saveUiState();
  markSaved();   // 加载/切换配置 = 干净态（是否已落盘取决于是否成功保存过）
}

/* 双击标题栏最左侧标题 → 原地变输入框编辑「标题」：Enter/失焦提交（写回 CONFIG、刷新 document.title、
   触发自动保存），Esc 取消。清空视为取消（不存空标题）；未改动不记日志、不触发保存。 */
function editAppTitle() {
  const h = document.getElementById("appTitle");
  if (h.querySelector("input")) return;   // 已在编辑中
  const old = CONFIG["标题"] || h.textContent;
  h.textContent = "";
  const inp = document.createElement("input");
  inp.className = "app-title-input";
  inp.value = old;
  h.appendChild(inp);
  inp.focus(); inp.select();
  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (save && v && v !== old) {
      CONFIG["标题"] = v;
      log("重命名标题", old + " → " + v);
      scheduleSave();
    }
    const shown = CONFIG["标题"] || "规则链编辑器";
    h.textContent = shown;
    document.title = shown;
  };
  inp.addEventListener("blur", () => commit(true));
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); done = true; h.textContent = old; document.title = old; }
  });
  inp.addEventListener("dblclick", (e) => e.stopPropagation());   // 输入框内再双击不重新触发
  inp.addEventListener("click", (e) => e.stopPropagation());
}

/* ============ 自动保存 / 恢复 ============
   ★设计标准：编辑即保存、刷新不丢（页面关闭/刷新后重开自动恢复上次配置）；配套「清除缓存」按钮一键回到初始。
   ○实现细节：localStorage 存 {__savedAt: 保存时间戳, config: 配置, diskLm: 上次从磁盘成功加载时
   记录的「磁盘文件 Last-Modified 基线」}。判定「外部是否改过磁盘文件」用「当前磁盘 lm 是否比 diskLm 基线新」，
   而非用「浏览器编辑时间 vs 文件 mtime」——后者会掩盖外部（IDE/脚本/git）对 JSON 的修改，
   导致刷新永远显示旧缓存。旧格式（裸 config）兼容读取。 */
/* ── 方案C：可配置配置源（base URL / 启动参数 / 文件选择对话框）──
   根因：原加载机制把 fetch 路径写死为相对 main-config.json，并把自动保存塞进单一全局键，
   导致编辑器被绑定到「自身所在目录」、且不同业务的缓存会串味。
   本方案：① 启动参数 ?config= / 持久默认源 / 文件对话框 三者解析有效源；
           ② 自动保存按「源」命名空间隔离（默认相对源沿用旧键以兼容历史缓存）。 */
let CUR_SRC_KEY = LS_KEY;                 // 当前配置源对应的自动保存键（按源命名空间）
function normalizeConfigUrl(u) {
  u = (u || "").trim();
  if (!u) return "main-config.json";
  const m = u.match(/^(dir|directory):(.+)$/i);
  if (m) { const d = m[2].replace(/[\\/]$/, ""); return d + "/main-config.json"; }
  return u;
}
function resolveConfigSource() {
  let url = null, from = "default";

/* ============ 夜间模式（#23） ============
   模式优先级：localStorage 'v2_theme'（auto / light / dark，默认 auto）
   · auto：系统 prefers-color-scheme:dark 命中 → 深色；否则按本地时间 06:00–18:00 为白天 → 浅色，其余深色
   · light / dark：强制
   实际主题写入 <html data-theme>，由 theme.css 的 [data-theme="dark"] 覆盖变量。 */
const LS_THEME = "v2_theme";
function themeActual() {
  let m = "auto";
  try { m = localStorage.getItem(LS_THEME) || "auto"; } catch (e) {}
  if (m === "dark") return "dark";
  if (m === "light") return "light";
  // auto：优先系统；系统未明确深色（含不支持/未设置）→ 时间兜底
  let sysDark = false;
  try { sysDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) {}

  return (h >= 6 && h < 18) ? "light" : "dark";

  const actual = themeActual();
  document.documentElement.setAttribute("data-theme", actual);
  const chip = document.getElementById("themeChip");
  if (chip) {
    let m = "auto";
    try { m = localStorage.getItem(LS_THEME) || "auto"; } catch (e) {}
    const map = { auto: "自动", light: "浅色", dark: "深色" };
    chip.textContent = "主题：" + map[m];
    chip.title = "当前外观模式：" + map[m] + "（实际：" + (actual === "dark" ? "深色" : "浅色") +
                 "）。点击循环 自动 → 浅色 → 深色";
  }
}
function cycleTheme() {
  let m = "auto";
  try { m = localStorage.getItem(LS_THEME) || "auto"; } catch (e) {}
  const next = m === "auto" ? "light" : (m === "light" ? "dark" : "auto");
  try { localStorage.setItem(LS_THEME, next); } catch (e) {}
  applyTheme();

}
let _themeMedia = null;
function bindThemeMedia() {
  try {
    if (_themeMedia && _themeMedia.removeEventListener) _themeMedia.removeEventListener("change", applyTheme);
    let m = "auto";
    try { m = localStorage.getItem(LS_THEME) || "auto"; } catch (e) {}
    if (m === "auto" && window.matchMedia) {
      _themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
      if (_themeMedia.addEventListener) _themeMedia.addEventListener("change", applyTheme);
    }
  } catch (e) {}
}

function saveAuto(diskLm) {

  //   配置真相只来自磁盘真实文件 / 已绑定文件句柄，避免「两份数据」导致硬刷新读缓存、不知存哪。
  try {

    const store = { __savedAt: Date.now(), diskLm: (diskLm !== undefined ? diskLm : (cur ? cur.diskLm : 0)) };
    localStorage.setItem(CUR_SRC_KEY, JSON.stringify(store));

function loadAuto() {

    const obj = JSON.parse(raw);
    return { time: obj.__savedAt || 0, diskLm: obj.diskLm || 0 };
  } catch (e) { return null; }

function scheduleSave() {
  /* ○实现细节：防抖 400ms 自动保存——「编辑即写回、刷新不丢」是设计标准。
     自动保存：仅记时间戳标记到 localStorage（不存整份内容，单一真相来自磁盘/句柄）；
     Edge/Chrome（支持文件系统访问 API）且已「打开 JSON」拿到句柄 → 静默写回磁盘（编辑即落盘，无需点保存）；

  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => {
    markDirty();         // 任何编辑防抖 → 标记「未保存*」（自动写回成功后 markSaved 复原）
    saveAuto();          // localStorage 兜底

    autoWriteSrv();      // ★HTTP 保存服务器模式（server.py）：静默写回 + 服务器端自动备份
  }, 400);

   但用户启动助手时传的就是它的完整路径，助手只认那份路径，所以二者天然对应）。 */

/* ============ ★#2010 落盘前乐观锁版本核对 ============
   缘由：旧页签把内存旧版整文件写回磁盘、静默覆盖外部改动（引擎运行/脚本/git 提交/自动化）已实锤多次。
   机制：加载成功 / 每次写盘成功时记录磁盘版本基线 diskBaseline(mtime+size)；
   三条写盘路径（句柄 / 保存助手 / 下载副本兜底）写回前先核对磁盘当前状态，
   与基线不符 = 磁盘已被外部修改 → 拒绝静默覆盖并提示「重新加载JSON」。 */
function adoptDiskBaseline(mtime, size) {
  diskBaseline = { mtime: mtime || 0, size: size || 0 };
}
/* 判断磁盘当前状态(cur)是否偏离基线。无基线（从未拿到过磁盘状态）→ 无法判定，不拦截。
   mtime 容差 2000ms（文件系统精度与浏览器 lastModified 取整误差）；size 严格相等。 */
function diskStale(cur) {
  if (!cur) return false;
  const b = diskBaseline || {};
  if (!b.mtime && !b.size) return false;
  if (b.size && cur.size != null && cur.size !== b.size) return true;
  if (b.mtime && cur.mtime && Math.abs(cur.mtime - b.mtime) > 2000) return true;
  return false;
}
function fmtStat(s) { return s ? ("mtime=" + s.mtime + " size=" + s.size) : "（未知）"; }
function refuseStaleOverwrite(manual, diskStat) {
  const msg = "磁盘文件已被外部修改（磁盘 " + fmtStat(diskStat) + " ≠ 编辑器已知版本），已拒绝写回以免覆盖新内容。\n请先「重新加载JSON」（⋯菜单），或确认磁盘内容后重试。";
  setAutoHint("⚠️ 已拒绝写回：" + msg);
  if (manual) alert("⚠️ " + msg);
  log("乐观锁拒写", fmtStat(diskStat));
}
/* 保存助手 /stat：拿磁盘当前版本（助手未运行 → null） */
async function helperStat() {
  try {
    const r = await fetch(`http://localhost:${SAVE_HELPER_PORT}/stat`, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return { mtime: j.mtime || 0, size: j.size || 0 };
  } catch (e) { return null; }
}

async function saveToServer(opts) {
  if (!openedFilePath) return false;        // 还没加载过文件，无法对应到磁盘路径
  // 浏览器原生支持写回（Chrome/Edge 已经走 openedFileHandle 分支了，不会到这里）
  if (window.showSaveFilePicker || openedFileHandle) return false;
  let alive = false;
  try {
    const r = await fetch(`http://localhost:${SAVE_HELPER_PORT}/`, { method: "GET", cache: "no-store" });
    alive = r.ok;
  } catch (e) { alive = false; }            // 助手没启动 → 落下载兜底
  if (!alive) return false;
  try {
    const res = await fetch(`http://localhost:${SAVE_HELPER_PORT}/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // ★#2010 乐观锁：带上「上次已知版本」，助手侧与磁盘实时比对，不一致 409 拒写
      body: JSON.stringify({ content: cfgText(),
                             client_mtime: (diskBaseline || {}).mtime || 0,
                             client_size: (diskBaseline || {}).size || 0 })
    });
    if (res.status === 409) {                 // ★磁盘已被外部修改 → 拒绝静默覆盖
      const j = await res.json().catch(() => ({}));
      refuseStaleOverwrite(opts && opts.manual, { mtime: j.mtime || 0, size: j.size || 0 });
      return "refused";
    }
    const j = await res.json();
    if (j && j.ok) {                        // 已直接覆盖原文件，成功
      adoptDiskBaseline(j.mtime, j.size);   // ★#2010：更新乐观锁基线为写盘后的磁盘版本
      // 助手端同样遵守「覆盖前备份」：把生成的副本名带回提示（无副本则说明未生成）
      setAutoHint("已通过保存助手写回原文件 ✅ " + new Date().toLocaleTimeString("zh-CN", { hour12: false })
        + (j.backup ? `｜覆盖前副本 → ${BACKUP_DIR_NAME}/${j.backup}` : "｜⚠️ 本次未生成覆盖前副本（内容未变或备份失败）"));
      return true;
    }
    setAutoHint("保存助手写入失败：" + (j && j.error || "未知错误"));
    return false;
  } catch (e) {
    setAutoHint("保存助手调用失败（" + (e && e.message || e) + "），请确认助手已启动");
    return false;
  }
}

/* ============ ★HTTP 保存服务器写回（推荐场景：server.py 静态+写回一体） ============
   缘由：浏览器文件句柄拿不到父目录 → 单文件打开时「备份」目录无法自动绑定，总要弹「未绑定备份目录」。
   方案：以 server.py 启动本地服务器（静态托管 + 写回 API）。编辑器在 http(s) 下：
   ① fetch 配置源加载成功 → 记住源站相对路径；② 「打开 JSON」选中文件 → 与源站同名文件逐字节比对，
   完全一致才启用（防错写同名异文件）。此后手动保存 / 防抖自动写回都走 POST /__editor_save：
   服务器端自动在 JSON 同目录创建「备份」文件夹并留覆盖前副本 —— 不再需要绑定备份目录。 */

/* 源站保存能力探测（结果缓存；普通静态服务器 / file:// → false，走原有写回链路） */
async function srvCap() {
  if (srvSaveOk !== null) return srvSaveOk;
  try {
    if (!/^https?:$/.test(location.protocol)) { srvSaveOk = false; return false; }
    const r = await fetch("/__editor_stat", { cache: "no-store" });
    const j = r.ok ? await r.json() : null;
    srvSaveOk = !!(j && j.server === "editor-save");
  } catch (e) { srvSaveOk = false; }
  return srvSaveOk;
}
/* 服务器 /stat：拿目标 JSON 当前磁盘版本（不可达 → null） */
async function srvStat(path) {
  try {
    const r = await fetch("/__editor_stat?path=" + encodeURIComponent(path), { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.ok) return null;
    return { mtime: j.mtime || 0, size: j.size || 0 };
  } catch (e) { return null; }
}
/* 经服务器写回：返回 true=成功 / "refused"=乐观锁拒写 / false=失败（调用方继续兜底） */
async function srvSave(silent) {
  if (!httpSavePath || !(await srvCap())) return false;
  const newTxt = cfgText();
  if (newTxt === lastWritten) return true;                 // 内容未变，跳过（不产生重复备份）
  const st = await srvStat(httpSavePath);
  if (st && diskStale(st)) {                               // ★#2010 乐观锁：写前核对磁盘版本
    refuseStaleOverwrite(!silent, st);
    return "refused";
  }
  let res;
  try {
    res = await fetch("/__editor_save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: httpSavePath, content: newTxt,
                             client_mtime: (diskBaseline || {}).mtime || 0,
                             client_size: (diskBaseline || {}).size || 0 })
    });
  } catch (e) { if (!silent) setAutoHint("服务器保存失败：" + ((e && e.message) || e)); return false; }
  if (res.status === 409) {                                // ★磁盘已被外部修改 → 拒绝静默覆盖
    const j = await res.json().catch(() => ({}));
    refuseStaleOverwrite(!silent, { mtime: j.mtime || 0, size: j.size || 0 });
    return "refused";
  }
  const j = await res.json().catch(() => null);
  if (res.ok && j && j.ok) {
    adoptDiskBaseline(j.mtime, j.size);                    // 基线 = 写盘后磁盘版本
    lastWritten = newTxt;
    lastSavedAt = Date.now();
    markSaved();
    saveAuto();
    if (!silent) {
      setAutoHint("已写回服务器文件 ✅ " + httpSavePath + " " + new Date().toLocaleTimeString("zh-CN", { hour12: false })
        + (j.backup ? `｜覆盖前副本 → ${BACKUP_DIR_NAME}/${j.backup}` : "｜⚠️ 本次未生成覆盖前副本（内容未变或备份失败）"));
    }
    return true;
  }
  if (!silent) setAutoHint("服务器保存失败：" + ((j && j.error) || ("HTTP " + res.status)));
  return false;
}
/* 服务器自动写回入口（串行，与 autoWriteHandle 同构） */
async function autoWriteSrv() {
  if (!httpSavePath) return;
  if (srvWriting) { srvPending = true; return; }
  srvWriting = true;
  const r = await srvSave(true);
  srvWriting = false;
  if (srvPending) { srvPending = false; autoWriteSrv(); }
  return r;
}
/* 「打开 JSON」选中文件后：与源站同名文件逐字节比对，完全一致才启用服务器写回（防错写同名异文件） */
async function tryMatchServerFile(fileName, txt) {
  try {
    if (!fileName || !(await srvCap())) return;
    const r = await fetch(fileName, { cache: "no-store" });
    if (!r.ok) return;
    const srvTxt = await r.text();
    if (srvTxt !== txt) return;
    httpSavePath = fileName;
    setAutoHint("已匹配服务器同名文件：" + fileName + " —— 保存走服务器写回，覆盖前自动留副本到同目录「" + BACKUP_DIR_NAME + "」文件夹（无需绑定备份目录）");
  } catch (e) {}
}

function markSaved() {
  const b = document.getElementById("saveBtn");
  if (b) { b.classList.remove("dirty"); b.style.background = "#2e7d32"; b.textContent = "💾 已保存"; }
}
function markDirty() {
  const b = document.getElementById("saveBtn");
  if (b && !b.classList.contains("dirty")) { b.classList.add("dirty"); b.style.background = "#e0532a"; b.textContent = "💾 保存*"; }
}

function showRaw() {
  if (!CONFIG) { alert("请先加载或新建配置"); return; }
  document.getElementById("modalTitle").textContent = "原始 JSON（主转换逻辑.json）";
  document.getElementById("modalBody").textContent = cfgText();
  document.getElementById("modalMask").classList.add("show");
}

function copyJSON() {
  const t = document.getElementById("modalBody").textContent;
  navigator.clipboard.writeText(t).then(() => alert("已复制"));
}

function closeModal() { document.getElementById("modalMask").classList.remove("show"); }

/* ============ 保存 / 查看 ============ */
/* 手动保存前的备份目录绑定确认：借这次用户手势问一次并绑定（覆盖前才会留副本），取消则本次直接保存 */
async function confirmBindBackupDir() {
  if (!(openedFileHandle && !backupDirHandle && window.showDirectoryPicker)) return;
  await new Promise((resolve) => {
    openConfirm(
      `尚未绑定「${BACKUP_DIR_NAME}」备份目录：覆盖原文件前不会留副本。\n`
      + `是否现在选择 JSON 所在目录（如配置目录）以启用覆盖前备份？\n`
      + `（选定后会在该目录内创建/使用「${BACKUP_DIR_NAME}」文件夹；取消则本次直接覆盖，不留副本。）`,
      async () => { await bindBackupDir(); resolve(); },
      () => resolve(),
      "选择目录并启用"
    );
  });
}

/* ② 系统原生「另存为」窗（Chrome/Edge）：用户手动选回原文件覆盖；记住句柄 → 之后「保存」直接写回，不再弹窗。
   返回 true = 已处理（成功或用户取消），false = 失败需继续兜底 */
async function saveViaSaveFilePicker() {
  try {
    const suggestName = (openedFileHandle && openedFileHandle.name) ? openedFileHandle.name : "主转换逻辑.json";
    const newTxt = cfgText();
    // ★覆盖前备份：本轮会替换掉旧文件内容，先把即将被覆盖的旧内容留一份到「备份」目录
    let bk2 = { ok: false, skip: true, reason: "无旧文件句柄" };
    if (openedFileHandle) {
      try {
        const oldFile = await openedFileHandle.getFile();
        // ★#2010 乐观锁：另存为选回原文件覆盖前，同样核对磁盘版本
        if (diskStale({ mtime: oldFile.lastModified, size: oldFile.size })) {
          refuseStaleOverwrite(true, { mtime: oldFile.lastModified, size: oldFile.size });
          return true;
        }
        bk2 = await writeBackup(await oldFile.text(), newTxt, false);
      } catch (e) { bk2 = { ok: false, reason: "读取覆盖前内容失败：" + ((e && e.message) || e) }; }
    }
    const handle = await window.showSaveFilePicker({
      suggestedName: suggestName,
      types: [{ description: "JSON 文件 (.json)", accept: { "application/octet-stream": [".json"] } }]
    });
    const w = await handle.createWritable();
    await w.write(newTxt);
    await w.close();
    openedFileHandle = handle;       // 记住，下次直接写回，不再弹窗
    lastWritten = "";                // 新句柄 → 强制下一笔写盘
    try { const nf = await handle.getFile(); adoptDiskBaseline(nf.lastModified, nf.size); } catch (e) {}   // ★#2010 基线
    idbSet("openedFileHandle", handle).catch(() => {});  // 持久化句柄：刷新后自动保存仍指向此文件
    lastSavedAt = Date.now();
    markSaved();
    saveAuto();
    setAutoHint("已保存到所选文件 ✅ " + (handle.name || "") + " " + new Date().toLocaleTimeString("zh-CN", { hour12: false })
      + (bk2.ok ? `｜覆盖前副本 → ${BACKUP_DIR_NAME}/${bk2.name}` : ""));
    return true;
  } catch (e) {
    if (e && e.name === "AbortError") return true;  // 用户取消存盘
    setAutoHint("系统存盘窗失败（" + (e && e.message || e) + "），转下载副本");
    return false;
  }
}

/* ④ 兜底 B：浏览器既无句柄、也无系统存盘窗（如 Safari/Firefox）→ 下载副本（需手动替换磁盘文件）
   ★#2010：下载副本虽不直接覆盖原文件，但用户很可能拿它手动替换 → 下载前同样核对磁盘版本，
   不一致先确认（用户明确坚持才下载），避免「下载旧版 → 手动覆盖新版」绕过乐观锁。 */
async function downloadJSONCopy(hint) {
  if (openedFilePath) {
    const st = await helperStat();
    if (st && diskStale(st)) {
      const ok = confirm("⚠️ 磁盘文件已被外部修改（磁盘 " + fmtStat(st) + " ≠ 编辑器已知版本）。\n"
        + "此下载副本可能基于旧版内容，手动替换将覆盖磁盘上的新内容。\n建议先「重新加载JSON」。\n\n仍要下载副本吗？");
      if (!ok) { setAutoHint("已取消下载副本（磁盘版本与编辑器内存不一致，请先「重新加载JSON」）"); return; }
    }
  }
  const blob = new Blob([cfgText()], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "主转换逻辑.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setAutoHint(hint);
}

/* 保存优先级：① 以「打开 JSON」获得的句柄直接写回原文件（Chrome/Edge，file:// 或 http 均可，无需服务器）
   ③ 本地「保存助手」覆盖原文件 → ② 系统「另存为」窗手动选回原文件 → ④ 都不满足（Safari/Firefox）→ 下载副本 */
async function saveJSON() {
  if (!CONFIG) { alert("请先加载或新建配置"); return; }
  // ⓪ HTTP 保存服务器模式（server.py）：写回 + 服务器端自动备份，无需绑定备份目录；不可用/失败 → 落回原有链路
  if (httpSavePath) {
    const ok0 = await srvSave(false);
    if (ok0 === "refused") return;                     // ★#2010 乐观锁拒写：到此为止
    if (ok0 === true) return;
  }
  await confirmBindBackupDir();
  if (openedFileHandle && openedFileHandle.createWritable) {
    if (await writeToHandle(false)) return;          // ① 写回失败 → 落到下载副本兜底
  }
  const ok = await saveToServer({ manual: true });   // ③ 助手端同样先留覆盖前副本；助手未运行 → false 继续往下
  if (ok === "refused") return;                      // ★#2010 乐观锁拒写：到此为止，绝不落下载副本兜底
  if (ok === true) { saveAuto(); markSaved(); lastSavedAt = Date.now(); return; }
  if (window.showSaveFilePicker && await saveViaSaveFilePicker()) return;   // ②
  await downloadJSONCopy("此浏览器不支持直接写回：已下载副本——请手动覆盖磁盘文件");   // ④
}

/* ============ 句柄自动写回（Edge/Chrome） ============
   ○实现细节：FileSystemFileHandle 可存入 IndexedDB（结构化克隆）→ 刷新页面后句柄不丢；
   权限 granted 则「编辑即静默写回磁盘」（无 toast，按钮状态即反馈）；内容未变跳过写盘。
   手动「保存」走同一 writeToHandle(false)（可弹权限请求 + 成功 toast）。 */
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("scEditor", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, key);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction("kv", "readonly").objectStore("kv").get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}

/* ============ 覆盖前备份（JSON 同目录「备份」文件夹） ============
   ★设计标准：任何一次落盘（自动保存 / 手动保存）在覆盖原文件之前，先把「磁盘上即将被覆盖的旧内容」
   原样写一份到 JSON 同目录的「备份」子目录；目录不存在则当场创建。
   缘由：支持自动保存的浏览器里，一次误改会立刻写回磁盘且无法回退——备份目录是唯一的事后找回手段。
   ○实现细节：备份目录句柄来自目录授权（getDirectoryHandle("备份", {create:true})）——
   ①「⋯」→「打开目录（启用覆盖前备份）」时取得；② 直接选文件打开时，若「上次授权的目录」里存在同名
   文件则静默复用（tryReuseBackupDir）；③ 都没有则置空，首次手动「保存」时引导绑定（bindBackupDir）。
   存 IndexedDB 随文件句柄一起恢复；文件句柄本身拿不到父目录，故自动备份必须由目录授权提供。
   备份内容 = 覆盖前的磁盘原文（保留原格式，可直接改回文件名还原）；连续两次待备份内容相同则跳过，不落重复副本。 */

/* 备份文件名：原名去扩展 + 本地时间戳（秒级），如 主转换逻辑_20260923_170412.json */
function backupFileName(baseName) {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  const ts = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  return `${String(baseName || "主转换逻辑.json").replace(/\.json$/i, "")}_${ts}.json`;
}
/* 同一秒内多次覆盖 → 依次追加 _2 / _3…，绝不因重名而覆盖掉上一份备份 */
async function pickFreeBackupName(dir, baseName) {
  const root = backupFileName(baseName);
  let name = root;
  for (let i = 2; i <= 99; i++) {
    let exists = true;
    try { await dir.getFileHandle(name); }        // 默认 create:false → 抛 NotFoundError 即表示名字可用
    catch (e) { exists = false; }
    if (!exists) return name;
    name = root.replace(/\.json$/i, `_${i}.json`);
  }
  return root.replace(/\.json$/i, `_${Date.now()}.json`);
}

/* 写一份覆盖前副本。返回 {ok, name} 或 {ok:false, reason}；
   失败绝不阻断主保存（由调用方高亮提示），但不静默跳过。 */
async function writeBackup(oldText, newText, silent) {
  if (!backupDirHandle) return { ok: false, reason: "未绑定备份目录（JSON 同目录）" };
  if (oldText === null || oldText === undefined) return { ok: false, reason: "读不到覆盖前内容" };
  if (oldText === newText) return { ok: false, skip: true, reason: "内容未变" };
  if (oldText === lastBackupText) return { ok: false, skip: true, reason: "与上一份备份相同" };
  try {
    let perm = await backupDirHandle.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
    if (perm !== "granted") {
      if (silent) return { ok: false, reason: "备份目录未授权（点「保存」可重新授权）" };
      perm = await backupDirHandle.requestPermission({ mode: "readwrite" }).catch(() => "denied");
      if (perm !== "granted") return { ok: false, reason: "备份目录未授权" };
    }
    const name = await pickFreeBackupName(backupDirHandle, openedFileHandle && openedFileHandle.name);
    const fh = await backupDirHandle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(oldText);
    await w.close();
    lastBackupText = oldText;
    backupCount++;
    return { ok: true, name };
  } catch (e) {
    return { ok: false, reason: "备份写入失败：" + ((e && e.message) || e) };
  }
}

/* 绑定（或重绑）备份目录：用 showDirectoryPicker 让用户选 JSON 所在目录，当场创建/取用「备份」子目录。
   必须在用户手势内调用（确认框按钮点击即手势）。成功返回 true。 */
async function bindBackupDir() {
  if (!window.showDirectoryPicker) return false;
  try {
    const dir = await window.showDirectoryPicker({ mode: "readwrite", id: "backup-dir", startIn: openedFileHandle || undefined });
    backupDirHandle = await dir.getDirectoryHandle(BACKUP_DIR_NAME, { create: true });
    idbSet("backupDirHandle", backupDirHandle).catch(() => {});
    lastBackupText = "";
    backupWarned = false;
    return true;
  } catch (e) {
    return false;                                  // 用户取消 / 无权限
  }
}

/* 统一写回：silent=true 自动保存（权限 prompt 不请求、成功无 toast、失败仍提示）；
   silent=false 手动保存（可请求权限，成功有 toast）。返回是否已写盘 */
async function writeToHandle(silent) {
  const h = openedFileHandle;
  if (!h || !h.createWritable || !CONFIG) return false;
  try {
    const perm = await h.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
    if (perm !== "granted") {
      if (silent) return false;                                  // 自动保存不弹权限请求
      const req = await h.requestPermission({ mode: "readwrite" }).catch(() => "denied");
      if (req !== "granted") throw new Error("未授权写入");
    }
    const txt = cfgText();
    if (txt === lastWritten) return true;                        // 内容未变，跳过写盘
    // ★#2010 乐观锁：写盘前核对磁盘版本——已被外部修改则拒绝静默覆盖（拒写即视为已处理，不再走兜底）
    let f0 = null;
    try { f0 = await h.getFile(); } catch (e) {}
    if (f0 && diskStale({ mtime: f0.lastModified, size: f0.size })) {
      refuseStaleOverwrite(!silent, { mtime: f0.lastModified, size: f0.size });
      return true;
    }
    // ★覆盖前备份：先读磁盘旧内容 → 写一份到「备份」目录（失败不阻断保存，但高亮告知）
    let bk = { ok: false, reason: "未读取覆盖前内容" };
    try {
      const oldText = f0 ? await f0.text() : await (await h.getFile()).text();
      bk = await writeBackup(oldText, txt, silent);
    } catch (e) { bk = { ok: false, reason: "读取覆盖前内容失败：" + ((e && e.message) || e) }; }
    if (!bk.ok && !bk.skip && !(silent && bk.reason.indexOf("未绑定备份目录") === 0 && backupWarned)) {
      if (silent && bk.reason.indexOf("未绑定备份目录") === 0) backupWarned = true;
      setAutoHint("⚠️ 覆盖前副本未生成（" + bk.reason + "）——本次仍写入原文件");
    }
    const w = await h.createWritable();
    await w.write(txt);
    await w.close();
    lastWritten = txt;
    lastSavedAt = Date.now();
    try { const f2 = await h.getFile(); adoptDiskBaseline(f2.lastModified, f2.size); } catch (e) {}   // ★#2010 基线=写盘后磁盘版本
    markSaved();
    saveAuto();
    if (!silent) {
      setAutoHint("已直接保存回打开的 JSON 文件 ✅ " + new Date().toLocaleTimeString("zh-CN", { hour12: false })
        + (bk.ok ? `｜覆盖前副本 → ${BACKUP_DIR_NAME}/${bk.name}` : `｜⚠️ 未生成覆盖前副本（${bk.reason}）`));
    }
    return true;
  } catch (e) {
    setAutoHint("写入原文件失败（" + e.message + "）" + (silent ? "——自动保存中断，请点「保存」重试" : "，转下载副本"));
    return false;
  }
}

/* 自动写回入口：写入串行（上一笔未落盘时挂 pending，完成后补写一笔最新内容） */
async function autoWriteHandle() {
  if (!openedFileHandle) return;
  if (handleWriting) { handlePending = true; return; }
  handleWriting = true;
  await writeToHandle(true);
  handleWriting = false;
  if (handlePending) { handlePending = false; autoWriteHandle(); }
}

/* 直接选单个 JSON 文件（showOpenFilePicker）——★「打开 JSON」按钮的主路径。
   抽出为独立函数，供：① 顶栏「打开 JSON」直接调用 ② 目录里找不到配置时回退。
   注意：单文件句柄拿不到父目录 → 备份目录无法自动绑定，故尽力用「上次授权的目录」(lastDirHandle)
   复用：若该目录里存在同名文件，视为同一处，直接复用其下「备份」子目录（见 bindBackupFromDir）。
   实在复用不了则 backupDirHandle 置空（点「保存」时会引导绑定）。 */
async function openSingleFile() {
  if (!window.showOpenFilePicker) return false;
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "JSON 文件 (.json)", accept: { "application/octet-stream": [".json"] } }],
      excludeAcceptAllOption: false,
      startIn: lastDirHandle || undefined      // ★记住上次打开的目录，对话框直接落在该处
    });
    const file = await handle.getFile();
    const txt = await file.text();
    let obj;
    try { obj = JSON.parse(txt); }
    catch (e) { alert("JSON 解析失败: " + e.message); return true; }
    if (!gateConfigFormat(obj)) return true;            // ★验货：不过不进（2026-11-13）
    openedFileHandle = handle;
    lastWritten = "";
    httpSavePath = "";                                   // 先清掉旧目标：仅当与源站同名文件逐字节一致时才重新启用
    adoptDiskBaseline(file.lastModified, file.size);   // ★#2010 乐观锁基线
    lastBackupText = "";
    backupWarned = false;
    const prevBackup = backupDirHandle;      // 上次会话恢复的备份目录（可能仍适用于本次打开的文件）
    backupDirHandle = null;
    idbSet("openedFileHandle", handle).catch(() => {});
    setConfig(obj);
    CUR_SRC_KEY = configSrcKey("file:" + (file.name || "main-config.json"));   // 方案C：按文件名命名空间自动保存
    saveAuto();
    markSaved();
    // ★尽力复用备份目录（不弹窗、不打断）：认不出就只提示，绝不强制用户选文件夹
    const bk = await tryReuseBackupDir(handle.name, prevBackup);
    setAutoHint("已打开（可写）" + (file.name || "JSON") + " —— 编辑将自动写回此文件；"
      + (bk ? `覆盖前副本 → ${BACKUP_DIR_NAME}/（${bk}）` : "未绑定备份目录，点「保存」可绑定"));
    tryMatchServerFile(file.name, txt);                  // ★服务器写回：与源站同名文件逐字节一致 → 保存改走 server.py（备份自动）
    return true;
  } catch (e) {
    if (e && e.name === "AbortError") return true;   // 用户取消：也算处理过，不再报错
    setAutoHint("打开失败：" + ((e && e.message) || e));
    return false;
  }
}

/* 尽力复用备份目录，全程静默、不弹任何选择框。返回一句说明（空串 = 未绑定）：
   ①「上次授权的目录」里存在同名 JSON → 判定同处一地，直接创建/取用其下「备份」子目录；
   ② 判不出来但上次会话恢复过备份目录句柄 → 沿用（写到旧位置也胜过完全没有副本），
      用户点「保存」时可重新绑定到正确目录；
   ③ 都没有 → 置空，状态栏提示「点保存可绑定」。 */
async function tryReuseBackupDir(fileName, prevBackup) {
  if (lastDirHandle && fileName) {
    try {
      await lastDirHandle.getFileHandle(fileName);          // 同名文件存在 → 就是它所在的目录
      backupDirHandle = await lastDirHandle.getDirectoryHandle(BACKUP_DIR_NAME, { create: true });
      idbSet("backupDirHandle", backupDirHandle).catch(() => {});
      return "按上次目录绑定";
    } catch (e) { /* 不在该目录 / 无权限 → 继续看能否沿用 */ }
  }
  if (prevBackup && prevBackup.getDirectoryHandle) {
    backupDirHandle = prevBackup;                          // 沿用上次恢复的备份目录，不清空
    return "沿用上次的备份目录";
  }
  backupDirHandle = null;
  return "";
}

/* 目录内定位配置：优先 主转换逻辑.json，取不到则第一个 .json。返回 {handle, name, dir} */
async function findJsonInDir(dir) {
  try { return { handle: await dir.getFileHandle("主转换逻辑.json"), name: "主转换逻辑.json", dir }; }
  catch (e) {}
  try {
    for await (const ent of dir.values()) {
      if (ent.kind === "file" && /\.json$/i.test(ent.name)) return { handle: ent, name: ent.name, dir };
    }
  } catch (e) {}
  return { handle: null, name: "", dir };
}

/* 一层子目录名（跳过隐藏目录与备份目录） */
async function subDirNames(dir) {
  const subs = [];
  try {
    for await (const ent of dir.values()) {
      if (ent.kind !== "directory") continue;
      if (ent.name === BACKUP_DIR_NAME || ent.name.startsWith(".")) continue;
      subs.push(ent.name);
    }
  } catch (e) {}
  return subs;
}

/* ★顶层没找到 → 向下一层子目录找（用户常选到项目根目录，而配置实际放在工作空间根目录）
   两遍扫描：① 先找子目录里的「主转换逻辑.json」（优先，避免误取 output/ 里的源单 JSON）
             ② 都没有才退而取子目录里第一个 .json。返回 {handle, name, dir}（dir 为命中的子目录） */
async function findJsonInSubs(dir, subs) {
  for (const sn of subs) {                       // 第一遍：主转换逻辑.json
    try {
      const sub = await dir.getDirectoryHandle(sn);
      return { handle: await sub.getFileHandle("主转换逻辑.json"), name: sn + "/主转换逻辑.json", dir: sub };
    } catch (e) {}
  }
  for (const sn of subs) {                       // 第二遍：第一个 .json
    try {
      const sub = await dir.getDirectoryHandle(sn);
      for await (const e2 of sub.values()) {
        if (e2.kind === "file" && /\.json$/i.test(e2.name)) {
          return { handle: e2, name: sn + "/" + e2.name, dir: sub };
        }
      }
    } catch (e) {}
  }
  return { handle: null, name: "", dir };
}

/* 载入目录内定位到的配置：解析 → 记住句柄（刷新后可恢复自动写回）→ 绑定同目录「备份」子目录 → 渲染 */
async function loadFromDirHandle(handle, name, dir) {
  let obj;
  let f0 = null;
  try { f0 = await handle.getFile(); obj = JSON.parse(await f0.text()); }
  catch (e) { alert("JSON 解析失败: " + ((e && e.message) || e)); return true; }
  if (!gateConfigFormat(obj)) return true;              // ★验货：不过不进（2026-11-13）
  openedFileHandle = handle;
  lastWritten = "";
  httpSavePath = "";                     // 目录授权模式：备份目录由句柄直接绑定，写回走句柄，不启用服务器写回
  adoptDiskBaseline(f0.lastModified, f0.size);   // ★#2010 乐观锁基线
  lastBackupText = "";
  backupWarned = false;
  lastDirHandle = dir;                                  // ★记住此目录，供后续「选文件」对话框定位
  idbSet("openedFileHandle", handle).catch(() => {});
  idbSet("lastDirHandle", dir).catch(() => {});
  // ★备份子目录：不存在当场创建；失败不阻断打开（备份能力缺失，保存时会提示）
  let bkInfo = "备份目录创建失败（覆盖前不会留副本）";
  try {
    backupDirHandle = await dir.getDirectoryHandle(BACKUP_DIR_NAME, { create: true });
    idbSet("backupDirHandle", backupDirHandle).catch(() => {});
    bkInfo = `覆盖前副本 → ${BACKUP_DIR_NAME}/`;
  } catch (e) { backupDirHandle = null; }
  setConfig(obj);
  CUR_SRC_KEY = configSrcKey("dir:" + name);   // 方案C：按文件名命名空间自动保存
  saveAuto();
  markSaved();
  setAutoHint("已打开（可写）" + name + "，编辑自动写回；" + bkInfo);
  return true;
}

/* 选目录 → 目录内（含一层子目录）定位配置 → 载入。返回 true = 已处理（调用方不再回退） */
async function openViaDirPicker() {
  if (!window.showDirectoryPicker) return false;
  let dir = null;
  try {
    dir = await window.showDirectoryPicker({ mode: "readwrite", id: "json-dir", startIn: lastDirHandle || undefined });
  } catch (e) {
    if (e && e.name === "AbortError") return true;             // 用户取消
    setAutoHint("目录选择失败（" + ((e && e.message) || e) + "），改用单文件方式");
  }
  if (!dir) return false;
  let found = await findJsonInDir(dir);
  if (!found.handle) found = await findJsonInSubs(dir, await subDirNames(dir));
  if (!found.handle) {
    // 目录里（含一层子目录）确实没有 → 回退为「直接选文件」而不是干瞪眼报错
    if (window.showOpenFilePicker && await openSingleFile()) return true;
    alert("所选目录（含一层子目录）内没有 .json 配置文件——请选择存放「主转换逻辑.json」的目录（如配置目录）");
    return true;
  }
  return await loadFromDirHandle(found.handle, found.name, found.dir);
}

/* 「打开 JSON」：★主路径改为「直接选 JSON 文件」（用户诉求：不要再强制选文件夹）。
   顺序：① showOpenFilePicker 选单个 .json（可写回原文件）
        ② 浏览器不支持选文件 API → 退回选目录（顺带拿到备份目录授权）
        ③ 两者皆无（Safari/Firefox）→ 安全回退为只读加载（走 fileInput）。
   「选目录」不再消失，改为「⋯」菜单里的「打开目录（启用覆盖前备份）」，需要时才走。
   注：单文件句柄拿不到父目录，故尽力用上次授权的目录复用备份（tryReuseBackupDir），
       复用不了只是提示「未绑定备份目录」，不阻断打开、不强制选文件夹。 */
async function openViaPicker() {
  if (window.showOpenFilePicker && await openSingleFile()) return;
  if (window.showDirectoryPicker) { await openViaDirPicker(); return; }
  document.getElementById("fileInput").click();   // 都不支持 → 回退到原来的只读加载
}

/* ============ 名称补全：CSV 字典（已下线，用户 2026-11-06 定） ============
   「导入字典 / 补全名称」按钮移除后，本节 loadNameDict / saveNameDict / parseDictCSV /
   importNameDict 一并删除；历史 localStorage 键（v2_namedict_*）留存不影响运行。 */

async function loadExternalRows(name) {
  if (EXT_ROWS[name]) return EXT_ROWS[name];
  const t = (CONFIG["静态数据"] || {})[name] || externalTables()[name];
  if (!t || !t["来源"]) return null;
  try {
    const r = await fetch(t["来源"], { cache: "no-store" });
    if (!r.ok) return null;
    const data = await r.json();
    const tbl = (data && data["表"]) ? (data["表"][t["键"] || name]) : data;
    EXT_ROWS[name] = (tbl && tbl["行"]) || [];
    return EXT_ROWS[name];
  } catch (e) { return null; }
}

/* ════════════════════════════════════════════════════════════════════════
   ═══ 6. 初始化与测试钩子 ═══  DOMContentLoaded 初始化 + getConfigForTest/getLogForTest（★仅供探针，勿删改名）
   ════════════════════════════════════════════════════════════════════════ */

/* 测试/调试用：返回当前配置的深拷贝 */
function getConfigForTest() { return JSON.parse(JSON.stringify(CONFIG)); }
function getLogForTest() { return JSON.parse(JSON.stringify(OP_LOG)); }

/* ============ 初始化 ============
   ○实现细节：加载优先级（http 打开时 fetch 同目录「主转换逻辑.json」，与 localStorage 自动保存
   比时间戳（磁盘 Last-Modified vs 缓存 __savedAt）取更新者——服务掉线期间的缓存编辑不丢；
   file:// 或无 fetch → 回退 localStorage 自动保存；都没有 → 空白模板）。
   注：a href 引用本文件作为范式蓝本时（无配套 JSON），打开会自动落到「空白模板」——可在浏览器里直接体验全部交互 */
window.addEventListener("DOMContentLoaded", () => {
  initVarAutocomplete();
  applyEditLock();                 // 编辑锁默认只读（用户 2026-11-07 定）：同步 body class + 顶栏按钮两态
  applyTheme();                    // 刷新主题芯片文案 + 与首屏防闪脚本保持一致
  bindThemeMedia();                // 自动模式下跟随系统主题实时切换
  /* ★Edge/Chrome 自动保存：从 IndexedDB 恢复上次「打开 JSON」的文件句柄 与「备份」目录句柄。
     权限 granted → 编辑即静默写回磁盘（无需再点保存），且覆盖前自动留副本；
     权限被浏览器重置为 prompt → 首次点击时（合规用户手势）重新请求授权，授权前自动写回/备份暂不生效。 */
  (async () => {
    try {
      const h = await idbGet("openedFileHandle");
      if (h && h.createWritable) {
        openedFileHandle = h;
        lastWritten = "";
        const perm = await h.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
        // ★#2010 乐观锁：恢复句柄后立即记录磁盘版本基线（权限 granted 才读得到），
        //   堵住「刷新后基线未知 → 第一笔自动保存绕过核对」的口子
        if (perm === "granted") {
          try { const f = await h.getFile(); adoptDiskBaseline(f.lastModified, f.size); } catch (e) {}
        }
        if (perm !== "granted") {
          const grant = async () => {
            const p = await h.requestPermission({ mode: "readwrite" }).catch(() => "denied");
            if (p === "granted") {
              try { const f = await h.getFile(); adoptDiskBaseline(f.lastModified, f.size); } catch (e) {}   // ★#2010
              autoWriteHandle();       // 授权成功，立即补写当前内容
            }
          };
          window.addEventListener("pointerdown", grant, { once: true });
        }
      }
      const ldh = await idbGet("lastDirHandle");   // ★上次授权目录：仅作「选文件」对话框起始位置与备份复用线索
      if (ldh && ldh.getDirectoryHandle) lastDirHandle = ldh;
      /* ★文件夹默认源（用户 2026-11-07）：恢复上次「源」弹窗选定的目录句柄。
         权限 granted → 直接按文件夹载入（优先级高于同目录 fetch，loadConfigFromSource 侧有护栏）；
         权限 prompt → 先按方案C正常加载，首次点击（合规手势）补授权后再切换到文件夹源。 */
      const cdh = await idbGet("configDirHandle");
      if (cdh && cdh.getDirectoryHandle) {
        const cperm = await cdh.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
        const loadDirSrc = async () => {
          const found = await findJsonInDir(cdh);
          if (!found.handle) return;
          SRC_DIR_ACTIVE = cdh;
          const nm = (await idbGet("configDirName")) || found.name;
          await loadFromDirHandle(found.handle, found.name, found.dir);
          SRC_DIR_NAME = nm;
          setSrcDirChip(nm, true);
        };
        if (cperm === "granted") { await loadDirSrc(); }
        else window.addEventListener("pointerdown", async () => {
          const p = await cdh.requestPermission({ mode: "readwrite" }).catch(() => "denied");
          if (p === "granted") await loadDirSrc();
        }, { once: true });
      }
      const bh = await idbGet("backupDirHandle");
      if (bh && bh.getDirectoryHandle) {
        backupDirHandle = bh;
        const bp = await bh.queryPermission({ mode: "readwrite" }).catch(() => "prompt");
        if (bp !== "granted") {
          // 授权前自动保存仍可写盘，只是覆盖前不留副本；首次点击（手势）时补授权
          window.addEventListener("pointerdown", async () => {
            const p = await bh.requestPermission({ mode: "readwrite" }).catch(() => "denied");
            if (p === "granted") { lastBackupText = ""; backupWarned = false; }
          }, { once: true });
        }
      }
    } catch (e) { /* IndexedDB 不可用（隐私模式等）→ 静默放弃句柄恢复 */ }
  })();
  // 方案C：解析有效配置源（启动参数 ?config= > 持久默认源 > 同目录默认），按源命名空间加载
  const startupSrc = resolveConfigSource();
  CUR_SRC_KEY = configSrcKey(startupSrc.url);
  updateSrcChip(startupSrc);
  loadConfigFromSource(startupSrc);
  refreshVersionUI();   // 启动即刷菜单版本行（未加载时显示「未加载」，编辑器版本行与配置无关）

  // 键盘快捷键：Ctrl/Cmd+Z 撤销；Ctrl/Cmd+Shift+Z 或 Ctrl/Cmd+Y 重做；Ctrl/Cmd+S 保存
  document.addEventListener("keydown", e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === "z") {
      e.preventDefault();
      if (e.shiftKey) doRedo(); else doUndo();
    } else if (k === "y") {
      e.preventDefault();
      doRedo();
    } else if (k === "s") {
      e.preventDefault();
      saveJSON();
    }
  });
});

</script>
</body>

</html>
